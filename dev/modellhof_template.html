function geschirrScore(sc){ return sc>=85?"s5":sc>=70?"s4":sc>=55?"s3":sc>=40?"s2":sc>=20?"s1":"s0"; }

function zeigeGeschirr(){
  blattLive("🧰 Agentenwerkstatt",()=>{
    const ohneForschung=!forschungFrei("geschirr");   /* Ära 9: das Basis-Tool geht ab Tag 1, Spezial-Tools mit der Forschung */
    const lvl=hofLevel().i;
    const eigene=S.tiere.filter(p=>p.status==="frei"||p.status==="job"||p.status==="schulung");   /* Ära 9: Modelle im Kurs zeigen den Fortschritt */
    const frei=Object.entries(HARNESSE).filter(([id,h])=>lvl>=h.lvl&&(h.basis||!ohneForschung));
    const gesperrt=Object.entries(HARNESSE).filter(([id,h])=>lvl<h.lvl||(!h.basis&&ohneForschung));
    return '<div class="notiz">Ein <b>Agenten-Tool</b> – technisch auch Agent Harness – ist die Arbeitsumgebung eines Modells, zum Beispiel Claude Code, OpenCode oder Kimi Code. Es stellt Werkzeuge, Editierformat und Prüfschritte bereit, <b>verändert aber keine Modellgewichte</b>. Die Eignung ist eine <b>Spielannahme aus dem Funktionsprofil</b> (Anbindung, Format, Umgang mit Kontext und Fehlerbehebung), keine Messung. Agenten-Tool ≠ Modell.</div>'+
    ((typeof dsSattlereiHtml==="function")?dsSattlereiHtml(eigene,frei):"")+(ohneForschung?'<div class="notiz">Ohne die Forschung „Agentenwerkstatt“ steht nur das <b>Basis-Tool</b> bereit – es funktioniert mit jedem Modell. Die Spezial-Tools kommen mit der Forschung.</div>':"")+
    (eigene.length&&frei.length?'<div class="karte"><h3>🧮 Eignungsmatrix</h3><p style="font-size:12px">Antippen weist das Tool zu. Grün steht für eine gut geeignete Kombination.</p>'+
      '<div class="matrixwrap abstand"><table class="matrix"><tr><th>Tier</th>'+frei.map(([id,h])=>'<th title="'+esc(h.n)+'">'+h.z+'<br>'+esc(h.n.split(" ")[0])+'</th>').join("")+'</tr>'+
      eigene.map(p=>'<tr><td>'+esc(p.name)+'</td>'+frei.map(([id,h])=>{
        const sc=geschirrEignung(p,id);
        const tcOk=p.tc>=h.tcMin;
        const an=p.geschirr===id;
        return '<td><span class="mz '+geschirrScore(tcOk?sc:Math.min(sc,15))+'" style="'+(an?"outline:3px solid #4e9c3e":"")+'" onclick="geschirrAnlegen(\''+p.uid+'\',\''+id+'\')" title="'+(tcOk?sc+"% Eignung":"Die Werkzeugaufrufe dieses Modells sind nicht zuverlässig genug.")+'">'+(tcOk?sc:"✗")+'</span></td>';
      }).join("")+'</tr>').join("")+'</table></div></div>':"")+
    '<div class="karte"><h3>🧰 Verfügbare Agenten-Tools</h3><div class="werteliste">'+
      frei.map(([id,h])=>'<div class="listenzeile"><span style="font-size:24px;flex:0 0 30px;text-align:center">'+h.z+'</span>'+
        '<span class="txt"><b>'+esc(h.n)+' <span class="merk '+(h.os?"gut":"info")+'">'+(h.os?"Open Source":"kommerziell")+'</span>'+(h.abo?'<span class="merk gold">'+h.abo+' €/Tag</span>':'<span class="merk gut">kostenlos</span>')+'</b>'+
        '<span>'+esc(h.txt)+'</span><span style="color:#20536b">💡 '+esc(h.lehre)+'</span></span>'+
        '<button class="knopf s" onclick="zielModusAn(\''+id+'\')">Zuweisen</button></div>').join("")+
      (gesperrt.length?'<div class="notiz">Später: '+gesperrt.map(([id,h])=>h.z+" "+esc(h.n)+" ("+(lvl<h.lvl?"Stufe "+h.lvl:"Forschung Agentenwerkstatt")+")").join(" · ")+'</div>':"")+'</div></div>'+
    '<div class="karte hell"><h3>🏆 Veröffentlichte Messläufe (Modell und Tool)</h3><p style="font-size:12px">Zahlen aus Hersteller- und Community-Messungen – jede unter <b>eigenen Bedingungen</b> (Aufgaben, Budget, Version). Sie sind nicht direkt miteinander vergleichbar und belegen keinen pauschalen Tool-Bonus:</p>'+
      '<table class="vergleich"><tr><th>Agenten-Tool + Modell</th><th>Messlauf</th><th style="width:56px">Wert</th></tr>'+
      BENCH_PAARE.slice(0,10).map(b=>'<tr><td>'+esc((HARNESSE[b.harness]||{z:""}).z+" "+(HARNESSE[b.harness]?HARNESSE[b.harness].n:b.harness)+" + "+b.modell)+'</td><td>'+esc(b.bench)+'</td><td><b>'+b.wert+'</b></td></tr>').join("")+'</table></div>';
  },"geschirr");
}
function geschirrAnlegen(uid,hid){
  const p=S.tiere.find(t=>t.uid===uid), h=HARNESSE[hid];
  if(!p||!h) return;
  if(!h.basis&&!forschungFrei("geschirr")){ melde("Erst „Agentenwerkstatt“ in der Forschungshütte erforschen – das Basis-Tool geht auch ohne.","schlecht"); return; }   /* Ära 9 */
  if(p.status!=="frei"){ melde(p.name+" ist gerade beschäftigt","schlecht"); return; }
  if(p.geschirr===hid){ melde(p.name+" verwendet "+h.n+" bereits – zum Entfernen den entsprechenden Knopf auf der Tierkarte nutzen.","info"); return; }   /* v9.9 (R2): kein stilles Ablegen beim zweiten Klick */
  else{
    const sc=geschirrEignung(p,hid);
    const tcOk=p.tc>=h.tcMin;
    if(sc<35){ melde(h.n+" passt nicht zu "+p.name+" (Eignung "+sc+" %) – anderes Agenten-Tool wählen oder ein werkzeugfähigeres Modell.","schlecht"); return; }   /* Ära 7.5 */
    p.geschirr=hid;
    if(!tcOk) melde("⚠️ Die Werkzeugaufrufe von "+p.name+" sind für "+h.n+" nicht zuverlässig genug – die Agentenleistung bricht ein!","schlecht");
    else if(sc>=85) melde("Perfekte Kombination: "+p.name+" + "+h.n+" ("+sc+"%)","gut");
    else if(sc<45) melde(h.n+" passt nur mäßig zur "+((FAMILIEN[p.fam]||{}).n||p.fam)+"-Familie ("+sc+"%)","schlecht");
    else melde(h.n+" zugewiesen ("+sc+"% Eignung)");
    questHook("geschirr_an",null);
    if(typeof startGuideGeschirrFertig==="function") startGuideGeschirrFertig();   /* Ära 9: Führung Tag 1 */
  }
  sichern(); wieseNeu(); schilderNeu();
  if(blattStack.length&&blattStack[blattStack.length-1].id==="geschirr") zeigeGeschirr(); else if(blattStack.length) zeigeTier(uid);
}
function geschirrAb(uid){
  const p=S.tiere.find(t=>t.uid===uid);
  if(p){ p.geschirr=null; sichern(); zeigeTier(uid); wieseNeu(); }
}

function zeigeWerkstatt(){
  blattLive("🔧 Werkstatt (Quantisierung)",()=>{
    if(!forschungFrei("quant")) return '<div class="leer">Erst in der Forschungshütte <b>Quantisierung</b> erforschen.</div>';
    const eigene=S.tiere.filter(p=>!p.api&&p.status==="frei"&&archVon(p)!=="hrm");
    return '<div class="notiz">Die <b>Diät-Werkstatt</b>: Quantisierung rundet die Gewichte des Modells auf weniger Bit – halber Speicher, fast doppeltes Tempo, dafür etwas weniger Genauigkeit. Bei <b>Katalogmodellen</b> lässt sich das Original jederzeit neu laden – ihre Diät ist umkehrbar (Gebühr 25 €). <b>Eigenzucht-Kinder haben keine Originaldatei:</b> was ihre Quantisierung verliert, ist weg.</div>'+
    (eigene.length?eigene.map(p=>{
      const idx=QUANTS.findIndex(q=>q.id===p.quant);
      return '<div class="karte"><h3><span style="width:46px;display:inline-block">'+pigSvgVon(p)+'</span>'+esc(p.name)+'<span class="merk info">'+vramPig(p)+' GB · '+tokps(p)+' tok/s</span></h3>'+
      '<div class="reihe abstand">'+QUANTS.map((q,i)=>{
        const test={...p,quant:q.id};
        const vr=vramPig(test);
        return '<button class="knopf s '+(i===idx?"gewaehlt":"hell")+'" title="'+esc(q.txt)+'" onclick="quantSetzen(\''+p.uid+'\',\''+q.id+'\')">'+q.n.split(" ")[0]+'<br><small>'+vr+' GB</small></button>';
      }).join("")+'</div>'+
      '<p style="font-size:11.5px;color:var(--tinte-2);margin-top:6px">'+esc(quantVon(p.quant).txt)+'</p></div>';
    }).join(""):'<div class="leer">Kein freies lokales Tier da.</div>');
  },"werkstatt");
}
function quantSetzen(uid,qid){
  const p=S.tiere.find(t=>t.uid===uid);
  if(!p||p.quant===qid) return;
  if(!istFrei("gebWerkstatt")){ melde("Die Werkstatt öffnet auf Hofstufe 2.","schlecht"); return; }
  if(!forschungFrei("quant")){ melde("Erst die Diätküche (Quantisierung) erforschen.","schlecht"); return; }
  /* Quantisierung ist eine REPRÄSENTATION (MH-022, T24): mehr Präzision gibt es nur, wenn die Quelle existiert.
     Katalogmodelle laden ihr Original neu – Eigenzucht-Kinder haben keins, verlorene Bits kommen nicht zurück. */
  if(!p.modell&&quantVon(qid).bpw>quantVon(p.quant).bpw){
    melde("Geht nicht: "+p.name+" ist Eigenzucht – es gibt keine Originaldatei in höherer Präzision. Was beim Quantisieren verloren ging, lässt sich nicht zurückrechnen!","schlecht");
    return;
  }
  if(p.status!=="frei"){ melde(p.name+" ist gerade im Einsatz – umquantisiert wird nur ein freies Modell.","schlecht"); return; }   /* Ära 7.5: Befund aus dem Spieltest */
  const _sb=buchtVon(p);
  if(_sb&&stackVon(_sb).server&&vramPig({...p,quant:qid})>GPUS[_sb.gpu].vram){ melde(stackVon(_sb).n+" braucht das ganze Modell im VRAM – in "+quantVon(qid).n+" passt "+p.name+" nicht mehr auf die Karte.","schlecht"); return; }   /* R-12 */
  if(_sb&&stackVon(_sb).server&&quantVon(qid).bpw<8){ melde("Die "+stackVon(_sb).n+"-Bucht fährt nur bf16/q8 – erst ausstallen oder lokale Laufzeitumgebung wählen, dann tiefer quantisieren.","schlecht"); return; }
  if(quantVon(qid).bpw<=3&&!warnBox("q3/q2 sind HARTE Diäten: spürbarer Qualitätsverlust bei Wissen und Treue, das Tier wird fehleranfälliger.","Für Heimkarten reicht fast immer q4 – gleiche Platzersparnis-Klasse, deutlich weniger Verlust.")) return;
  const gratis=S.mini&&(S.mini.quantGratis||0)>0;   /* Ära 7.5: Stallmeister-Gutschein vom Dorfplatz */
  if(!gratis&&(S.kredit<25||!kannZahlen(25))){ melde("25 € Werkstattgebühr fehlen","schlecht"); return; }
  if(gratis) S.mini.quantGratis--; else buche(-25,"kauf","Werkstatt: Umquantisierung "+p.name+(p.modell&&quantVon(qid).bpw>quantVon(p.quant).bpw?" (Original neu geladen)":""));
  const alt=quantVon(p.quant);
  p.quant=qid;
  const neu=quantVon(qid);
  const b=buchtVon(p);
  melde(p.name+": "+alt.n+" → "+neu.n+" ("+vramPig(p)+" GB"+(b&&!passtInBucht(p,b)?" – passt immer noch nicht ganz!":"")+")",neu.malus>alt.malus?"":"gut");
  questHook("quant_fertig",null);
  alles(); sichern(); zeigeWerkstatt();
}

      (t.extra&&t.extra.richterNoetig?'<div class="abstand"><b>Richter-Modell wählen</b> (bewertet die Antworten – Reward Model; nur treue, präferenztrainierte Tiere taugen):<div class="reihe abstand">'+S.tiere.filter(l=>l.uid!==p.uid&&l.status==="frei"&&(effW(l).treue>=65||datenNutzung(l,"praef")>0)).map(l=>'<button class="knopf s '+(wiz.richter===l.uid?"gewaehlt":"hell")+'" onclick="wizRichter(\''+l.uid+'\')">'+esc(l.name)+'</button>').join("")+'</div></div>':"")+
      '<div class="reihe abstand"><button class="knopf hell" onclick="wizZurueck()">← Zurück</button><button class="knopf" '+(wiz.futter?"":"disabled")+' onclick="wizWeiter()">Weiter →</button></div></div>';
    }
    /* Schritt 3: Rechner */
    if(wiz.schritt===3){

      const eigene=S.buchten.filter(b=>(!b.tier||b.tier===p.uid)&&GPUS[b.gpu].vram>=noetig);

      }).join("")+
      '<button class="listenzeile'+(wiz.bucht==="cloud"?" an":"")+'" onclick="wizBucht(\'cloud\')"><span class="bild" style="width:56px">'+wolkeMiniSvg()+'</span>'+
      '<span class="txt"><b>'+esc(CLOUD_PROFIL.n)+'</b><span>'+Math.max(1,Math.ceil(kostenCloud.stunden/(22*CLOUD_PROFIL.geraete)))+' Tag(e) · Miete ~'+geld(kostenCloud.miete)+' + Aufbereitung '+geld(kostenCloud.arbeit)+' · trägt bis '+(CLOUD_PROFIL.geraete*CLOUD_PROFIL.vramJe)+' GB dank Sharding</span></span></button>'+
      '</div>'+
      (!eigene.length?'<p class="abstand" style="font-size:12px;color:#a33">Keine eigene GPU ist groß genug – Cloud-Miete oder größere GPU im Markt.</p>':"")+
      '<div class="reihe abstand"><button class="knopf hell" onclick="wizZurueck()">← Zurück</button><button class="knopf" '+(wiz.bucht?"":"disabled")+' onclick="wizWeiter()">Weiter →</button></div></div>';
    }
    /* Schritt 4: Zusammenfassung mit Vorschau */
    const cloud=wiz.bucht==="cloud";
    const kosten=trainingsKosten(p,t,wiz.futter,cloud);
    const gpu=cloud?GPUS.h100:GPUS[(S.buchten.find(b=>b.id===wiz.bucht)||{}).gpu];
    const dauer=cloud?Math.max(1,Math.ceil(kosten.stunden/(22*CLOUD_PROFIL.geraete))):trainingsDauer(p,t,gpu);
    const f=FUTTER[wiz.futter];
    /* Vorschau nutzt DENSELBEN Qualitätsweg wie der Abschluss (MH-010): Relevanz + Sättigung + Chargen-Mix */
    let qual=wiz.futter==="synth"?synthQualitaet():f.q;
    qual*=futterRelevanz(wiz.fokus||"logik",wiz.futter);
    const nutzVorher=datenNutzung(p,wiz.futter);
    if(nutzVorher>0) qual*=Math.pow(0.6,nutzVorher);
    /* Erwartete Deltas */
    const erwartung={};
    for(const k in (t.profil||{})){
      if(k==="fokus") erwartung[wiz.fokus]=(erwartung[wiz.fokus]||0)+t.profil.fokus*qual;
      else erwartung[k]=(erwartung[k]||0)+t.profil[k]*qual;
    }
    const wJetzt=effW(p);
    const wDanach={...wJetzt};
    for(const k in erwartung) wDanach[k]=kl(wDanach[k]+erwartung[k],2,99);
    const risiken=[];
    let vergessenP=t.risiko.vergessen||0; if(wiz.technik==="cpt"&&wiz.replay) vergessenP=0.06;
    if(vergessenP>0) risiken.push(rd(vergessenP*100)+"% Katastrophales Vergessen (eine andere Fähigkeit sinkt)");
    if(t.risiko.hack) risiken.push(rd(t.risiko.hack*100)+"% Reward Hacking (Treue −10)");
    if(t.risiko.kollaps) risiken.push(rd(t.risiko.kollaps*(wiz.futter==="synth"?2:1)*100)+"% Mode Collapse"+(wiz.futter==="synth"?" (synthetisches Futter verdoppelt!)":""));
    if(f.contamination) risiken.push("Kontamination: Prüfungen zählen nur noch mit Sternchen, Skandalgefahr");
    return kopf+'<div class="karte"><h3>4 · Zusammenfassung</h3>'+
    '<div class="radarbox abstand">'+radarSvg(wJetzt,wDanach,{size:210})+
    '<div class="radarlegende"><div class="rl"><i style="background:rgba(107,189,76,.55)"></i>jetzt</div><div class="rl"><i style="background:rgba(74,144,217,.4)"></i>erwartet (±25%)</div>'+
    Object.entries(erwartung).map(([k,v])=>'<div class="rl">'+WERTE[k]+' <b class="delta">+'+rd1(v)+'</b></div>').join("")+'</div></div>'+
    '<div class="vorschau abstand">'+
      '<div class="vzeile"><span>Verfahren</span><span>'+t.z+' '+esc(t.n)+(t.profil&&t.profil.fokus?' – Schwerpunkt '+WERTE[wiz.fokus]:"")+'</span><span></span></div>'+
      '<div class="vzeile"><span>Futter</span><span>'+f.z+' '+esc(f.n)+' ('+kosten.gb+' GB bleiben in der Bibliothek · wirksame Qualität '+rd(qual*100)+'% – Domänen-Passung'+(nutzVorher>0?' und Sättigung ('+(nutzVorher+1)+'. Nutzung!)':'')+' eingerechnet)'+(wiz.replay?" + Replay-Mix":"")+'</span><span></span></div>'+
      '<div class="vzeile"><span>Rechner</span><span>'+(cloud?esc(CLOUD_PROFIL.n):esc(gpu.n))+' · '+dauer+' Tag(e)</span><span></span></div>'+
      '<div class="vzeile"><span>Kosten</span><span>Aufbereitung '+geld(kosten.arbeit)+(cloud?' + Miete '+geld(kosten.miete):' · Strom läuft täglich über die Bucht (~'+geld(kosten.strom)+')')+'</span><b>'+geld(kosten.gesamt)+' sofort</b></div>'+
      (risiken.length?'<div class="vzeile" style="color:#a33"><span>Risiken</span><span>'+risiken.join(" · ")+'</span><span></span></div>':"")+
    '</div>'+
    (wiz.technik==="lora"||wiz.technik==="qlora"?'<div class="wissen abstand"><b>💡 Ergebnis:</b> Dieses Training erzeugt einen <b>ansteckbaren Adapter</b> – er landet am Ohr des Schweins und kann jederzeit gewechselt werden.</div>':"")+
    '<div class="reihe abstand"><button class="knopf hell" onclick="wizZurueck()">← Zurück</button>'+
    '<button class="knopf gruen" onclick="wizStart()">'+t.z+' Training starten ('+geld(kosten.gesamt)+')</button></div></div>';
  },"training");
}
function wizSchwein(uid){ wiz={uid,schritt:uid?1:0,technik:null,fokus:"logik",futter:null,bucht:null,replay:false,lehrer:null,richter:null}; zeigeTraining(uid); }

function wizRichter(uid){ wiz.richter=uid; zeigeTraining(wiz.uid); }

function wizWeiter(){ wiz.schritt++; zeigeTraining(wiz.uid); }
function wizStart(){
  const p=S.tiere.find(t=>t.uid===wiz.uid), t=TECHNIKEN[wiz.technik];
  if(!p||!t) return;
  if(t.extra&&t.extra.lehrerNoetig&&!wiz.lehrer){ melde("Erst einen Lehrer wählen (Schritt 2)","schlecht"); return; }
  if(t.extra&&t.extra.richterNoetig&&!wiz.richter){ melde("Erst ein Richter-Modell wählen (Schritt 2)","schlecht"); return; }
  const noetigGb=Math.max(2,Math.round(t.gbFaktor*p.pT));
  /* Replay wird erst NACH erfolgreichem Start abgebucht – ein abgelehnter Start verändert nichts (MH-004, T05) */
  const replayGb=wiz.replay?Math.round(noetigGb*0.25):0;
  if(wiz.replay&&(S.daten.replay||0)<replayGb){ melde("Replay-Mix fehlt: "+replayGb+" GB nötig (Scheune)","schlecht"); return; }
  /* Ära 7.5 (T-18): ein API-Lehrer schreibt seine Lehrbeispiele gegen echte Token – wie in Scheune und Agenten-Welt */
  const lehrerApi=wiz.lehrer?S.tiere.find(x=>x.uid===wiz.lehrer):null;
  const lehrerKosten=(lehrerApi&&lehrerApi.api)?Math.round(3*(LEIHMODELLE[lehrerApi.modell]||{outTok:5}).outTok*0.92):0;
  if(lehrerKosten&&(S.kredit<lehrerKosten||!kannZahlen(lehrerKosten))){ melde("API-Lehrer kostet "+geld(lehrerKosten)+" Token – zu wenig Geld","schlecht"); return; }
  if(trainingStarten(p,wiz.technik,wiz.fokus,wiz.futter,wiz.bucht)){
    if(lehrerKosten){ buche(-lehrerKosten,"api","Destillations-Lehrdaten via "+lehrerApi.name+" (~3 Mtok)"); melde("Hinweis: Frontier-AGB verbieten offiziell das Training von Konkurrenzmodellen – im Spiel eine bewusste Grauzone.","info"); }
    /* T-22: Replay-Mix bleibt in der Bibliothek – die eiserne Regel gilt für alle Datensorten */
    p.training.replay=wiz.replay;
    p.training.lehrer=wiz.lehrer; p.training.richter=wiz.richter;
    if(wiz.lehrer){ const l=S.tiere.find(x=>x.uid===wiz.lehrer); if(l){ l.status="zucht"; l.rest=p.rest; melde("Lehrer "+l.name+" ist für die Dauer der Destillation eingespannt – die erzeugten Beispiele liegen am Ende bereit"); } }
    if(wiz.richter){ const r=S.tiere.find(x=>x.uid===wiz.richter); if(r){ r.status="zucht"; r.rest=p.rest; } }
    if(wiz.technik==="lora"||wiz.technik==="qlora") p.training.adapter=true;
    melde(p.name+" beginnt "+t.n+" – Dauer "+p.rest+" Tag(e)","gut");
    wiz=null;
    alles(); sichern(); blattZu();
  }
}

/* Adapter-Abschluss – EIN Rechenweg mit dem normalen Training (MH-034):
   dieselbe Qualitäts-Pipeline, dieselben deklarierten Risiken, exakte Basisbindung (MH-035). */
function adapterAbschliessen(p,bericht,q,t){
  const vorher={...p.w};
  const f=FUTTER[q.futter]||{q:0.6};
  let qual=q.futter==="synth"?synthQualitaet():f.q;
  qual*=futterRelevanz(q.fokus,q.futter);
  const nutz=datenNutzungZaehle(p,q.futter);
  if(nutz>1) qual*=Math.pow(0.6,nutz-1);
  if(q.futter==="synth"){ p.synthGen=Math.max(p.synthGen+1,synthGeneration()); qual*=Math.pow(0.82,Math.max(0,p.synthGen-1)); }
  const staerke=Math.max(1,Math.round(t.profil.fokus*qual*z(0.75,1.2)*((typeof merkmalHat==="function"&&merkmalHat(p,"lernfreudig"))?1.10:1))+((typeof merkmalHat==="function"&&merkmalHat(p,"verfressen"))?2:0));   /* Ära 8: Lernfreudig +10 %, Verfressen +2 */
  /* Treue-Fokus wird ADDIERT statt vom zweiten Objektschlüssel überschrieben (Prüfbefund) */
  const wA={}; wA[q.fokus]=staerke;
  wA.treue=(wA.treue||0)+Math.max(0,Math.round((t.profil.treue||1)*qual));
  const gleich=(p.adapters||[]).filter(x=>x.fokus===q.fokus).length+(S.adapterSchrank||[]).filter(x=>x.fokus===q.fokus&&x.basisUid===p.uid).length;
  const a={n:WERTE[q.fokus]+"-Adapter ("+(q.id==="qlora"?"QLoRA":"LoRA")+")"+(gleich?" #"+(gleich+1):""),fokus:q.fokus,
    basisId:p.modell||null, basisUid:p.modell?null:p.uid, basisArch:archVon(p),
    basisFam:p.fam, basisPT:p.pT,
    basisName:(p.modell&&MODELLE[p.modell]?MODELLE[p.modell].n:p.name)+" ("+p.pT+"B)",
    w:wA};
  /* LoRA friert die Basis ein. Ein schlechter Adapter kann Fähigkeiten überlagern,
     aber sein Abnehmen muss den unveränderten Basisstand wiederherstellen. */
  let ausgang="sauber", art="gut";
  const r=t.risiko||{};
  if(Math.random()<(r.vergessen||0)*(skillAktiv("replaymeister")?0.5:1)){   /* Skill: Replay-Mix */
    const andere=Object.keys(WERTE).filter(k=>k!==q.fokus);
    const k=zufall(andere); const minus=z(3,7);
    a.w[k]=(a.w[k]||0)-minus;
    ausgang="Adapter überlagert "+WERTE[k]+" (−"+rd(minus)+"); Abnehmen stellt die Basis wieder her"; art="schlecht";
  }
  p.adapters=p.adapters||[];
  if(p.adapters.length>=2){ S.adapterSchrank=S.adapterSchrank||[]; const alt=p.adapters.shift(); S.adapterSchrank.push(alt); S.adapterGewechselt=true; try{ questHook("adapter_wechsel",null); }catch(e){}   /* v9.8: der Tausch beim Training zählt wie der Wechsel von Hand */ if(bericht) bericht.zeilen.push({t:"🧩 "+p.name+": Steckplätze voll – Adapter „"+alt.n+"“ liegt jetzt im Adapterschrank (jederzeit wieder ansteckbar).",art:"info"}); }   /* Ära 7.5 (B15) */
  p.adapters.push(a);
  p.historie.push({tag:S.tag,n:t.n,detail:"Adapter erzeugt: "+a.n+" (+"+staerke+" "+WERTE[q.fokus]+")",ausgang,delta:deltaVon(vorher,p.w)});
  p.status="frei"; p.rest=0; p.training=null;
  S.statistik.trainings++;
  tierXp(p,40); xpDazu(24);
  questHook("training_fertig",null); questHook("training_art",q.id);
  if(q.replay){ S.replayGenutzt=true; questHook("replay_genutzt",null); }
  bericht.zeilen.push({t:p.name+": "+t.n+" fertig – Adapter '"+a.n+"' angesteckt"+(ausgang!=="sauber"?" ("+ausgang+")":""),art});
  bericht.zeugnisse=bericht.zeugnisse||[];
  bericht.zeugnisse.push({uid:p.uid,name:p.name,titel:t.z+" "+t.n,vorher,nachher:(typeof effW==="function")?effW(p):{...p.w},ausgang,art});   /* v9.9 (R2): das Zeugnis nennt die wirksamen Werte samt Adaptern – wie die Tierkarte */
}

    let vorschau="";
    if(eltern.length>=2&&kompat.ok){
      const wMix={};
      for(const k in WERTE){ wMix[k]=rd(eltern.reduce((x,e)=>x+e.w[k],0)/eltern.length); }

    }
    return '<div class="notiz">In der Zuchtbucht werden zwei Modelle <b>derselben Familie</b> zu einem neuen verschmolzen (Model Merging mit mergekit). Das Beste daran: Es braucht <b>kaum Rechenleistung</b> – nur Mut. Vererbt werden Fähigkeiten, nicht Agenten-Tool oder Adapter. Fine-Tuning ist das NICHT – das passiert auf dem Trainingsplatz!</div>'+
    '<div class="karte"><h3>1 · Methode</h3><div class="werteliste">'+

      '<span>'+esc(x.txt)+'</span><span style="color:#20536b">💡 '+esc(x.lehre)+'</span></span></button>').join("")+'</div></div>'+
    '<div class="karte"><h3>2 · Eltern wählen <span class="merk info">'+eltern.length+'/'+m.eltern[1]+'</span></h3>'+
    (frei.length?'<div class="werteliste">'+frei.map(p=>{
      const gewaehlt=zuchtWahl.includes(p.uid);
      let hinweis="";
      if(!gewaehlt&&eltern.length){ const k=mergeKompatibel(eltern[0],p,zuchtMethode); hinweis=k.ok?"✅ kompatibel":"⛔ "+k.warum; if(k.ok&&istInzucht(eltern.concat([p]))) hinweis+=" · ⚠️ Inzucht"; }
      if((p.zuchtRuhe||0)>S.tag) hinweis="⏳ Erholung bis Tag "+p.zuchtRuhe;
      return '<button class="listenzeile'+(gewaehlt?" an":"")+'" onclick="zuchtWaehle(\''+p.uid+'\')"><span class="bild">'+pigSvgVon(p)+'</span>'+
      '<span class="txt"><b>'+esc(p.name)+'</b><span>'+((FAMILIEN[p.fam]||{}).n||p.fam)+'-Familie · '+p.pT+' Mrd. · Gen '+p.gen+'</span>'+(hinweis?'<span>'+hinweis+'</span>':"")+'</span>'+
      '<span class="merk '+(gewaehlt?"gut":"")+'">'+(gewaehlt?"gewählt":"wählen")+'</span></button>';
    }).join("")+'</div>':'<div class="leer">Keine freien lokalen Tiere.</div>')+'</div>'+

    (zuchtWahl.length?'<button class="knopf s hell" onclick="zuchtLeer()">Auswahl leeren</button>':"")+'</div></div>';
  })(),"zucht");
}
function zuchtMethodeWahl(id){ zuchtMethode=id; zeigeZucht(); }
function zuchtWaehle(uid){
  const m=ZUCHT[zuchtMethode];
  if(zuchtWahl.includes(uid)) zuchtWahl=zuchtWahl.filter(x=>x!==uid);
  else{ if(zuchtWahl.length>=m.eltern[1]) zuchtWahl.shift(); zuchtWahl.push(uid); }
  zeigeZucht();
}
function zuchtLeer(){ zuchtWahl=[]; zeigeZucht(); }
function zuchtStart(){ if(hofZu("Zucht")) return; if(!forschungFrei("merge")){ melde("Erst in der Forschungshütte „Zuchtbuch (Model Merging)“ erforschen.","schlecht"); return; }   /* v9.9 (R2): Anzeige, Treiber und Spiel prüfen dasselbe */
  const m=ZUCHT[zuchtMethode];
  const zuchtStufe=zuchtMethode==="slerp"?2:(m.lvl||1);   /* Ära 7.5 (T-19): SLERP öffnet mit der Zuchtbucht (Stufe 2), die feinen Verfahren später */
  if(hofLevel().i<zuchtStufe){ melde(m.n+" gibt es ab Hofstufe "+zuchtStufe,"schlecht"); return; }
  const eltern=zuchtWahl.map(id=>S.tiere.find(t=>t.uid===id)).filter(Boolean);
  if(eltern.length<m.eltern[0]) return;
  const kosten=m.kredit+Math.round((eltern[0].pT||1)*8);   /* Ära 7.5 (T-06): RAM/Platte skalieren mit der Modellgröße */
  if(S.kredit<kosten||!kannZahlen(kosten)){ melde("Zu wenig Geld ("+geld(kosten)+")","schlecht"); return; }
  if(eltern.some(e=>e.status!=="frei")){ melde("Alle Eltern müssen frei sein","schlecht"); return; }
  if(eltern.length>m.eltern[1]){ melde(m.n+" erlaubt höchstens "+m.eltern[1]+" Eltern","schlecht"); return; }
  if(new Set(eltern.map(e=>e.uid)).size!==eltern.length){ melde("Ein Tier kann nicht mit sich selbst gekreuzt werden – Model Soup mittelt verschiedene Trainingsstände, keine Kopien.","schlecht"); return; }   /* Ära 8 */
  { const muede=eltern.find(e=>(e.zuchtRuhe||0)>S.tag); if(muede){ melde(muede.name+" erholt sich noch bis Tag "+muede.zuchtRuhe+" vom letzten Wurf.","schlecht"); return; } }   /* Ära 8 */
  for(let i=1;i<eltern.length;i++){ const k=mergeKompatibel(eltern[0],eltern[i],zuchtMethode); if(!k.ok){ melde(k.warum,"schlecht"); return; } }
  buche(-kosten,"zucht","Misch-Werkstatt: "+m.n+" ("+eltern[0].pT+"B)");
  /* Der Merge KOSTET einen Hoftag und belegt die Eltern (MH-037, T39) – das Kind liegt morgen früh im Stroh */
  const elternKopie=zuchtWahl.map(id=>{const e=S.tiere.find(t=>t.uid===id);return {name:e.name,w:{...e.w},_effIdx:effizienzIndex(e)};});
  eltern.forEach(e=>{ e.status="zucht"; e.rest=m.tage||1; });
  eltern[0]._mergeAuftrag={eltern:[...zuchtWahl],methode:zuchtMethode,kopie:elternKopie};
  S.statistik.merges++;
  zuchtWahl=[];
  melde("🧪 Die Misch-Werkstatt rechnet – Lesen, Mitteln und Zurückschreiben der Gewichte dauert bis morgen früh."+(istInzucht(eltern)?" ⚠️ Inzucht: höheres Interferenz-Risiko!":"")+" Wurfgröße 1–3 Kinder, jedes Zusatzkind kostet +"+Math.round(ZUCHT_REGELN.kindAufschlag*100)+" %.","gut");
  alles(); sichern(); blattZu();
}

/* ── Datenlese: tägliches Kuratier-Minispiel (Schnipsel-Pool DATENLESE in content.js) ──
   Ressourcen-UMWANDLUNG statt Geldquelle: 4 GB webmix rein, je nach Trefferquote 0–4 GB
   kuratiert raus. Der Skill Datenhygiene markiert vorab zwei Verdachtsfälle. */
let lese=null;
function leseStart(){
  if(S.leseTag===S.tag){ melde("Heute schon kuratiert – morgen liegt neue Web-Silage bereit.","schlecht"); return; }
  if((S.daten.webmix||0)<4){ melde("Zu wenig Web-Silage im Lager (4 GB nötig).","schlecht"); return; }
  questHook("futter_kauf",null);   /* Ära 8: Datenlese findet in der Futterscheune statt – „Sieh ins Datenlager“ gilt damit als erfüllt */
  /* Ära 7.5: Schwierigkeit wächst mit der Hofstufe – Anfänger sehen die klaren Fälle, Profis die Grenzfälle */
  const lvl=hofLevel().i, erlaubt=lvl<3?[1,2]:lvl<6?[1,2,3]:[2,3];
  let quelle=DATENLESE.filter(k=>erlaubt.includes(k.stufe||1)); if(quelle.length<8) quelle=DATENLESE;
  const pool=[...quelle].sort(()=>Math.random()-0.5).slice(0,8);
  const hinweise=skillAktiv("datenhygiene")?pool.map((k,i)=>i).filter(i=>pool[i].k!=="sauber").slice(0,2):[];
  lese={karten:pool,antworten:{},hinweise,fertig:null,tag:S.tag};
  zeigeLese();
}
function leseAntwort(i,k){ if(!lese||lese.fertig||lese.antworten[i]!=null) return; lese.antworten[i]=k; zeigeLese(); }
function leseFertig(){
  if(!lese||lese.fertig) return;
  if(lese.tag!==undefined&&lese.tag!==S.tag){ lese=null; melde("Die gestrige Datenlese-Runde ist verfallen – heute liegt frische Web-Silage bereit.","schlecht"); return; }   /* Ära 7.5 */
  if(Object.keys(lese.antworten).length<8){ melde("Erst alle 8 Schnipsel einsortieren!","schlecht"); return; }
  const treffer=lese.karten.filter((k,i)=>lese.antworten[i]===k.k).length;
  S.leseSerie=treffer>=6?(S.leseSerie||0)+1:0;   /* Ära 7.5: Serie über Tage – gute Pipelines werden mit der Zeit besser */
  questHook("lese_fertig",null);   /* Ära 8 */
  const serienBonus=(S.leseSerie>=7?2:S.leseSerie>=3?1:0)+((treffer===8&&S.tiere.some(p=>typeof merkmalHat==="function"&&merkmalHat(p,"feinfuehlig")))?1:0);   /* Ära 8: Feinfühlig */
  const ertrag=(treffer===8?4:Math.floor(treffer*3/8))+(treffer>=6?serienBonus:0);
  S.daten.webmix=Math.round((S.daten.webmix-4)*10)/10;
  if(ertrag>0) S.daten.kuratiert=Math.round(((S.daten.kuratiert||0)+ertrag)*10)/10;
  S.leseTag=S.tag;
  if(treffer>=6) xpDazu(8);
  lese.fertig={treffer,ertrag};
  melde("🧹 Datenlese: "+treffer+"/8 richtig – 4 GB Web-Silage → "+ertrag+" GB Kuratiertes"+(treffer>=6?" (+8 XP"+(serienBonus?", Serie "+S.leseSerie+" → +"+serienBonus+" GB":"")+")":" – Serie gerissen"),treffer>=5?"gut":"schlecht");
  if(S.mini){ S.mini.lesen=(S.mini.lesen||0)+1; }
  sichern(); kopfNeu(); zeigeLese();
}
function zeigeLese(){
  if(!lese) return;

      (lese.hinweise.includes(i)&&!f?'<span class="merk">🧼 Datenhygiene-Filter: Verdachtsfall!</span> ':'')+
      '<div class="reihe" style="gap:6px;flex-wrap:wrap">'+KAT.map(([id,n])=>'<button class="knopf s '+(a===id?"gewaehlt":"hell")+'" '+(f?"disabled":"")+' onclick="leseAntwort('+i+',\''+id+'\')">'+n+'</button>').join("")+'</div>'+
      (f?'<p style="font-size:11.5px;margin-top:6px">'+(a===k.k?'✅ Richtig':'❌ Das war: '+(KAT.find(x=>x[0]===k.k)||[])[1])+' – '+esc(k.e)+'</p>':'')+
      '</div>';
    }).join("")+

      '<div class="karte hell"><h3>Ergebnis: '+lese.fertig.treffer+'/8 · +'+lese.fertig.ertrag+' GB Kuratiertes</h3><button class="knopf gruen" onclick="zeigeFutter()">Zurück zur Futterscheune</button></div>':
      '<div class="reihe abstand"><button class="knopf gruen" '+(alle?"":"disabled")+' onclick="leseFertig()">Auswerten ('+Object.keys(lese.antworten).length+'/8 sortiert)</button></div>'),

function futterKauf(id,gb){ if(typeof hofZu==="function"&&hofZu("Einkaufen")) return;   /* v9.9 (R2) */
  const f=FUTTER[id];
  if(!f){ melde("Unbekannte Datensorte","schlecht"); return; }
  if(f.lvl&&hofLevel().i<f.lvl){ melde(f.n+" ist erst ab Hofstufe "+f.lvl+" verfügbar.","schlecht"); return; }
  if(!Number.isFinite(gb)||gb<=0||f.preisGB===null||f.preisGB===undefined){ melde("Diese Datenmenge ist nicht kaufbar.","schlecht"); return; }
  const preis=Math.round(gb*f.preisGB*(id==="webmix"?(saison().webF||1):1));   /* Sommer: Web-Crawls 20 % günstiger (Saison) */
  if(S.kredit<preis||!kannZahlen(preis)){ melde("Zu wenig Geld","schlecht"); return; }
  if(f.contamination&&!warnBox("Schwarzmarkt-Futter enthält Prüfungsfragen (Benchmark-Leak): Trainings damit machen Siege wertlos, riskieren Halluzinose, Klagen und Rufschaden.","Kuratierte Auslese oder Fachfutter kaufen – teurer je GB, aber jedes GB wirkt ehrlich.")) return;
  buche(-preis,"daten","Datenkauf: "+gb+" GB "+f.n);
  S.daten[id]=(S.daten[id]||0)+gb;
  if(f.contamination) melde("Psst… "+gb+" GB Prüfungsfragen unter der Ladefläche. Wenn das mal gut geht.","schlecht");
  else melde(gb+" GB "+f.n+" eingelagert","gut");
  questHook("futter_kauf",null);
  kopfNeu(); sichern(); zeigeFutter();
}
/* Synthetik ist ein ECHTER Generierungs-Job (MH-029, T32): lokal braucht er GPU + einen Tag,
   per API kostet er reale Token. Jede Charge behält Qualität, Generation und Herkunft (MH-030). */
function synthProduzieren(uid){
  const p=S.tiere.find(t=>t.uid===uid);
  if(!p||p.status!=="frei") return;
  if(p.api){
    const m=LEIHMODELLE[p.modell];
    const MTOK=2;                                          // ~2 Mio Ausgabe-Token (Spielannahme: ≈ 4 GB je Mtok Beispieltext)
    const kosten=Math.round(MTOK*m.outTok*0.92);
    if(S.kredit<kosten||!kannZahlen(kosten)){ melde("API-Kosten "+geld(kosten)+" fehlen","schlecht"); return; }
    buche(-kosten,"api","Synthetik-Generierung via "+p.name+" ("+MTOK+" Mtok)");
    const gb=MTOK*4;
    const q=kl(Object.values(p.w).reduce((a,b)=>a+b,0)/700*0.95,0.3,0.97);
    synthChargeDazu(gb,q,1,"API: "+p.name);
    melde(p.name+" liefert "+gb+" GB Synthetik (Qualität "+rd(q*100)+"%) – Achtung: Frontier-AGB verbieten offiziell das Training von Konkurrenzmodellen!","gut");
  }else{
    if(!p.bucht){ melde(p.name+" braucht eine GPU-Bucht – Beispiele schreiben ist echte Rechenarbeit!","schlecht"); return; }
    p.status="zucht"; p.rest=1;
    const gb=Math.round(6+p.pT*0.15);
    const q=kl(Object.values(effW(p)).reduce((a,b)=>a+b,0)/700*0.95,0.3,0.97);
    p._synthAuftrag={gb,q,gen:(p.synthGen||0)+1,quelle:"Eigenbau: "+p.name};
    melde(p.name+" schreibt heute Beispiele – morgen früh liegen ~"+gb+" GB in der Scheune (erst nach getaner Arbeit!)");
  }
  questHook("futter_synth",null);

function jobAnnehmenAlt(jid,uid){
  const j=S.jobs.find(x=>x.id===jid), p=S.tiere.find(t=>t.uid===uid);
  if(!j||!p||p.status!=="frei") return;
  /* Arbeiten ist unter dem Limit ausdrücklich ERLAUBT – nur Investitionen sind eingefroren (kannZahlen) */
  const c=jobCheck(p,j);
  if(!c.ok){ melde(c.gruende[0]||"Passt nicht","schlecht"); return; }
  if(c.anteil<0.5&&!confirm("⚠️ "+p.name+" schafft pro Tag nur "+rd(c.anteil*100)+"% der geplanten Tagesarbeit – prüfe, ob die gesamte Arbeit bis zur Frist fertig wird. Trotzdem schicken?")) return;
  p.status="job"; p.job=jid; p.rest=j.tage;
  if(j.kunde) kundeVon(j.kunde);
  melde(p.name+" übernimmt: "+j.t,"gut");
  alles(); sichern(); zeigeJobs();
}

function rennParcoursWahl(id){ if(hofLevel().i<PARCOURS[id].lvl){ melde("Ab Hofstufe "+PARCOURS[id].lvl,"schlecht"); return; } rennParcours=id; rennWahl=null; zeigeArena(); }
/* Gegnerstärke NUR aus den eigenen Katalogwerten des gezogenen Modells (kein Rubberbanding) */
function gegnerWert(km,pid){
  const pc=PARCOURS[pid];
  if(pc.sprint){   /* Ära 7.5: Gegner laufen auf derselben Skala wie dein Tier – q4 auf deiner schnellsten Karte */
    const g=[...S.buchten.map(b=>GPUS[b.gpu])].sort((a,b)=>b.bw-a.bw)[0]||GPUS.rtx4090;
    const t=g.bw/Math.max(0.3,(km.pA||km.pT)*4.85/8)*0.55;
    return kl(Math.round(t/3),2,99); }
  if(pc.agent)  return kl(Math.round((km.w.werkzeug||40)*0.5+(km.w.code||40)*0.3+(km.tc||0)*7),3,99);
  let s=0; for(const k in pc.g) s+=(km.w[k]||40)*pc.g[k];
  return kl(Math.round(s+(km.rz>0?4:0)),3,99);
}
function rennWaehlen(uid){ rennWahl=rennWahl===uid?null:uid; zeigeArena(); }
function rennenStarten(){
  const ich=S.tiere.find(t=>t.uid===rennWahl);
  if(!ich) return;
  const pc=PARCOURS[rennParcours];
  if(pc.agent&&!ich.geschirr){ melde("Ohne Agenten-Tool kein Agent-Parcours!","schlecht"); return; }
  if(ich.rennTag===S.tag){ melde(ich.name+" ist heute schon gelaufen – ein Start je Tier und Tag (Erholung, keine Preisgeld-Farm).","schlecht"); return; }   /* Ära 7.5 (Spieltest E4) */
  const startgeld=Math.max(20,Math.round(pc.preis*0.12));
  if(S.kredit<startgeld){ melde(startgeld+" € Startgeld fehlen","schlecht"); return; }
  buche(-startgeld,"arena","Startgeld "+pc.n); ich.rennTag=S.tag;
  /* Gegner laufen mit ihren EIGENEN Katalogwerten (MH-041, T42): die Liga wird nach Größenklasse
     ausgelost (fair), aber NIEMANDES Stärke richtet sich nach deinem Tier. */
  const meinWert=rennWert(ich,rennParcours);
  const meineKlasse=grKlasse(ich.pT||4);
  let pool=Object.entries(MODELLE).filter(([id,m])=>!m.puzzle&&Math.abs(grKlasse(m.pT)-meineKlasse)<=1).map(([id,m])=>({id,m}));
  if(pool.length<3) pool=Object.entries(MODELLE).filter(([id,m])=>!m.puzzle).map(([id,m])=>({id,m}));
  const gegner=[];
  for(let i=0;i<3;i++){
    const km=zufall(pool).m;
    const fam=FAMILIEN[km.fam]||{};
    const wBasis=Object.fromEntries(Object.keys(WERTE).map(k=>[k,kl(km.w[k]*z(0.92,1.05),3,99)]));
    gegner.push({uid:"g"+i,name:GEGNER_HOEFE[(i+zi(0,2))%GEGNER_HOEFE.length],
      art:zufall(WUNSCHTIER_ARTEN),
      farbe:fam.farbe||"#d8b08a",muster:fam.muster,pT:km.pT,pA:km.pA||km.pT,moe:km.moe,ctx:km.ctx,
      w:wBasis,rz:km.rz,denken:km.rz>0,quant:"q4",setups:[],adapters:[],geschirr:pc.agent?zufall(Object.keys(HARNESSE)):null,
      tc:km.tc,fam:km.fam,api:false,bucht:null,zustand:100,gegner:true,
      wert:gegnerWert(km,rennParcours)});
  }
  const feld=[{p:ich,wert:meinWert,pos:0,fertig:0},...gegner.map(g=>({p:g,wert:g.wert,pos:0,fertig:0}))];
  feld.forEach(f=>f.tempo=f.wert*z(0.92,1.08));
  feld.sort(()=>Math.random()-0.5);
  blattZu();
  document.getElementById("renntitel").textContent=pc.z+" "+pc.n;
  document.getElementById("bahnen").innerHTML=feld.map((f,i)=>
    '<div class="bahn '+(f.p.gegner?"":"ich")+'"><span class="schild">'+esc(f.p.name)+'</span><div class="ziel"></div>'+
    '<div class="fortschritt"><i id="fs'+i+'" style="width:0"></i></div>'+
    '<div class="laeufer" id="lf'+i+'" style="left:8%">'+(f.p.gegner?tierSvg(f.p.art||"schwein",{farbe:f.p.farbe,muster:f.p.muster,gr:grKlasse(f.p.pT)}):pigSvgVon(ich))+'</div></div>').join("");
  document.getElementById("kommentar").textContent="Die Tiere schnauben am Start …";
  document.getElementById("rennaktion").innerHTML="";
  document.getElementById("rennschirm").classList.add("auf");
  const sprueche=["Sauberer Start!","Das Feld zieht sich auseinander.","Zwischenwertung läuft…","Die Zielgerade!"];
  const start=performance.now(); let letzte=start, spruch=0, fertig=false;
  function schritt(){
    const jetzt=performance.now(), dt=Math.min(.05,(jetzt-letzte)/1000); letzte=jetzt;
    const t=(jetzt-start)/1000;
    let alle=true;
    feld.forEach((f,i)=>{
      if(f.pos<100){
        alle=false;
        const schub=1+Math.sin(t*2.4+i*1.7)*.09+z(-.05,.05);
        f.pos=Math.min(100,f.pos+(6+(f.tempo/100)*22)*schub*dt);
        if(f.pos>=100) f.fertig=t;
      }
      const el=document.getElementById("lf"+i), bar=document.getElementById("fs"+i);
      if(el) el.style.left=(8+f.pos*.80)+"%";
      if(bar) bar.style.width=f.pos+"%";
    });
    if(t>spruch*2.4+1.5&&spruch<sprueche.length) document.getElementById("kommentar").textContent=sprueche[spruch++];
    if(!alle&&t<24) requestAnimationFrame(schritt);
    else if(!fertig){ fertig=true; rennAuswertung(feld,ich,pc); }
  }
  requestAnimationFrame(schritt);
}
function rennAuswertung(feld,ich,pc){
  const rangliste=[...feld].sort((a,b)=>(a.fertig||999)-(b.fertig||999));
  const platz=rangliste.findIndex(f=>f.p.uid===ich.uid);
  const preis=[pc.preis+S.ruf*2,Math.round(pc.preis*0.4),Math.round(pc.preis*0.15),0][platz]||0;
  let skandal=false;
  if(ich.contaminated&&platz===0&&Math.random()<0.3){ skandal=true; }
  if(!skandal){ if(preis) buche(preis,"arena","Festwiese: Platz "+(platz+1)+" – "+pc.n); if(platz===0){ rufBonusDazu(5); S.statistik.siege++; questHook("benchmark_sieg",null); } else rufBonusDazu(1); }
  else { rufBonusDazu(-12); }
  rufNeuBerechnen();
  questHook("benchmark_teilnahme",null);
  ich.zustand=kl(ich.zustand-6,5,100);
  tierXp(ich,20+((3-platz)*10));
  document.getElementById("kommentar").innerHTML=skandal?
    "🚨 Skandal! Die Jury findet Prüfungsfragen im Futterprotokoll von <b>"+esc(ich.name)+"</b> – Titel aberkannt, Ruf −12! (Benchmark-Kontamination)":
    (platz===0?"🥇 <b>"+esc(ich.name)+"</b> gewinnt "+esc(pc.n)+"! +"+geld(preis):"Platz "+(platz+1)+" für <b>"+esc(ich.name)+"</b>."+(preis?" +"+geld(preis):""));
  document.getElementById("rennaktion").innerHTML='<div class="karte"><div class="werteliste">'+
    rangliste.map((f,i)=>'<div class="listenzeile"><span style="font-size:20px;flex:0 0 28px;text-align:center">'+["🥇","🥈","🥉","4."][i]+'</span><span class="txt"><b>'+esc(f.p.name)+'</b><span>'+(f.p.gegner?"Nachbarhof · "+((FAMILIEN[f.p.fam]||{}).n||"")+"-Schwein":"dein Hof · Formwert "+rd(f.wert))+'</span></span></div>').join("")+'</div>'+
    '<div class="reihe abstand"><button class="knopf" onclick="rennenSchliessen()">Zurück zum Hof</button></div></div>';
  alles(); sichern();
}

function forschungsKosten(f){ const eff=(typeof aktiveEffekte==="function")?aktiveEffekte("forschung"):[]; return Math.round(f.kosten*eff.reduce((x,e)=>x*(1+e.wert),1)); }   /* Ära 8: Landesförderung */
function forschungsSperre(id){
  const f=FORSCHUNG[id];
  if(!f) return "Unbekanntes Forschungsthema.";
  if(!istFrei("gebForschung")) return "Die Forschungshütte öffnet auf Hofstufe 2.";
  if(S.forschung[f.frei]) return f.n+" ist schon erforscht.";
  if(S.forschungAktiv){ const l=FORSCHUNG[S.forschungAktiv.id]||{}; return "Es läuft schon eine Forschung: "+(l.n||S.forschungAktiv.id)+" (noch "+S.forschungAktiv.rest+" Tag"+(S.forschungAktiv.rest===1?"":"e")+")."; }
  const fehlt=(f.braucht||[]).filter(b=>!(FORSCHUNG[b]?S.forschung[FORSCHUNG[b].frei]:S.forschung[b]));
  if(fehlt.length) return "Erst die Voraussetzungen erforschen: "+fehlt.map(b=>(FORSCHUNG[b]||{}).n||b).join(", ")+".";
  const kosten=forschungsKosten(f);
  if(S.kredit<kosten||!kannZahlen(kosten)) return "Für "+f.n+" reicht die Kasse nicht: "+geld(kosten)+" nötig, "+geld(S.kredit)+" da.";
  return "";
}

  S.forschungAktiv={id,rest:f.tage};
  melde("Forschung gestartet: "+f.n,"gut");
  alles(); sichern(); zeigeForschung();
  return true;
}

function bildVerkleinern(dataUrl,gr){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>{ try{
      const s=Math.min(gr/im.width,gr/im.height,1);
      const c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(im.width*s)); c.height=Math.max(1,Math.round(im.height*s));
      const ctx=c.getContext("2d");
      ctx.drawImage(im,0,0,c.width,c.height);
      /* Freistellen: Flood-Fill vom Rand entfernt die zusammenhängende Hintergrundfläche
         (Eckfarben-Toleranz) – weiße Bäuche IM Tier bleiben erhalten. */
      const d=ctx.getImageData(0,0,c.width,c.height), px=d.data, W=c.width, H=c.height;
      let er=0,eg=0,eb=0;
      [[0,0],[W-1,0],[0,H-1],[W-1,H-1],[Math.floor(W/2),0],[0,Math.floor(H/2)],[W-1,Math.floor(H/2)]].forEach(([x,y])=>{const i=(y*W+x)*4;er+=px[i];eg+=px[i+1];eb+=px[i+2];});
      er/=7;eg/=7;eb/=7;
      const passt=i=>{const dr=px[i]-er,dg=px[i+1]-eg,db=px[i+2]-eb;return dr*dr+dg*dg+db*db<4200;};
      const gesehen=new Uint8Array(W*H), stapel=[];
      for(let x=0;x<W;x++){stapel.push(x,x+(H-1)*W);}
      for(let y=0;y<H;y++){stapel.push(y*W,y*W+W-1);}
      while(stapel.length){
        const idx=stapel.pop();
        if(gesehen[idx])continue; gesehen[idx]=1;
        const i4=idx*4;
        if(!passt(i4))continue;
        px[i4+3]=0;
        const x=idx%W,y=(idx-x)/W;
        if(x>0)stapel.push(idx-1); if(x<W-1)stapel.push(idx+1);
        if(y>0)stapel.push(idx-W); if(y<H-1)stapel.push(idx+W);
      }
      /* weiche Kante: undurchsichtige Pixel mit transparentem Nachbarn leicht abschwächen */
      const kopie=new Uint8ClampedArray(px);
      for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
        const i=(y*W+x)*4;
        if(kopie[i+3]===0)continue;
        if(kopie[i-4+3]===0||kopie[i+4+3]===0||kopie[i-W*4+3]===0||kopie[i+W*4+3]===0) px[i+3]=170;
      }
      ctx.putImageData(d,0,0);
      /* Zuschneiden auf den Inhalt (etwas Rand lassen) + mittlere Sättigung messen:
         fast farblose Kreaturen (weißes Lama …) bekommen später den Pastell-Farbweg */
      let minX=W,minY=H,maxX=0,maxY=0,sSum=0,sN=0;
      for(let y=0;y<H;y++)for(let x=0;x<W;x++){ const i=(y*W+x)*4; if(px[i+3]>10){
        if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
        if(px[i+3]>200&&((x+y)&3)===0){ const mx=Math.max(px[i],px[i+1],px[i+2]),mn=Math.min(px[i],px[i+1],px[i+2]); sSum+=(mx-mn)/255; sN++; }
      } }
      const satt=sN?sSum/sN:0;
      if(maxX>minX&&maxY>minY){
        const r=4, bw=Math.min(W,maxX-minX+1+r*2), bh=Math.min(H,maxY-minY+1+r*2);
        const c2=document.createElement("canvas"); c2.width=bw; c2.height=bh;
        c2.getContext("2d").drawImage(c,Math.max(0,minX-r),Math.max(0,minY-r),bw,bh,0,0,bw,bh);
        res({url:c2.toDataURL("image/png"),satt});
      } else res({url:c.toDataURL("image/png"),satt});
    }catch(e){rej(e);} };
    im.onerror=()=>rej(new Error("Bilddaten unlesbar"));
    im.src=dataUrl;
  });
}
/* Ein Bildaufruf an einen OpenAI-kompatiblen Anbieter; inhalt = String ODER Content-Array (Bild-Edit) */
async function bildAnfrage(base,key,modell,inhalt){
  const r=await fetch(base+"/chat/completions",{method:"POST",
    headers:{"Authorization":"Bearer "+key,"Content-Type":"application/json"},
    body:JSON.stringify({model:modell,messages:[{role:"user",content:inhalt}],modalities:["image","text"]})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error((j.error&&j.error.message)||("Anbieter-Fehler "+r.status));
  const msg=j.choices&&j.choices[0]&&j.choices[0].message;
  let url=null;
  if(msg&&msg.images&&msg.images[0]) url=msg.images[0].image_url?msg.images[0].image_url.url:msg.images[0].url;
  if(!url&&msg&&Array.isArray(msg.content)){ const teil=msg.content.find(x=>x.type==="image_url"); if(teil) url=teil.image_url.url; }
  if(!url) throw new Error("Der Anbieter hat kein Bild geliefert (Modell prüfen – es muss Bildausgabe können).");
  return url;
}

      EG_STIL+"Full body, standing still upright on its legs in a relaxed calm stance, strict full side profile view facing RIGHT (head on the right side of the image). The creature: "+prompt);
    const steh=await bildVerkleinern(roh1,260);

    const posen={lauf:null,lieg:null}, kaputt=[];
    sag("🚶 Pose 2/3 – Laufen …");
    const laufAnw="the creature is WALKING in mid-stride: front leg swung clearly forward, opposite hind leg pushed back, leg positions visibly different from standing, cheerful slight forward lean.";
    try{ posen.lauf=(await edit(laufAnw)).url; }
    catch(e){ try{ posen.lauf=(await edit(laufAnw)).url; }catch(e2){ kaputt.push("Laufpose"); } }
    sag("😴 Pose 3/3 – Liegen …");

    try{ posen.lieg=(await edit(liegAnw)).url; }
    catch(e){ try{ posen.lieg=(await edit(liegAnw)).url; }catch(e2){ kaputt.push("Liegepose"); } }
    _eigenTemp={steh:steh.url,lauf:posen.lauf,lieg:posen.lieg,satt:steh.satt};
    sag(kaputt.length?("⚠️ "+kaputt.join(" & ")+" fehlgeschlagen – dafür gibt es Ersatz-Animationen. Du kannst auch nochmal würfeln."):"");
  }catch(e){

}

/* Eigenkreatur: Posen-Größenausgleich zur Laufzeit messen – gleiche Methode wie die
   vermessenen TIER_POSEN.sk (sqrt der Alpha-Fläche je Canvasbreite, normiert auf steh).
   Geklemmt auf 0.6–1.8, weil Nutzerbilder auch mal fast leere Alphamasken haben. */
function eigenSkMessen(){
  S.eigenSk=null;
  if(!S.eigenBild||!S.eigenPosen) return;
  const miss=url=>new Promise(res=>{
    if(!url) return res(null);
    const im=new Image();
    im.onload=()=>{ try{
      const c=document.createElement("canvas"); c.width=im.width; c.height=im.height;
      const g=c.getContext("2d"); g.drawImage(im,0,0);
      const d=g.getImageData(0,0,c.width,c.height).data;
      let n=0; for(let i=3;i<d.length;i+=4) if(d[i]>25) n++;
      res(n>40?Math.sqrt(n)/c.width:null);
    }catch(e){ res(null); } };
    im.onerror=()=>res(null);
    im.src=url;
  });
  Promise.all([miss(S.eigenBild),miss(S.eigenPosen.lauf),miss(S.eigenPosen.lieg)]).then(([st,la,li])=>{
    if(!st) return;
    const f=x=>x?kl(Math.round(st/x*1000)/1000,0.6,1.8):null;
    S.eigenSk={lauf:f(la),lieg:f(li)};
    sichern(); if(tierArt()==="eigen") wieseNeu();
  });
}

/*===HOFLOOP===*/

/* Boot-Sequenz */
document.getElementById("bootpig").innerHTML=(typeof pigSvg==="function")?pigSvg({farbe:"#f4a6c0",gr:1}):"🐷";
const bootBild=document.createElement("img");
bootBild.src=bild("titel"); bootBild.className="titelbild"; bootBild.alt="";
bootBild.onerror=()=>bootBild.remove();
document.querySelector("#boot .schild").before(bootBild);
/* Ladebalken an ECHTE Meilensteine gehängt (v7.3): Er lief früher auf einem Zufallstakt
   mit 0,3 s CSS-Überblendung – der Schirm verschwand, während der Balken noch bei 20 %
   stand. Jetzt zieht der Balken weich zu einem Ziel, das nur echte Ereignisse anheben:
   Titelbild geladen, Schriften bereit, window.load. Erst bei 100 % startet das Spiel. */
const ladeworte=["Gewichte werden entpackt","Buchten werden ausgemistet","Agenten-Tools geprüft","Futtersilos gefüllt","Benchmark-Pokale poliert","Schweine geweckt"];
let ladeZiel=10, ladeIst=0, ladeFrei=false, bootGestartet=false;
function ladeSetz(z){ ladeZiel=Math.max(ladeZiel,Math.min(100,z)); }
bootBild.addEventListener("load",()=>ladeSetz(48));
bootBild.addEventListener("error",()=>ladeSetz(48));
if(bootBild.complete) ladeSetz(48);
try{ if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>ladeSetz(64)); else ladeSetz(64); }catch(e){ ladeSetz(64); }
function ladeFertig(){ ladeFrei=true; ladeSetz(100); }
if(document.readyState==="complete") ladeFertig(); else window.addEventListener("load",ladeFertig);
setTimeout(ladeFertig,7000);                       /* Sicherheitsnetz: nie im Ladeschirm hängen bleiben */
const ladeTakt=setInterval(()=>{
  ladeIst=Math.min(ladeZiel,ladeIst+Math.max(0.8,(ladeZiel-ladeIst)*0.16));
  document.querySelector("#ladebalken i").style.width=ladeIst.toFixed(1)+"%";
  document.getElementById("ladetext").textContent=ladeworte[Math.min(ladeworte.length-1,Math.floor(ladeIst/(100/ladeworte.length)))];
  if(ladeFrei&&ladeIst>=99.4&&!bootGestartet){
    bootGestartet=true;
    document.querySelector("#ladebalken i").style.width="100%";
    document.getElementById("ladetext").textContent=ladeworte[ladeworte.length-1];
    clearInterval(ladeTakt);
    setTimeout(()=>{
      document.getElementById("boot").classList.add("weg");
      start();
      /* Ada wartet, bis der Hof wirklich steht – erst dann fängt sie an vorzulesen. */
      setTimeout(()=>{ if(typeof adaBereitMachen==="function") adaBereitMachen(); },2000);
    },420);
  }
},60);
