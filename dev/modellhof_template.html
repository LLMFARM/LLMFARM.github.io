/* Bucht & GPU eines Schweins */
function buchtVon(p){ return p&&p.bucht?S.buchten.find(b=>b.id===p.bucht):null; }
function gpuVon(p){ const b=buchtVon(p); return b?GPUS[b.gpu]:null; }
function istNadel(p){ return !!(p&&(p.nadel||(MODELLE[p.modell]||{}).nadel)); }   /* Ära 9: Nadelklasse */
function passtInBucht(p,b){ const g=GPUS[b.gpu]||{}; if(g.nurNadel) return istNadel(p); return vramPig(p)<=g.vram; }
function offloaded(p){ const b=buchtVon(p); return b?!passtInBucht(p,b):false; }
/* Hof-RAM als echte RAM-Auslagerung-Grenze (MH-019): Überhang aller ausgelagerten Tiere + 8 GB Grundlast */
function ramFrei(ausser,ziel){
  const lokal=ziel||buchtVon(ausser);
  if(lokal&&lokal.ramGB)return (GPUS[lokal.gpu]||{}).unified?0:Math.max(0,lokal.ramGB-8);   /* Ära 8: Unified Memory ist schon der Modellspeicher */
  let belegt=8;
  S.tiere.forEach(t=>{ if(t!==ausser&&!t.api&&t.bucht){ const b=buchtVon(t);
    if(b){ const u=vramPig(t)-GPUS[b.gpu].vram; if(u>0) belegt+=u; } } });
  return (S.ramGB||64)-belegt;
}

/* Tempo in Token/s – memory-bound: Bandbreite / aktive Gewichtsgröße */
function spekPartner(p){
  if(!p.setups.includes("spek")) return null;
  return S.tiere.find(d=>d.uid!==p.uid&&!d.api&&d.fam===p.fam&&d.pT<=p.pT/8&&d.bucht&&d.status==="frei")||null;
}
function tokps(p){
  if(p.api){ const m=LEIHMODELLE[p.modell]; return m&&m.tokps?m.tokps:55; }
  if(archVon(p)==="hrm") return 40;
  if(istNadel(p)){ const g=gpuVon(p); return g?(g.nadelTps||1200):0; }   /* Ära 9: Nadel – 500 tok/s Pi 5 (Hersteller), 1 200 auf GPUs (Spielannahme) */                     // Rätsel-Solver: Durchsatz spielt kaum eine Rolle
  const g=gpuVon(p); if(!g) return 0;
  const bpw=quantVon(p.quant).bpw;
  const aktivGB=Math.max(0.3,(p.pA||p.pT)*bpw/8);
  let t=g.bw/aktivGB*0.55;
  if(offloaded(p)){
    /* RAM-Auslagerung wirkt ANTEILIG (MH-019): der ausgelagerte Gewichtsanteil läuft über das ~8× langsamere RAM.
       1/(1+7×Anteil): 2 % Überhang ≈ −12 % Tempo, komplett im RAM ≈ ×0,125 – keine Klippe bei 0,1 GB. */
    const b=buchtVon(p);
    const ueber=Math.max(0,vramPig(p)-GPUS[b.gpu].vram);
    const gewichte=Math.max(0.3,p.pT*quantVon(p.quant).bpw/8);
    const ramAnteil=kl(ueber/gewichte,0,1);
    t*=1/(1+7*ramAnteil);
  }
  if(p.setups.includes("spek")){ const d=spekPartner(p); if(d) t*=(SETUPS.spek.tempo||1.9); }  // OHNE kompatibles Draft-Modell kein Turbo (MH-025); Familien-Tokenizer = Spielannahme
  if(typeof skillAktiv==="function"&&skillAktiv("kernels")) t*=1.10;                     /* Skill: FlashAttention & getunte Kernels */
  if(quirkHat(p,"onDeviceFlink")&&p.pT<=15) t*=1.15;                                      /* Ära 7.5 (T-16): belegter Drafter/Edge-Optimierung */
  return Math.max(0.4,Math.round(t*10)/10);
}

/* Tages-Durchsatz in Mtok (14 Arbeitsstunden). j optional: Batching wirkt nur bei parallelen Anfragen (MH-024) */
function mtokTagKapazitaet(p,j){
  if(p.api){ let lim=LEIHMODELLE[p.modell].limitMtok;
    if(p.rz>0&&p.denken) lim*=0.7;                  // Denk-Token verbrauchen echtes Tageskontingent (MH-015)
    return Math.round(lim*10)/10; }
  let denkFaktor=(p.rz>0&&p.denken)?(quirkHat(p,"denkbudget")?0.6:0.45):1;  // Denk-Tokens fressen Durchsatz
  const routine=1+0.02*Math.min(6,Math.max(0,(p.level||1)-1));
  const merk=(typeof merkmalHat==="function")?(merkmalHat(p,"fleissig")?1.04:1)*(merkmalHat(p,"zappelig")?0.98:1):1;   /* Ära 8: Merkmale */                 /* Ära 7.5: Modellstufe = Routine (Prompt-Cache, eingespielte Vorlagen) → bis +12 % Durchsatz */
  let f=1;
  if(istNadel(p)) f*=0.6;   /* Ära 9: Nadelklasse – Rüstzeit je Werkzeugaufruf (Spielannahme) */
  if(quirkHat(p,"redselig")) f*=0.9;
  if(quirkHat(p,"knapp")) f*=1.08;
  (p.setups||[]).forEach(id=>{ const s=SETUPS[id]; if(s&&s.tokens) f/=s.tokens; });  // Best-of-N & Co: Mehr-Token senken die NUTZ-Kapazität (MH-016)
  const _sid=stackId(buchtVon(p));                        // Ära 7: Serving-Gewinn hängt am Bucht-Laufzeitumgebung
  if(_sid==="vllm") f*=(j&&j.parallel)?4:1.15;            // Continuous Batching: nur viele parallele Anfragen füllen den Batch
  if(_sid==="sglang"){ f*=(j&&j.parallel)?2.5:1.1; if(j&&(j.agent||j.team||j.rollen)) f*=1.14; }   // RadixAttention: Prefix-Cache liebt Agenten-Ketten
  const abw=(typeof ereignisDurchsatzF==="function")?ereignisDurchsatzF(p):1;   /* Ära 8: Abwerbung lenkt ab */
  return Math.round(tokps(p)*3600*14/1e6*denkFaktor*f*routine*merk*abw*100)/100;
}

/* ── COMPUTE: die echte Arbeitskraft des Hofs (N7) ──
   Kapazität hängt an der HARDWARE (tok/s je GPU) und wird in zwei Alltagsgrößen übersetzt:
   Mtok/Tag (Arbeitsmenge) und 👥 gleichzeitige Nutzer. Spielannahme: ein aktiver Nutzer zieht
   im Schnitt 1,5 tok/s (Lese-/Tipp-Pausen eingerechnet ≈ 75k Token je 14-h-Tag).
   Ohne Serveroptimierung (vLLM) bedient eine Karte nur 2 Sitzungen wirklich gleichzeitig –
   Batching macht aus derselben Hardware ein Vielfaches. API-Anbieter skalieren selbst (du zahlst je Token). */
const TOK_JE_NUTZER=1.5, MTOK_JE_NUTZER_TAG=0.075;
function nutzerKapazitaet(p){
  if(p.api) return Infinity;
  if(!p.bucht||archVon(p)==="hrm") return 0;
  const roh=Math.floor(tokps(p)/TOK_JE_NUTZER);
  /* Ära 7: Der 👥-Multiplikator hängt am BUCHT-Laufzeitumgebung, nicht mehr an der Forschung allein */
  const sid=stackId(buchtVon(p));
  if(sid==="vllm") return roh;                                            // Continuous Batching: volle Parallelität
  if(sid==="sglang") return Math.min(Math.max(4,Math.floor(roh*0.6)),roh); // gutes Batching, Stärke liegt bei Agenten
  return Math.min((typeof skillAktiv==="function"&&skillAktiv("servingprofi"))?3:2,roh);   /* lokale Laufzeitumgebung + Skill: einfaches Request-Batching */
}
function nutzerSchaetzungKatalog(m){
  const gs=(S.buchten||[]).map(b=>GPUS[b.gpu]); if(!gs.length) return 0;
  const g=[...gs].sort((a,b)=>b.bw-a.bw)[0];
  const t=g.bw/Math.max(0.3,(m.pA||m.pT)*2)*0.55;      // bf16-Schätzung auf der schnellsten eigenen Karte
  const roh=Math.floor(t/TOK_JE_NUTZER);
  return forschungFrei("vllm")?roh:Math.min(2,roh);
}
function hofCompute(){
  let lokal=0, cloud=0, nutzer=0;
  (S.tiere||[]).forEach(p=>{
    if(p.api){ cloud+=LEIHMODELLE[p.modell]?LEIHMODELLE[p.modell].limitMtok:0; }
    else if(p.bucht&&archVon(p)!=="hrm"){ lokal+=mtokTagKapazitaet(p); nutzer+=nutzerKapazitaet(p); }
  });
  return {lokal:Math.round(lokal*10)/10, cloud:Math.round(cloud*10)/10, nutzer};
}

/* Effektive Fähigkeiten */
function effW(p,opt={}){
  const w={...p.w};
  /* Quantisierung: kleine Modelle leiden stärker */
  const q=quantVon(p.quant);
  if(q.malus>0&&!p.api){
    const f=p.pT<8?1.25:p.pT<30?1.1:p.pT<200?0.9:0.7;   /* Ära 7.5 (Lehr-Audit 7): kleine Modelle leiden spürbar, aber nicht dreifach */
    ["logik","code","wissen","schreiben"].forEach(k=>w[k]-=q.malus*f);
    w.treue-=q.malus*f*0.6;
  }
  /* Denkmodus */
  if(p.rz>0&&p.denken){ w.logik+=8; w.code+=5; }
  else if(p.rz>0&&!p.denken){ /* schnell, aber ohne Bonus */ }
  /* Betriebstemperatur (Sampler): Werkseinstellung ist neutral, Abweichen hat echte Trade-offs */
  if(p.temp==="praezise"){
    w.treue+=3; w.schreiben-=4;
    if(quirkHat(p,"repetitionsrisiko")&&!quirkHat(p,"kaltstabil")){ w.treue-=7; w.schreiben-=3; } // Wiederholungsschleifen bei zu kalter Einstellung (dokumentiert u. a. bei Qwen)
  }
  if(p.temp==="kreativ"){
    w.schreiben+=4; w.treue-=4;
    if(quirkHat(p,"hitzeempfindlich")){ w.treue-=6; w.wissen-=3; }
  }
  /* LoRA-Adapter */
  (p.adapters||[]).forEach(a=>{ for(const k in a.w) w[k]=(w[k]||40)+a.w[k]; });
  /* Hilfsmittel */
  (p.setups||[]).forEach(id=>{ if(id==="rag") return; /* Ära 7.5: RAG wirkt nur je Auftrag (jobCheckBasis) */ const mod=hlSetupMod(id); for(const k in mod) w[k]=(w[k]||40)+mod[k]; });
  if(quirkHat(p,"wissensluecke")) w.wissen-=4;   /* Ära 7.5 (T-16): dokumentierte Faktenschwäche */
  /* Krankheit */
  if(p.krank&&KRANKHEITEN[p.krank]){ const kw=KRANKHEITEN[p.krank].wirkung; for(const k in kw) w[k]=(w[k]||40)+kw[k]; }
  /* Sitzungs-/Cache-Zustand (KEINE Modellermüdung: Gewichte bleiben unverändert, MH-039) */
  const zf=0.78+((p.zustand??100)/100)*0.22;
  for(const k in w) w[k]*=zf;
  /* RAM-Auslagerung kostet Zeit und Strom, aber KEIN Wissen (MH-019) – identische Gewichte an anderem Speicherort */
  for(const k in w) w[k]=kl(Math.round(w[k]),2,99);
  return w;
}

/* Tool-Eignung 0-100: FUNKTIONS-Profil statt Marken-Affinität (MH-068).
   Zählt: Anschluss (Werkzeugprotokoll), Editierformat vs. Formatfestigkeit, Kontextstrategie, Fehlerbehebung.
   Werte sind gekennzeichnete Spielannahmen, keine Messungen. Die alte aff-Tabelle wird nicht mehr gelesen. */
function geschirrEignung(p,hid){
  const h=HARNESSE[hid]; if(!h) return 0;
  if(archVon(p)==="hrm") return 0;                     // kein Sprachmodell -> kann kein Agenten-Tool führen
  const fk=h.funk||{};
  let s=55;
  s+=(p.tc>=h.tcMin)?20:-35;                                        // Anschluss: nötiges Werkzeugaufrufe
  if(fk.tools&&(p.w.werkzeug||40)>=55) s+=10;                        // Werkzeugtasche nützt nur werkzeugfesten Modellen
  if(fk.format==="patch"||fk.format==="sr") s+=(p.tc>=2?8:-6);       // präzise Editierformate brauchen formatfeste Ausgabe
  if(fk.format==="volltext") s+=3;                                   // robust, aber mehr Ausgabe (kostet Kapazität)
  if(fk.kontext==="voll"&&p.ctx<64) s-=8;
  if(fk.kontext==="retrieval") s+=4;
  if(fk.recovery) s+=5;
  if(p.api) s+=3;
  return kl(Math.round(s),0,100);
}

/* Agent-Gesamtscore eines Schweins mit Agenten-Tool (für Agent-Jobs & SWE-Arena) */
function agentScore(p){
  if(!p.geschirr) return 0;
  const h=HARNESSE[p.geschirr]; if(!h) return 0;
  const w=effW(p);
  let s=w.werkzeug*0.42+w.code*0.30+w.treue*0.14+Math.min(p.ctx,256)/256*100*0.14;
  s*=geschirrEignung(p,p.geschirr)/100;
  if(p.tc<h.tcMin) s*=0.25;   // Modell beherrscht das nötige Werkzeugaufrufe nicht
  if(h.mcp&&typeof mcpEffekte==="function") s+=mcpEffekte().agentBonus;   /* v9.9: MCP-Werkzeuge erhöhen die Agentenleistung – nur mit einem MCP-fähigen Agenten-Tool */
  return kl(Math.round(s),0,99);
}

/* Job-Eignung – inkl. Bauform, Eigenheiten, RAG-Passung und Hof-Betriebsschicht */
function jobCheckBasis(p,j){
  const w=effW(p), gruende=[], boni=[];
  let quote=[], ok=true;
  const wissensArt=["wissen","support","recht","medizin"].includes(j.art);
  /* Ära 7.5 (Lehr-Audit 11): Retrieval hebt nur quellenbasierte Arbeit – bei Code/Stil/Rätsel kostet es nur Token */
  if(wissensArt&&(p.setups||[]).includes("rag")){ const mod=hlSetupMod("rag"); for(const k in mod) w[k]=kl((w[k]||40)+mod[k],2,99); }
  if(quirkHat(p,"selbstlob")&&["wissen","recht","medizin"].includes(j.art)){ gruende.push("Eigenheit: Benchmark-Glanz, Alltagsschwäche (−3)"); }
  /* Rätsel-Aufträge: Spezialarchitektur glänzt, LLMs zahlen drauf */
  if(j.art==="puzzle"){
    if(archVon(p)==="hrm"){
      const erfolg=kl(38+(p.puzzle||90)*0.55+((w.treue||50)-50)*0.2,10,97);
      boni.push("Rätsel-Architektur: löst reine Struktur-Rätsel nativ");
      return {ok:true,gruende,boni,erfolg,anteil:1,min:1.4};
    }
    if(!(p.rz>0&&p.denken)){ ok=false; gruende.push("Reines Rätsel: braucht Denkmodus oder Rätsel-Architektur (HRM/TRM)"); }
  }
  for(const k in j.anf){
    const q=(w[k]||0)/j.anf[k]; quote.push(q);
    if(q<1){ ok=false; gruende.push(WERTE[k]+" zu niedrig ("+rd(w[k])+"/"+j.anf[k]+")"); }
  }
  /* OKF-Wissensgraph: gezieltes Nachschlagen SENKT den Kontextbedarf etwas – er verdoppelt kein Fenster (MH-046) */
  const ctxNoetig=(j.agent&&forschungFrei("okf"))?Math.round(j.ctxMin*0.75):j.ctxMin;
  if(istNadel(p)&&j.tier===0&&ctxNoetig<=4&&p.ctx<ctxNoetig){ boni.push("🪡 Kurzfälle passen einzeln ins 256-Token-Fenster der Nadel"); }   /* Ära 9: Mikro-Zettel bestehen aus kurzen Einzelfällen */
  else if(p.ctx<ctxNoetig){ ok=false; gruende.push(p.ctx<1?"Kontextfenster "+Math.round(p.ctx*1000)+" Token zu klein – der Zettel braucht "+j.ctxMin+"k":"Kontextfenster zu klein ("+p.ctx+"k/"+j.ctxMin+"k)"); }
  else if(j.agent&&forschungFrei("okf")&&p.ctx<j.ctxMin) boni.push("OKF-Graph: gezieltes Retrieval senkt den Kontextbedarf (−25 %)");
  if(j.dsgvo&&p.api){ ok=false; gruende.push("Kundenvorgabe: Verarbeitung nur auf eigener Hardware (auf eigener Hardware-Klausel)"); }
  if(p.nc){ ok=false; gruende.push("Lizenz erlaubt keine kommerzielle Nutzung ("+p.lic+") – bezahlte Aufträge sind tabu"); }
  if(j.agent){
    if(archVon(p)==="hrm"){ ok=false; gruende.push("kein Sprachmodell – kann keine Werkzeuge bedienen"); }
    else if(!p.geschirr){ ok=false; gruende.push("braucht ein Agenten-Tool (Agent-Harness)"); }
    else if(agentScore(p)<40){ ok=false; gruende.push("Agentenleistung zu niedrig ("+agentScore(p)+"/40)"); }
  }
  const t=tokps(p);
  if(t<j.latenz){ ok=false; gruende.push("zu langsam ("+t+" von "+j.latenz+" Token/s)"); }
  /* Ära 7 – Laufzeitumgebung-Regeln der Bucht */
  const _b=buchtVon(p);
  if(_b&&(_b.stackBereit||0)>S.tag){ ok=false; gruende.push("Bucht richtet die neue Laufzeitumgebung "+stackVon(_b).n+" ein – ab morgen einsatzbereit"); }
  if(_b&&stackId(_b)==="sglang"&&j.agent) boni.push("SGLang-Prefix-Cache: Agenten-Ketten laufen spürbar günstiger");
  let kap=mtokTagKapazitaet(p,j);
  if(j.agent&&p.geschirr&&HARNESSE[p.geschirr]){                       // Tool-Overhead verringert die nutzbare Kapazität (MH-044)
    const ot=Math.max(2,((HARNESSE[p.geschirr].funk||{}).overheadTok||4)-((typeof mcpEffekte==="function")?mcpEffekte().overheadMinus:0));   /* v9.9: resources ersetzen hineinkopierten Kontext */
    kap*=1-Math.min(0.3,ot/40);
  }
  const roh=kap/Math.max(1e-6,j.mtokTag||1e-6);          /* Ära 7.5 (W-17): ungedeckelter Kapazitätsquotient → Stundenbedarf */
  let anteil=kl(roh,0,1);
  /* Massen-Zettel = ANDRANG: hier zählt, wie viele Nutzer GLEICHZEITIG bedient werden (N7).
     Zu wenig Parallelität deckelt die Leistung ehrlich – Serveroptimierung und leistungsstarke Karten lohnen sich. */
  if(j.parallel&&!p.api){
    const nk=nutzerKapazitaet(p), nm=j.nutzerMin||Math.max(2,Math.ceil(j.mtokTag/MTOK_JE_NUTZER_TAG));
    if(nk<nm){
      anteil=kl(Math.min(anteil,nk/nm),0,1);
      gruende.push("👥 bedient nur "+nk+" von ~"+nm+" gleichzeitigen Nutzern – Warteschlange!"+(forschungFrei("vllm")?" (größere/mehr GPUs helfen)":" (Serveroptimierung mit vLLM erforschen!)"));
    } else boni.push("👥 Andrang locker bedient ("+(nk===Infinity?"API skaliert":nk+" Plätze")+" für ~"+nm+" Nutzer)");
  }
  if(anteil<0.5&&!p.api&&!j.parallel){ gruende.push("schafft pro Tag nur "+rd(anteil*100)+"% der geplanten Tagesarbeit"+(forschungFrei("vllm")?"":" – Tipp: Serveroptimierung erforschen")); }
  const min=quote.length?Math.min(...quote):1;
  let erfolg=kl(46+min*34+((w.treue||50)-50)*0.25+(j.agent?((agentScore(p)-55)*0.2):0),4,97);
  if(j.agent&&typeof mcpJobCheck==="function"){ const _m={ok:true,gruende:[],boni:[],erfolg:0}; mcpJobCheck(j,_m); if(!_m.ok) ok=false; gruende.push(..._m.gruende); boni.push(..._m.boni); erfolg=kl(erfolg+_m.erfolg,4,97); }   /* v9.9: MCP-Anschlüsse */
  /* RAG wirkt aufgabenabhängig: stark bei Wissen, kaum bei Code/Logik */
  if(p.setups.includes("rag")&&hlRagBereit()){
    if(wissensArt){
      let plus=forschungFrei("secondbrain")?11:7;
      if(quirkHat(p,"grounding")) plus+=4;
      erfolg+=plus; boni.push("Quellensuche (RAG) greift hier stark (+"+plus+")");
    } else { erfolg+=1; if(j.art==="code"||j.art==="agent") boni.push("RAG hilft bei Code kaum – Wissen ist nicht das Problem"); }
  }
  /* Hof-Betriebsschicht */
  if(j.agent&&forschungFrei("openclaw")){ erfolg+=4; boni.push("OpenClaw-Leitstand: konsistente Agent-Umgebung (+4)"); }
  if(j.agent&&forschungFrei("hermes")){ erfolg+=3; }
  if(forschungFrei("hermes")){
    const geuebt=Math.min(4,Math.floor(((S.jobArt||{})[j.art]||0)/2));
    if(geuebt>0){ erfolg+=geuebt; boni.push("Hermes-Lernschleife: "+((S.jobArt||{})[j.art])+"× diese Auftragsart geübt (+"+geuebt+")"); }
  }
  if(wissensArt&&forschungFrei("secondbrain")){ erfolg+=5; boni.push("Second Brain: Hofwissen fließt ein (+5)"); }
  if(forschungFrei("okf")&&["wissen","recht","medizin"].includes(j.art)){ erfolg+=8; boni.push("OKF-Wissensgraph: Mehrschritt-Fragen sitzen (+8)"); }
  /* Bauform: SSM/linear hält lange Kontexte stabil */
  if((archVon(p)==="ssmh"||archVon(p)==="linh")&&j.ctxMin>=128){ erfolg+=4; boni.push(BAUFORMEN[archVon(p)].z+" Bauform: langer Kontext ohne Speicherdruck (+4)"); }
  /* Krankheiten wirken über die Stat-Mali hinaus situativ */
  if(p.krank==="kontextrot"&&j.ctxMin>=64){ erfolg-=10; gruende.push("🍂 Kontextrot: Langkontext geht gerade gar nicht (−10)"); }
  if(p.krank==="halluzinose"){ erfolg-=8; gruende.push("🫧 Halluzinose: hohes Reklamationsrisiko (−8)"); }
  if(p.krank==="schleifenfieber"&&["text","support","schreiben"].includes(j.art)){ erfolg-=6; gruende.push("🔁 Schleifenfieber: Textarbeit leidet (−6)"); }
  /* Eigenheiten (dokumentierte Quirks) */
  if(quirkHat(p,"direkt")&&["recht","medizin","wissen"].includes(j.art)){ erfolg+=4; boni.push("Eigenheit 'direkt': präzise Fachantworten (+4)"); }
  if(quirkHat(p,"hoeflich")&&j.art==="support"){ erfolg+=4; boni.push("Eigenheit: geborener Kundenversteher (+4)"); }
  if(quirkHat(p,"sicherheitsstreng")&&["support","recht"].includes(j.art)){ erfolg-=4; gruende.push("Eigenheit: übervorsichtige Ablehnungen kosten Zufriedenheit (−4)"); }
  if(quirkHat(p,"agentenausdauer")&&j.agent&&j.tage>=4){ erfolg+=4; boni.push("Eigenheit: agentische Ausdauer bei langen Tickets (+4)"); }
  if(quirkHat(p,"werkzeugdisziplin")&&j.agent){ erfolg+=3; boni.push("Eigenheit: saubere Werkzeugaufrufe (+3)"); }
  if(quirkHat(p,"kontextfest")&&j.ctxMin>=64){ erfolg+=4; }
  if(quirkHat(p,"buerotauglich")&&["recht","medizin"].includes(j.art)){ erfolg+=4; boni.push("Eigenheit: geprüfte Betriebstauglichkeit (+4)"); }
  if(quirkHat(p,"transparent")&&j.art==="wissen"){ erfolg+=3; }
  if(quirkHat(p,"selbstlob")&&["wissen","recht","medizin"].includes(j.art)) erfolg-=3;   /* Ära 7.5 (T-16) */
  erfolg=kl(erfolg,4,97);
  /* Ära 9: Fachwissen – Zettel aus sensiblen Sektoren verlangen Fachbildung, Überschuss bringt Qualität */
  if(typeof fachAnforderung==="function"){ const fa=fachAnforderung(j); if(fa){ const have=fachWert(p,fa.gebiet), G=FACH_GEBIETE[fa.gebiet]; if(have<fa.min){ ok=false; gruende.push("🎓 Fachwissen "+G.n+" zu niedrig ("+have+"/"+fa.min+") – Kurs in der Agentenwerkstatt"); } else { const bonus=Math.min(8,Math.round((have-fa.min)/5)); erfolg=kl(erfolg+bonus,4,97); boni.push("🎓 Fachwissen "+G.n+" "+have+"/"+fa.min+(bonus>0?" (+"+bonus+")":"")); } } }
  return {ok, gruende, boni, erfolg, anteil, roh, min};
}

/* ── EIN Rechenweg für Vorschau UND Abrechnung (MH-010/014):
   bezahlt wird pro AKZEPTIERTER Arbeitseinheit, nicht pro erzeugtem Token. ─ */
function jobEinheiten(j){ return Math.max(1,Math.round(j.einheiten||j.tage*3)); }
function jobLohnGesamt(j){
  if(Number.isFinite(j.vereinbart)) return j.vereinbart;
  const basis=j.lohnBasis||Math.round(j.preisMtok*j.mtokTag*j.tage);   // Alt-Aufträge: Token-Näherung als Übergang
  return Math.round(basis*nachfrageFaktor()*((typeof mcpLohnF==="function")?mcpLohnF(j):1));   /* v9.9: Anschlussprämie */
}
function einheitenRechnung(j,anteil){
  const einheiten=jobEinheiten(j);
  const preisEinheit=jobLohnGesamt(j)/einheiten;
  const ok=Math.round(einheiten*kl(anteil,0,1));
  return {einheiten, ok, preisEinheit, lohn:Math.round(ok*preisEinheit)};
}
function jobTagesKosten(p,j){
  if(p.api){
    const m=LEIHMODELLE[p.modell];
    const mtokTag=Math.min(mtokTagKapazitaet(p,j),j.mtokTag);
    const denkF=(p.rz>0&&p.denken)?1.4:1;                 // Denk-Token werden als Ausgabe berechnet (MH-015)
    const rabatt=(S.mini&&S.mini.tokenRabattTag===S.tag)?0.9:1;   /* Ära 7.5: Tokenizer-Wette gewonnen → heute −10 % */
    return mtokTag*(m.inTok*0.4+m.outTok*0.6*denkF)*0.92*rabatt;
  }
  const g=gpuVon(p); if(!g) return 0;
  const kwF=(p.setups||[]).reduce((f,id)=>f*((SETUPS[id]||{}).kw||1),1); // Verifier/Best-of-N ziehen echten Mehrstrom (MH-016)
  /* Ära 7.5 (R-18): dieselbe Basis wie die Abrechnung – Systemaufschlag, PUE und Inferenz-Lastfaktor statt nackter TDP */
  const b=buchtVon(p);
  const kw=(b&&typeof rhPeak==="function")?rhPeak(b)*((typeof rhCfg==="function")?rhCfg().pue:1.1)*((typeof rhLastFaktor==="function")?rhLastFaktor("job"):0.6):g.watt/1000;
  return kw*14*kwF*strompreis();
}
function jobOekonomie(p,j){
  const anteil=jobCheck(p,j).anteil;
  const er=einheitenRechnung(j,anteil);
  const mtok=Math.min(mtokTagKapazitaet(p,j),j.mtokTag)*j.tage;
  const kosten=jobTagesKosten(p,j)*j.tage;
  const kostenTxt=p.api?("API-Kosten "+geld(Math.round(kosten))):("Strom ~"+geld(Math.round(kosten)));
  return {mtok, lohn:er.lohn, einheiten:er.einheiten, einheitenOk:er.ok, preisEinheit:er.preisEinheit,
    kosten:Math.round(kosten), kostenTxt, marge:Math.round(er.lohn-kosten), anteil};
}

/* Wert eines Schweins (Weitergabe als Kundenprojekt, MH-012/013):
   Offene Gewichte sind kopierbar – bezahlt wird Einrichtung + NACHGEWIESENE Verbesserung (Trainingshistorie),
   nie der Katalogwert ein zweites Mal. Sofortiger Wiederverkauf ist immer ein Verlustgeschäft. */
function tierVerbesserung(p){
  return (p.historie||[]).filter(h=>h.delta).reduce((s,h)=>s+Object.values(h.delta).reduce((a,b)=>a+Math.max(0,b),0),0);
}
/* ── Effizienz-Index (Ära 7, Q6): Arbeitsleistung je Betriebskosten – der Nordstern der Zucht ──
   Leistung = Tages-Kapazität (Mtok) × mittlere Kernfähigkeit. Kosten = Strom der besetzten
   Karte (14 h) bzw. API-Token; Freiläufer werden auf der besten Hof-Karte gedacht.
   Log-Skala 0–100: Verdopplung des Verhältnisses ≈ +9 Punkte. Zucht-Ziel: gleiche Leistung,
   kleinerer Fußabdruck (Distillation/Quantisierung) ODER mehr Leistung zum gleichen Preis. */
function effizienzIndex(p){
  if(archVon(p)==="hrm") return 55;                       // Rätsel-Spezialisten: eigene Liga, fixer Richtwert
  const w=effW(p);
  const faehig=((w.wissen||0)+(w.treue||0)+(w.code||0)+(w.logik||0))/4;
  let kap, kosten;
  if(p.api){
    const m=LEIHMODELLE[p.modell]||{};
    kap=mtokTagKapazitaet(p);
    kosten=kap*(((m.inTok||2)+(m.outTok||8))/2)*0.5+1;    // €-Schätzung je Mtok-Mix
  } else {
    const g=gpuVon(p)||[...S.buchten.map(b=>GPUS[b.gpu])].sort((a,b)=>b.bw-a.bw)[0];
    if(!g) return 0;
    const hatte=p.bucht;
    if(!hatte){ const b=S.buchten.find(x=>GPUS[x.gpu]===g); if(b){ p.bucht=b.id; } }
    kap=p.bucht?mtokTagKapazitaet(p):0;
    if(!hatte) p.bucht=null;
    kosten=g.watt/1000*14*strompreis()+0.5;
  }
  const roh=kap*faehig/Math.max(0.5,kosten);
  return kl(Math.round(30*Math.log10(1+roh)),1,100);
}
function tierWert(p){
  if(p.api) return 0;
  const m=p.modell?MODELLE[p.modell]:null;
  /* Ära 7.5 (T-06): Eigenzucht ist maximal 60 % des Elternpreises wert – der Merge selbst schafft keinen Katalogwert */
  const neupreis=m?m.preis:Math.min(Math.round(300+p.pT*25),Math.round((p.elternPreis||(300+p.pT*25))*0.6));
  let v=neupreis*0.55+tierVerbesserung(p)*4+(p.adapters||[]).length*60;
  if(p.contaminated) v*=0.7;
  /* Ära 7: Der Markt zahlt für Effizienz – Faktor 0,75–1,15 um den Index 50 herum (gedeckelt,
     damit Kauf→Sofortverkauf ein Verlust bleibt; Wächter: T14) */
  v*=kl(0.75+effizienzIndex(p)/125,0.75,1.15);
  v=Math.min(v,neupreis*1.1+tierVerbesserung(p)*4);
  return Math.round(endlich(v,0)*kl(nachfrageFaktor(),0.5,1.15));   /* Ära 7.5: Nachfragewelle hebt den Verkaufswert höchstens 15 % – keine Arbitrage */
}

/* ═════════════════════════════════════════════════════════
   TEIL 6 · Level, Quests, Forschung
   ═══════════════════════════════════════════════════════ */

function hofLevel(){
  let i=0; LEVELS.forEach((x,k)=>{ if((S?.xp||0)>=x.xp) i=k; });
  const aktuell=LEVELS[i], naechst=LEVELS[i+1]||null;
  const fort=naechst?kl(((S.xp-aktuell.xp)/(naechst.xp-aktuell.xp))*100,0,100):100;
  return {i:i+1,index:i,aktuell,naechst,fort};
}
function istFrei(key){
  const l=hofLevel().index;
  for(let i=0;i<=l;i++) if((LEVELS[i].frei||[]).includes(key)) return true;
  return false;
}
function maxTier(){ for(let t=5;t>=1;t--){ if(istFrei("tier"+t)) return t; } return 0; }
function forschungFrei(key){
  if(S.forschung[key]) return true;
  if(key==="kto") return !!S.forschung.dpo;            // KTO kommt als Bonus mit der DPO-Forschung
  if(key==="spekpartner") return !!S.forschung.quant;  // Spekulatives Dekodieren kommt mit der Werkstatt
  return false;
}
function setupSlots(p){ return 2+(istFrei("slot3")?1:0)+(istFrei("slot4")?1:0); }

/* ── Meisterschaften (Fertigkeitsbäume): dritte Progressionsebene neben Stufen und Forschung ──
   Meisterpunkte: genau 1 je erreichter Hofstufe – rückwirkend aus hofLevel().i berechnet,
   dadurch automatisch migrationssicher für alte Spielstände. Jede Wirkung steht als
   skillAktiv("id") direkt in der betroffenen Formel. */
function skillDef(id){ for(const w of Object.values(SKILLS)){ const s=w.skills.find(x=>x.id===id); if(s) return s; } return null; }
function skillAktiv(id){ return !!(S&&S.skills&&S.skills[id]); }
function skillAusgegeben(){ let n=0; for(const id in (S.skills||{})){ const d=skillDef(id); if(d&&S.skills[id]) n+=d.p; } return n; }
function skillPunkteGesamt(){ return Math.max(0,hofLevel().i-1); }   /* Stufe 1 = 0 Punkte, jede weitere Stufe +1 */
function skillPunkteFrei(){ return Math.max(0,skillPunkteGesamt()-skillAusgegeben()); }
function skillKaufen(weg,id){
  S.skills=S.skills||{};
  const w=SKILLS[weg], d=skillDef(id);
  if(!w||!d||S.skills[id]||!w.skills.some(x=>x.id===id)) return;
  if(d.capstone&&S.meisterweg!==weg){ melde("Die Meister-Fertigkeit gibt es nur auf deinem gewählten Meisterweg!","schlecht"); return; }
  if(d.braucht&&!S.skills[d.braucht]){ melde("Erst „"+skillDef(d.braucht).n+"“ lernen!","schlecht"); return; }
  if(skillPunkteFrei()<d.p){ melde("Nicht genug Meisterpunkte – jede neue Hofstufe bringt einen.","schlecht"); return; }
  S.skills[id]=true;
  melde(d.z+" „"+d.n+"“ gemeistert – wirkt ab sofort: "+d.eff,"gut");
  sichern(); kopfNeu(); zeigeForschung();
}
function meisterwegWaehlen(weg){
  if(S.meisterweg||!SKILLS[weg]) return;
  if(hofLevel().i<3){ melde("Der Meisterweg öffnet ab Hofstufe 3.","schlecht"); return; }
  if(!confirm("Meisterweg „"+SKILLS[weg].n+"“ einschlagen? Die Wahl ist endgültig – nur auf diesem Weg ist später die Meister-Fertigkeit (2⭐) lernbar. Die Grundfertigkeiten aller Wege bleiben frei wählbar.")) return;
  S.meisterweg=weg;
  melde(SKILLS[weg].z+" Meisterweg „"+SKILLS[weg].n+"“ eingeschlagen!","gut");
  sichern(); zeigeForschung();

function questErfuellt(q){
  const teile=q.check.split(":");

  const zahl={
    level:()=>hofLevel().i, kredit:()=>S.kredit, ruf:()=>S.ruf,
    schweine:()=>S.tiere.filter(t=>!t.api).length,
    jobs_fertig:()=>S.statistik.jobs, forschungen:()=>Object.keys(S.forschung).length,

    kap:()=>(S.statistik.kapGesamt||0), merkmale:()=>S.tiere.filter(t=>(t.merkmale||[]).length).length, gen:()=>Math.max(0,...S.tiere.map(t=>t.gen||0))
  };
  if(zahl[k]) return zahl[k]()>=+v;
  const flags=S.flags||{};
  if(k==="kauf_modell") return flags[k]||S.tiere.some(t=>!t.api);
  if(k==="zuweisung") return flags[k]||S.tiere.some(t=>!t.api&&t.bucht);

      S.xp+=q.xp; getan=true;
    }
    while(QUESTS[S.questIdx]&&S.questsDone[QUESTS[S.questIdx].id]) S.questIdx++;
    questSperrUeberspringen();
    if(!getan) break;
  }
  questBusy=false;
  const l=hofLevel();
  if(l.i>(S.levelGemeldet||1)){
    S.levelGemeldet=l.i;
    melde("Hofstufe "+l.i+": "+l.aktuell.n+" – "+l.aktuell.hinweis,"gut");
    melde("⭐ +1 Meisterpunkt! Ausgeben in der Forschungshütte unter „Meisterschaften“.","gut");
    feier("🏅","Hofstufe "+l.i+": "+l.aktuell.n,true);
    dockNeu();
  }
  zieleNeu(); kopfNeu(); sichern();
}

   TEIL 7 · Training, Zucht, Werkstatt – Auflösung
   ═══════════════════════════════════════════════════════ */

/* Verfügbare Trainings-Rechenplätze: freie eigene Buchten + Cloud-Miete */
function trainingsVramNoetig(p,t){ return Math.max(4,Math.round(p.pT*t.vramTrainFaktor)); }
function trainingsDauer(p,t,gpu){
  const stunden=t.gpuStdProB*p.pT;
  const speed=gpu?gpu.bw/3350:1;                       // relativ zu H100
  const tage=Math.max(1,Math.ceil(stunden/(22*Math.max(0.08,speed))));
  return tage>=3&&skillAktiv("curriculum")?tage-1:tage;   /* Skill: Curriculum & LR-Schedule konvergieren schneller */
}
/* Cloud-Training ist ein KONKRETES Mehr-GPU-Profil, kein Zauberrechner (MH-006):
   8×H100 mit FSDP-Sharding – Gesamtspeicher zählt nur, weil das Verfahren ihn verteilen kann. */
const CLOUD_PROFIL={n:"Wolkenstall (8×H100, FSDP-Sharding)", geraete:8, vramJe:80, preisStdGpu:2.2};
function trainingsKosten(p,t,futterId,cloud){
  let gb=Math.max(2,Math.round(t.gbFaktor*p.pT));             // benötigte Datenmenge – bleibt im Lager erhalten! (MH-026) · v9.8: veränderlich, das Merkmal „Verfressen“ schlägt 15 % auf
  const stunden=t.gpuStdProB*p.pT;                            // GPU-Stunden gesamt
  /* Ära 7.5 (T-14/T-27): Aufbereitung hängt an der Datensorte (Rohdaten putzen ist teuer), die Laufarbeit an den GPU-Stunden – so bleibt LoRA billig, CPT auf 122B nicht */
  const aufwand={bench_leak:0.4,webmix:1.6,synth:1.4,replay:1.1}[futterId]??1.0;
  const arbeit=Math.round((gb*1.2*aufwand+12+stunden*6)*((skillAktiv("spotstrom")&&!cloud)?0.85:1));    // Datenaufbereitung + Laufbetreuung (Skill Spotmarkt: nur lokal)
  if(typeof merkmalHat==="function"&&merkmalHat(p,"verfressen")) gb=Math.round(gb*1.15*10)/10;   /* Ära 8: Verfressen braucht 15 % mehr Futter */
  const miete=cloud?Math.round(stunden*CLOUD_PROFIL.preisStdGpu*0.92*(skillAktiv("nachtschicht")?0.85:1)):0;   // GPU-Stunden × Mietpreis (Skill: Spot-Instanzen)
  const stromKwhSchaetz=cloud?0:Math.round(stunden*0.7);       // nur VORSCHAU – abgerechnet wird täglich nach echter GPU (MH-008)
  return {gb, stunden:Math.round(stunden), arbeit, miete, stromKwhSchaetz,
    strom:Math.round(stromKwhSchaetz*strompreis()), gesamt:arbeit+miete};
}

function trainingsSperre(p,technikId){
  const t=TECHNIKEN[technikId];
  if(!p) return "Dieses Tier gibt es nicht.";
  if(!t) return "Dieses Trainingsverfahren gibt es nicht.";
  if(!istFrei("gebTraining")) return "Der Trainingsplatz öffnet auf Hofstufe 2.";
  if(hofLevel().i<(t.lvl||1)) return t.n+" ist erst ab Hofstufe "+(t.lvl||1)+" verfügbar.";
  if(!forschungFrei(technikId)) return "Dafür fehlt die Forschung „"+t.n+"“.";
  if(p.api) return "Leihmodelle lassen sich auf dem Hof nicht trainieren.";
  if(p.status!=="frei") return p.name+" ist beschäftigt ("+p.status+").";
  if(archVon(p)==="hrm"&&technikId!=="grpo") return "HRM/TRM-Modelle üben hier nur mit GRPO an prüfbaren Rätseln.";
  return "";
}

function trainingStarten(p,technikId,fokus,futterId,buchtId){ if(hofZu("Training")) return;
  const t=TECHNIKEN[technikId];
  const sperre=trainingsSperre(p,technikId);
  if(sperre){ melde(sperre,"schlecht"); return false; }
  if(p.krank&&KRANKHEITEN[p.krank]&&KRANKHEITEN[p.krank].sperrtTraining){ melde("🤒 "+p.name+" ist übertrainiert – nur ein Checkpoint-Rollback stellt den alten Stand her!","schlecht"); return false; }
  const cloud=buchtId==="cloud";
  const kosten=trainingsKosten(p,t,futterId,cloud);
  const f=FUTTER[futterId];
  const lager=futterId==="synth"?(S.daten.synth||0):(S.daten[futterId]||0);
  if(lager<kosten.gb){ melde("Zu wenig "+f.n+" in der Datenbibliothek ("+lager+"/"+kosten.gb+" GB)","schlecht"); return false; }
  if(S.kredit<kosten.gesamt||!kannZahlen(kosten.gesamt)){ melde("Zu wenig Geld für dieses Training","schlecht"); return false; }
  const vramNoetig=trainingsVramNoetig(p,t);
  let bucht=null;
  if(cloud){
    /* Auch die Wolke hat Grenzen: das Sharding-Profil trägt geraete × vramJe (MH-006, T07) */
    const kap=CLOUD_PROFIL.geraete*CLOUD_PROFIL.vramJe;
    if(vramNoetig>kap){ melde("Selbst der "+CLOUD_PROFIL.n+" schafft das nicht: "+vramNoetig+" GB > "+kap+" GB. Kleineres Modell, LoRA/QLoRA oder Quantisierung wählen!","schlecht"); return false; }
  }else{
    bucht=S.buchten.find(b=>b.id===buchtId);
    if(!bucht||GPUS[bucht.gpu].vram<vramNoetig){ melde("Diese Bucht hat zu wenig Speicher für das Training ("+(bucht?GPUS[bucht.gpu].vram:0)+"/"+vramNoetig+" GB)","schlecht"); return false; }
    if(bucht.tier&&bucht.tier!==p.uid){ melde("Die Bucht ist belegt","schlecht"); return false; }
  }
  /* Ab hier ist alles geprüft → atomar buchen (MH-004). Daten werden NICHT gelöscht, nur genutzt. */
  buche(-kosten.arbeit,"training","Datenaufbereitung "+t.n+" ("+p.name+")");
  if(kosten.miete) buche(-kosten.miete,"miete","Cloud-Training "+CLOUD_PROFIL.n+" ("+p.name+")");
  if(!cloud){
    /* Reservierung: die Bucht gehört jetzt dem Training (MH-005). Zieht das Tier um, wird die alte Bucht frei. */
    if(p.bucht&&p.bucht!==bucht.id){ const alt=S.buchten.find(b=>b.id===p.bucht); if(alt&&alt.tier===p.uid) alt.tier=null; }
    bucht.tier=p.uid; p.bucht=bucht.id;
  }
  /* Ära 7.5 (R-09): Cloud-Training gibt die lokale Bucht frei – die Karte steht leer, kein Phantom-Strom; Rückkehr am Ende, wenn die Bucht noch frei ist */
  if(cloud){ const alt=buchtVon(p); if(alt&&alt.tier===p.uid) alt.tier=null; p._cloudRueckkehr=p.bucht; p.bucht=null; }
  p.status="training";
  const cloudRoh=Math.max(1,Math.ceil(kosten.stunden/(22*CLOUD_PROFIL.geraete)));
  p.rest=cloud?((cloudRoh>=3&&skillAktiv("curriculum"))?cloudRoh-1:cloudRoh):trainingsDauer(p,t,GPUS[bucht.gpu]);   /* T-15: Curriculum auch in der Wolke */
  p.training={id:technikId,fokus,futter:futterId,cloud,bucht:cloud?null:bucht.id,replay:false,lehrer:null,richter:null};
  return true;
}

/* Wiederholtes Training auf demselben Datensatz sättigt (MH-033): Zähler je Tier+Datensatz */
function datenNutzung(p,futterId){ p.datenNutzung=p.datenNutzung||{}; return p.datenNutzung[futterId]||0; }
function datenNutzungZaehle(p,futterId){ p.datenNutzung=p.datenNutzung||{}; p.datenNutzung[futterId]=(p.datenNutzung[futterId]||0)+1; return p.datenNutzung[futterId]; }
/* Domänen-Relevanz: gleiche Qualität heißt nicht gleicher Nutzen (MH-027) – Spielannahme */
const FUTTER_DOMAENE={
  fach_code:{code:1,werkzeug:0.7,std:0.35}, fach_mathe:{logik:1,code:0.6,std:0.35},
  fach_medizin:{wissen:1,std:0.3}, fach_recht:{wissen:1,treue:0.7,std:0.3},
  praef:{treue:1,schreiben:0.7,std:0.4}, verif:{treue:1,logik:0.8,std:0.4},
  beispiele:{werkzeug:0.9,schreiben:0.8,std:0.55}, kuratiert:{std:0.75},
  webmix:{std:0.5}, synth:{std:0.65}, replay:{std:0.5}, bench_leak:{std:0.9}
};
function futterRelevanz(fokus,futterId){ const m=FUTTER_DOMAENE[futterId]||{std:0.6}; return m[fokus]??m.std??0.6; }

/* Wissens-Kapazitätsdecke: SPIELANNAHME (keine wissenschaftliche Gesetzmäßigkeit!) –
   sie verdichtet nur die Idee, dass Faktenwissen mit Parametern skaliert, Denk-STIL aber destillierbar ist. */
function wissensDecke(p){ return kl(Math.round(34+p.pT*1.1),36,94); }

/* Qualität des Synthetik-Lagers: gewichteter Schnitt der Chargen (MH-030) – Herkunft bleibt je Charge erhalten */
function synthQualitaet(){
  const ch=S.synthChargen||[];
  const gb=ch.reduce((a,c)=>a+c.gb,0);
  if(!gb) return S.synthQ||0.6;
  return kl(ch.reduce((a,c)=>a+c.gb*c.q,0)/gb,0.2,0.97);
}
function synthGeneration(){ return Math.max(0,...(S.synthChargen||[]).map(c=>c.gen||1),0); }
/* Neue Synthetik-Charge mit Herkunft (MH-029/030): Menge, Qualität, Generation, Quelle bleiben nachvollziehbar */
function synthChargeDazu(gb,q,gen,quelle){
  S.synthChargen=S.synthChargen||[];
  S.synthChargen.push({gb:Math.round(gb),q:Math.round(q*100)/100,gen:gen||1,quelle:quelle||"?",tag:S.tag});
  if(S.synthChargen.length>24) S.synthChargen=S.synthChargen.slice(-20);
  S.daten.synth=(S.daten.synth||0)+Math.round(gb);
  S.synthQ=synthQualitaet();                     // Anzeige-Feld folgt jetzt dem Chargen-Schnitt statt der letzten Quelle
}

function trainingAbschliessen(p,bericht){
  const q=p.training, t=q&&TECHNIKEN[q.id];
  p.status="frei"; p.rest=0;
  if(p._cloudRueckkehr){ const b=S.buchten.find(x=>x.id===p._cloudRueckkehr); if(b&&!b.tier){ b.tier=p.uid; p.bucht=b.id; } else if(bericht) bericht.zeilen.push({t:"🏕️ "+p.name+" kommt aus der Wolke zurück – die alte Bucht ist belegt, bitte im Stall neu zuweisen.",art:"info"}); delete p._cloudRueckkehr; }
  if(!t){ p.training=null; return; }
  /* ── LoRA/QLoRA: Adapter-Pfad läuft durch DENSELBEN Abschluss inkl. Risiken (MH-034) ── */
  if(q.adapter||q.id==="lora"||q.id==="qlora"){ adapterAbschliessen(p,bericht,q,t); return; }
  const vorher={...p.w};
  const f=FUTTER[q.futter]||{q:0.6};
  let qual=q.futter==="synth"?synthQualitaet():f.q;
  qual*=futterRelevanz(q.fokus||"logik",q.futter);                       // Domänen-Passung (MH-027)
  const nutz=datenNutzungZaehle(p,q.futter);
  if(nutz>1) qual*=Math.pow(0.6,nutz-1);                                  // Wiederholung sättigt (MH-033)
  if((f.q||0.6)<0.55||q.futter==="bench_leak") p.schlechtFutterTage=skillAktiv("datenhygiene")?1:3;    // dreckiges Futter erhöht das Halluzinose-Risiko (Skill: Dedup & Filter fangen das meiste ab)
  /* Synthetik-Inzucht: zählt die HERKUNFT der Daten, nicht bloß Wiederholung */
  if(q.futter==="synth"){ p.synthGen=Math.max(p.synthGen+1,synthGeneration()); qual*=Math.pow(0.82,Math.max(0,p.synthGen-1)); }
  const streu=()=>z(0.75,1.2);
  const zeilen=[];
  if(nutz>1) zeilen.push("Wiederholtes Training auf demselben Datensatz – Nutzen sättigt ("+nutz+"×)");
  if(q.id==="distill"&&q.lehrer){
    /* Destillation: der Schüler nähert sich dem Lehrer – Stil & Denkmuster stark,
       Weltwissen nur bis zur eigenen Kapazitätsdecke (vgl. R1-Distill) */
    const lehrer=S.tiere.find(x=>x.uid===q.lehrer);
    if(lehrer){
      const kap=kl(Math.log2(Math.max(1.05,(lehrer.pT||500)/Math.max(0.1,p.pT)))/3,0.35,1);
      for(const k in WERTE){
        const ziel=lehrer.w[k];
        if(ziel<=p.w[k]) continue;
        const rate=(k==="wissen"?0.13:0.30)*qual*kap*streu();
        let neu=p.w[k]+(ziel-p.w[k])*rate;
        let hinweis="";
        if(k==="wissen"&&neu>wissensDecke(p)){ neu=Math.max(p.w[k],wissensDecke(p)); hinweis=" (Kapazitätsdecke eines "+p.pT+"B-Modells!)"; }
        const plus=neu-p.w[k];
        if(plus>=0.8){ p.w[k]=kl(neu,2,99); zeilen.push(WERTE[k]+" +"+rd(plus)+hinweis); }
      }
      if(lehrer.rz>0&&p.rz===0&&Math.random()<0.6*qual){ p.rz=1; p.denken=true; zeilen.push("Denkstil des Lehrers übernommen – Denkmodus erwacht!"); }   /* Lehr-Audit 12: Destillation von Denkspuren ist der zweite Weg zum Denkmodell */
      /* Die Lehrer-Beispiele liegen ERST JETZT vor – Generierung war echte Arbeit, kein Gratis-Nebenprodukt (MH-029) */
      const gbNeu=Math.round(6+(lehrer.pT||10)*0.15);
      const lq=kl(Object.values(effW(lehrer)).reduce((a,b)=>a+b,0)/700*0.95,0.3,0.97);
      synthChargeDazu(gbNeu,lq,(lehrer.synthGen||0)+1,"Destillation: "+lehrer.name);
      zeilen.push("+"+gbNeu+" GB Lehrer-Beispiele in der Scheune (Qualität "+rd(lq*100)+"%)");
    }
  } else {
  /* Statgewinne nach Verfahrensprofil */
  for(const k in (t.profil||{})){
    if(k==="fokus"){
      const ziel=q.fokus||"logik";
      let plus=t.profil.fokus*qual*streu();
      let hinweis="";
      if(ziel==="wissen"&&p.w.wissen+plus>wissensDecke(p)){ plus=Math.max(0,wissensDecke(p)-p.w.wissen); hinweis=" (Kapazitätsdecke!)"; }
      p.w[ziel]=kl(p.w[ziel]+plus,2,99);
      zeilen.push(WERTE[ziel]+" +"+rd(plus)+hinweis);
    }else{
      const plus=t.profil[k]*qual*streu();
      p.w[k]=kl((p.w[k]||40)+plus,2,99);
      if(Math.abs(plus)>=1) zeilen.push(WERTE[k]+" "+(plus>0?"+":"")+rd(plus));
    }
  }
  }
  /* Benchmark-Futter → Kontamination */
  if(q.futter==="bench_leak"){ p.contaminated=true; }
  /* Risiken */
  let ausgang="sauber", art="gut";
  const r=t.risiko||{};
  let vergessenP=r.vergessen||0;
  if(q.id==="cpt"&&q.replay) vergessenP=0.06;
  if(skillAktiv("replaymeister")) vergessenP*=0.5;      /* Skill: Replay-Mix gegen katastrophales Vergessen */
  if(Math.random()<vergessenP){
    const andere=Object.keys(WERTE).filter(k=>k!==q.fokus);
    const k=zufall(andere); const minus=z(6,13);
    p.w[k]=kl(p.w[k]-minus,2,99);
    ausgang="mit Vergessen bei "+WERTE[k]+" (−"+rd(minus)+")"; art="schlecht";
  }
  /* Ära 7.5 (T-03): ein guter Richter (treu, präferenztrainiert) senkt das Trickser-Risiko, ein schwacher hebt es */
  let hackP=r.hack||0;
  if(hackP>0&&q.richter){ const ri=S.tiere.find(x=>x.uid===q.richter); if(ri) hackP*=kl(1.6-effW(ri).treue/70,0.5,1.6); }
  if(hackP>0&&Math.random()<hackP){
    p.w.treue=kl(p.w.treue-10,2,99); p.contaminated=p.contaminated||Math.random()<0.4;
    ausgang="mit Belohnungs-Trickserei (Reward Hacking): Treue −10"; art="schlecht";
  }
  if((r.kollaps||0)>0&&Math.random()<(r.kollaps*(q.futter==="synth"?2:1))){
    for(const k in p.w) p.w[k]=kl(p.w[k]*0.93,2,99);
    ausgang="mit Einbruch der Vielfalt (Mode Collapse)"; art="schlecht";
  }
  /* Ära 7.5 (T-28): RLVR weckt den Denkmodus nur, wenn die Belohnung ehrlich war – wer den Test austrickst, lernt kein Denken */
  if(t.extra&&t.extra.reasoningFrei&&p.rz===0){ if(ausgang==="sauber"){ p.rz=1; p.denken=true; zeilen.push("Denkmodus erwacht!"); } else zeilen.push("kein Aha-Moment – das Modell hat den Test ausgetrickst statt zu denken"); }
  p.historie.push({tag:S.tag,n:t.n,detail:zeilen.join(", "),ausgang,delta:deltaVon(vorher,p.w)});
  p.training=null;
  S.statistik.trainings++;
  tierXp(p,40+(t.lvl||2)*8); xpDazu(20+(t.lvl||2)*6);
  questHook("training_fertig",null); questHook("training_art",q.id);
  if(q.replay) { S.replayGenutzt=true; questHook("replay_genutzt",null); }
  bericht.zeilen.push({t:p.name+": "+t.n+" abgeschlossen "+(ausgang==="sauber"?"– "+zeilen.join(", "):"– "+ausgang),art});
  bericht.zeugnisse=bericht.zeugnisse||[];
  bericht.zeugnisse.push({uid:p.uid,name:p.name,titel:t.z+" "+t.n,vorher,nachher:(typeof effW==="function")?effW(p):{...p.w},ausgang,art});   /* v9.9 (R2): das Zeugnis nennt die wirksamen Werte samt Adaptern – wie die Tierkarte */
}
function deltaVon(vorher,nachher){
  const d={};
  for(const k in WERTE){ const x=Math.round((nachher[k]||0)-(vorher[k]||0)); if(x) d[k]=x; }
  return d;
}

/* Distillation: Lehrer erzeugt zusätzlich synthetisches Futter */
/* Zucht / Merge – ein Gewichts-Merge mittelt TENSORWERTE, keine Modellgrößen (MH-036).
   Voraussetzung im Spiel: gleiche Familie, gleiche Parameterzahl, gleiche Bauform (= gleiche Tensorformen). */
function mergeKompatibel(a,b,methode){
  if(a.api||b.api) return {ok:false,warum:"API-Leihmodelle haben keine offenen Gewichte"};
  if(istNadel(a)||istNadel(b)) return {ok:false,warum:"Nadelklasse hat keine kreuzbaren Gewichte in dieser Familie"};   /* Ära 9 */
  if(archVon(a)==="hrm"||archVon(b)==="hrm") return {ok:false,warum:"HRM/TRM sind keine Sprachmodelle – nichts zu mergen"};
  if(a.fam!==b.fam) return {ok:false,warum:"verschiedene Familien (Tokenizer & Gewichtsformen passen nicht)"};
  if(archVon(a)!==archVon(b)) return {ok:false,warum:"verschiedene Bauformen ("+BAUFORMEN[archVon(a)].n.split(" ")[0]+" × "+BAUFORMEN[archVon(b)].n.split(" ")[0]+") – Gewichte haben andere Formen"};
  if(Math.abs(a.pT-b.pT)>0.01) return {ok:false,warum:"verschiedene Parameterzahlen ("+a.pT+"B × "+b.pT+"B) – Tensorformen passen nicht übereinander; Merges mitteln Werte, keine Größen"};
  /* Ära 7.5 (T-24): gleiche Größe heißt nicht gleiche Abstammung – nur Ableitungen desselben Basis-Checkpoints lassen sich sinnvoll mitteln */
  if((a.basis||a.modell)!==(b.basis||b.modell)) return {ok:false,warum:"verschiedene Basis-Checkpoints ("+a.name+" × "+b.name+") – gleiche Familie und Größe reichen nicht, es muss dasselbe Vortraining sein"};
  return {ok:true,warum:""};
}

function mergeDurchfuehren(elternIds,methodeId){
  const m=ZUCHT[methodeId];
  const eltern=elternIds.map(id=>S.tiere.find(t=>t.uid===id));
  const a=eltern[0];
  const streu=m.streu;
  const mod=(typeof zuchtModifikatoren==="function")?zuchtModifikatoren(eltern,methodeId):{emergenz:.14,interferenz:.16,templateBruch:methodeId==="slerp"?.08:0,boni:{},notizen:[]};   /* Ära 8: Verfahrensregeln, Linie, Inzucht */
  const w={};
  for(const k in WERTE){
    const werte=eltern.map(e=>e.w[k]);
    const mittel=werte.reduce((x,y)=>x+y,0)/werte.length;
    const max=Math.max(...werte);
    w[k]=kl(((methodeId==="ties"||methodeId==="dare")?(mittel*0.55+max*0.45)+z(-9,9)*streu:mittel+z(-13,13)*streu)+(mod.boni[k]||0),2,99);
  }
  let fall={n:"Sauberer Merge",art:"info",t:"Die Gewichte haben sich gut vertragen."};
  const r=Math.random();
  if(r<mod.emergenz){ const k=zufall(Object.keys(WERTE)); w[k]=kl(w[k]+z(12,22),2,99); fall={n:"Emergente Stärke",art:"gut",t:"Beim Mischen ist eine Fähigkeit aufgetaucht, die so kein Elternteil hatte: "+WERTE[k]+"."}; }
  else if(r<mod.emergenz+mod.interferenz){ const k=zufall(Object.keys(WERTE)); w[k]=kl(w[k]-z(10,20),2,99); fall={n:"Interferenz",art:"schlecht",t:"Vorzeichen-Konflikte zwischen den Deltas haben "+WERTE[k]+" beschädigt."+(mod.inzucht?" Inzucht hat das Risiko erhöht.":"")}; }
  else if(r<mod.emergenz+mod.interferenz+mod.templateBruch){ w.treue=kl(w.treue-z(8,14),2,99); fall={n:"Kaputtes Chat-Template",art:"schlecht",t:"Der Merge hat die Gesprächsformatierung beschädigt – Treue leidet."}; }
  /* Auch der Merge respektiert die Wissensdecke (Spielannahme) – Mischen erzeugt kein Zusatz-Weltwissen */
  w.wissen=Math.min(w.wissen,wissensDecke(a)+4);
  for(const k in w) w[k]=Math.round(w[k]);   /* Ära 8: Kindwerte sind ganze Zahlen wie Katalogtiere */

function mischFarbe(c1,c2){
  const g=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));
  const [r1,g1,b1]=g(c1),[r2,g2,b2]=g(c2);
  const m=(a,b)=>kl(Math.round((a+b)/2+z(-20,20)),70,240);
  const t=n=>n.toString(16).padStart(2,"0");
  return "#"+t(m(r1,r2))+t(m(g1,g2))+t(m(b1,b2));
}
/* ── Optik-Vererbung (Mendel auf lustig) ──
   Körperton und Fellzeichen werden EINZELN gewürfelt: mal von Mutter, mal von Vater,
   mal echte Mischung – so entstehen sichtbare Stammbäume auf der Wiese, ganz ohne
   neue Grafiken. Symbol-Zeichen (Kreise/Quadrate/Dreiecke) tragen eine eigene
   Symbolfarbe, die unabhängig von der Form vererbt wird: Mutter „Dreieck gelb" ×
   Vater „Quadrat blau" kann „Dreieck blau" ergeben. Seltene Mutation: HEXAGONE (~4 %). */
const SYMBOL_MUSTER=["punkte","quadrate","dreiecke","hexagone"];
const MUSTER_NAMEN={punkte:"Kreise",quadrate:"Quadrate",dreiecke:"Dreiecke",hexagone:"Hexagone",fleck:"Großfleck",band:"Rückenband"};
function optikErben(eltern){
  const ma=eltern[0], pa=eltern[eltern.length-1], saat="z"+S.zaehler;
  const kn=t=>String(t.name||"?").split(" ")[0];
  const notiz=[];
  const r=Math.random();
  let farbe;
  if(r<0.38){ farbe=tonVariante(ma.farbe,saat+"m"); notiz.push("Ton nach "+kn(ma)); }
  else if(r<0.76){ farbe=tonVariante(pa.farbe,saat+"v"); notiz.push("Ton nach "+kn(pa)); }
  else { farbe=mischFarbe(ma.farbe,pa.farbe); notiz.push("Mischton aus beiden"); }
  let muster,musterFarbe=null;
  const w=Math.random();
  if(w<0.04){ muster="hexagone"; notiz.push("✨ SELTENE MUTATION: Hexagone!"); }          // Glückstreffer
  else if(w<0.11){ muster=zufall(["punkte","quadrate","dreiecke","fleck","band"]); notiz.push("Neumutation: "+MUSTER_NAMEN[muster]); }
  else {
    const von=Math.random()<.5?ma:pa;
    muster=von.muster||null; musterFarbe=von.musterFarbe||null;
    notiz.push(muster?("Zeichen von "+kn(von)+": "+(MUSTER_NAMEN[muster]||muster)):"ohne Fellzeichen");
  }
  /* Symbolfarbe rekombiniert unabhängig von der Form: „Dreieck gelb" × „Quadrat blau"
     kann „Dreieck blau" ergeben; fehlt beiden eine, gibt's ggf. einen frischen Akzent */
  if(muster&&SYMBOL_MUSTER.includes(muster)){
    const anderes=Math.random()<.5?pa:ma, andereMF=anderes.musterFarbe||null;
    if(andereMF&&Math.random()<.5){ musterFarbe=andereMF; notiz.push("Symbolfarbe von "+kn(anderes)); }
    if(!musterFarbe&&(muster==="hexagone"||Math.random()<.45)){
      const q=hslVon(Math.random()<.5?ma.farbe:pa.farbe);
      musterFarbe=hexHsl(q.h+150+Math.random()*60,kl(q.s+0.3,0.45,0.9),kl(q.l,0.45,0.66));
      notiz.push("frischer Symbol-Akzent");
    }
  } else musterFarbe=null;
  return {farbe,muster,musterFarbe,optikNotiz:notiz.join(" · ")};
}

function tierXp(p,n){

function jobNeu(wunschTier){
  const neu=hlJobNeu(wunschTier); if(neu) return neu;
  const lvl=hofLevel().i;
  const sterne=rufSterne();
  /* Stufen-Fenster: Hofstufe öffnet, RUF verschiebt es – guter Ruf bringt größere Zettel, schlechter kleinere (N2) */
  let maxT=kl(Math.floor(lvl/2)+(sterne>=4.5?1:0),0,5);
  const minT=Math.max(0,maxT-2-(sterne>0&&sterne<2?1:0));
  let pool=JOBVORLAGEN.filter(v=>v.tier<=maxT&&v.tier>=minT);
  if(wunschTier!==undefined){ const pw=pool.filter(v=>v.tier===wunschTier); if(pw.length) pool=pw; }
  /* Vergrätzte Kunden hängen nichts auf */
  pool=pool.filter(v=>!v.kunde||!(S.kunden&&S.kunden[v.kunde]&&S.kunden[v.kunde].groll>0));
  /* Sanfter Quest-Bias (MH-055): verlangt das aktive Hofziel einen Agent-Auftrag und hängt keiner aus,
     zieht der nächste Zettel mit 50 % Chance aus den Agent-Vorlagen – erreichbar statt Würfelpech */
  const aktiveQuest=QUESTS[S.questIdx];
  if(aktiveQuest&&aktiveQuest.check==="job_agent_fertig"&&!S.jobs.some(j=>j.agent&&!S.tiere.some(t=>t.job===j.id))){
    const ag=pool.filter(v=>v.agent);
    if(ag.length&&Math.random()<0.5) pool=ag;
  }
  /* Saison färbt die Nachfrage: mit 35 % Chance kommt der Zettel aus den Saison-Branchen */
  const sb=saison(), basis=pool.length?pool:JOBVORLAGEN.filter(v=>v.tier===0);
  const saisonPool=basis.filter(x=>(sb.jobBias||[]).includes(x.art));
  const v=zufall(saisonPool.length&&Math.random()<0.35?saisonPool:basis);
  const j=JSON.parse(JSON.stringify(v));
  j.id="j"+(S.zaehler++);                                // Zähler-ID: eindeutig & reproduzierbar (Fund #12)
  j.frisch=S.tag;
  j.preisMtok=Math.round(j.preisMtok*z(0.85,1.25));
  j.mtokTag=Math.max(0.01,Math.round(j.mtokTag*z(0.8,1.3)*1000)/1000);   // Promille-genau: 0,03 Mtok darf nicht zu 0 runden (Fund #11)
  if(j.lohnBasis) j.lohnBasis=Math.round(j.lohnBasis*z(1.05,1.35)*(sterne>=(skillAktiv("stammkunden")?4:4.5)?1.1:1)*(sb.lohnF||1));   // Balance-Kur: Dorfpreise tragen den Betrieb; Stammkunden-Aufschlag ab 4,5⭐ (Skill: schon ab 4⭐) · Saison-Lohnfaktor
  j.stufe=j.tier;
  /* Ära 7.5 (W-17/W-24): auch Altvorlagen tragen Gesamtarbeit (Mtok), Auftragsgröße S/M/L und ggf. Eilauftrag */
  const G=(typeof HL_GROESSEN!=="undefined")?HL_GROESSEN:{M:{f:1,lohn:1}};
  j.groesse=zufall(["S","M","M","L"]); const gr=G[j.groesse]||G.M;
  j.eil=!j.agent&&Math.random()<0.2; j.puffer=j.eil?0:1;
  j.mtok=Math.round(((v.mtok)||j.mtokTag*j.tage)*gr.f*100)/100; j.mtokTag=Math.max(0.01,Math.round(j.mtok/j.tage*1000)/1000);
  j.einheiten=Math.max(3,Math.round((j.einheiten||j.tage*3)*gr.f));
  if(j.lohnBasis) j.lohnBasis=Math.round(j.lohnBasis*gr.lohn*(j.eil?1.35:1));
  if(j.parallel) j.nutzerMin=Math.max(2,Math.ceil(j.mtokTag/MTOK_JE_NUTZER_TAG));   // Andrang: so viele Nutzer klopfen GLEICHZEITIG an (N7)
  return (typeof zsVeredeln==="function")?zsVeredeln(j,v):j;   /* Ära 9: Zettelschmiede */
}

function marktLosNeu(){
  const lvl=hofLevel().i, mt=maxTier();
  const pool=Object.entries(MODELLE).filter(([id,m])=>m.tier<=mt&&!m.puzzle);
  if(!pool.length){ S.marktLos={tag:S.tag,angebote:[]}; S.marktStempel=Date.now(); return; }
  const angebote=[];
  const gezogen=new Set();
  let schutz=0;
  while(angebote.length<Math.min(6,pool.length)&&schutz++<40){
    const [id,m]=zufall(pool);
    if(gezogen.has(id)) continue; gezogen.add(id);
    const r=Math.random();
    if(r<0.42){
      const rabatt=Math.random()<0.5?0:zi(10,20);
      angebote.push({typ:"frisch",modell:id,preis:Math.round(m.preis*(1-rabatt/100)),rabatt});
    } else if(r<0.72){
      const fokus=zufall(["logik","code","wissen","schreiben","werkzeug","treue"]);
      const plus=zi(4,9);
      /* Aufschlag ≈ dokumentierte Trainingskosten – kein Arbitrage-Loch: der Zuwachs steht in der Historie und zählt beim Wiederverkauf */
      angebote.push({typ:"vortrainiert",modell:id,fokus,plus,preis:Math.round(m.preis+40+plus*22)});
    } else {
      const art=zufall(["code","wissen","agent"]);
      angebote.push({typ:"spezialist",modell:id,art,preis:Math.round(m.preis*1.15)});
    }
  }
  S.marktLos={tag:S.tag,angebote};
  S.marktStempel=Date.now();
}

/* Tages-Tick: kostet Betreuung + Lehrer, verbessert Werkzeug-Können mit Sättigung. Rückgabe: zusätzliche kWh (Lehrer-GPU zählt über ihre Bucht bereits mit). */
function agentenWeltTag(bericht){
  const aw=S.agentenWelt; if(!aw) return 0;
  const p=S.tiere.find(t=>t.uid===aw.schueler);
  if(!p||p.status!=="agentenwelt"){ S.agentenWelt=null; return 0; }
  const ueb=AW_UEBUNGEN[aw.uebung], h=HARNESSE[aw.geschirr]||{};
  let lehrerQ=0.7, lehrerKosten=0, lehrerName="";
  if(aw.lehrerApi){
    const m=LEIHMODELLE[aw.lehrerApi];
    lehrerKosten=Math.round(2*m.outTok*0.92);            // ~2 Mio Prüf-Token/Tag (Spielannahme)
    lehrerQ=kl(Object.values(m.w).reduce((a,b)=>a+b,0)/700,0.5,0.97);
    lehrerName=m.n;
  } else if(aw.lehrer){
    const l=S.tiere.find(t=>t.uid===aw.lehrer);
    if(l){ lehrerQ=kl(Object.values(effW(l)).reduce((a,b)=>a+b,0)/700,0.4,0.95); lehrerName=l.name;
      if(l.api){ const m=LEIHMODELLE[l.modell]; lehrerKosten=Math.round(1.5*m.outTok*0.92); } }
  }
  buche(-10,"agentenwelt","Agenten-Welt: Betreuung & Umgebung");
  if(lehrerKosten) buche(-lehrerKosten,"api","Agenten-Welt: Prüfer-Token ("+lehrerName+")");
  /* Sättigungskurve: Ziel hängt von Modellgröße, Agenten-Tool-Passung und Lehrerqualität ab (Spielannahme) */
  const ziel=kl(38+p.pT*0.9+geschirrEignung(p,aw.geschirr)*0.28+lehrerQ*14,45,93);
  const w=p.w.werkzeug||40;
  const plus=Math.max(0,Math.round((ziel-w)*0.16*lehrerQ*(skillAktiv("lehrmeister")?1.25:1)*10)/10);   /* Skill: gutes Belohnungsdesign lehrt schneller */
  if(plus>0){ p.w.werkzeug=kl(p.w.werkzeug+plus,2,99); aw.gesamt=Math.round(((aw.gesamt||0)+plus)*10)/10; }
  if(Math.random()<0.5){ p.w.treue=kl(p.w.treue+0.5,2,99); }
  aw.tage++;
  const quote=kl(Math.round(6+(p.w.werkzeug-30)*0.24),3,19);
  /* 🧪 Lehrfall-Protokoll (gekennzeichnet!): zeigt den Arbeitsverlauf, KEINE echten Modellausgaben */
  const fehlSchritt=zufall(ueb.schritte);
  aw.log.unshift({tag:S.tag,quote,plus,zeilen:[
    "Kontext: Auftragszettel + "+ueb.n+"-Arbeitsraum geladen ("+(h.n||aw.geschirr)+")",
    "Modellaufruf → Werkzeugwahl: "+ueb.schritte.join(" → "),
    "Prüfer "+lehrerName+": "+quote+"/20 Episoden korrekt (RLVR: nur prüfbar Richtiges zählt)",
    "Fehlbeispiel: bei '"+fehlSchritt+"' Format daneben → Runde wiederholt (kostet Budget)"
  ]});
  if(aw.log.length>7) aw.log=aw.log.slice(0,7);
  bericht.zeilen.push({t:"🌐 Agenten-Welt Tag "+aw.tage+": "+p.name+" schafft "+quote+"/20 Übungs-Episoden"+(plus>0?" · Werkzeug +"+plus:" · Lernkurve ist gesättigt – mehr bringt hier nichts mehr"),art:plus>0?"gut":"info"});
  questHook("agentenwelt_tag",null);
  tierXp(p,10);
  return 0;
}

let blattStack=[],blattRueckFokus=null;
function blattAuf(titel,html,id,vonZurueck){
  try{ setTimeout(blattRollhilfeStart,0); }catch(e){}
  const warOffen=schirm.classList.contains("auf");
  if(!warOffen){ const a=document.activeElement; blattRueckFokus=a&&typeof a.focus==="function"?a:null; }
  const gleich=blattStack.length&&blattStack[blattStack.length-1].id===id;
  const pos=gleich?leib.scrollTop:0;
  if(!vonZurueck){
    if(gleich) blattStack[blattStack.length-1]={id,titel,html};

    if(blattStack.length>8) blattStack.shift();

  leib.innerHTML=html;
  document.getElementById("blattzurueck").style.display=blattStack.length>1?"grid":"none";

    const fokus=Array.from(blatt.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')).find(x=>x.offsetParent!==null);

  try{ const b=document.getElementById("blatt"), l=b&&b.querySelector(".blattleib"); if(!b||!l) return;

    if(!l._rollhilfe){ l._rollhilfe=true; l.addEventListener("scroll",blattRollhilfe,{passive:true}); window.addEventListener("resize",blattRollhilfe);
      if(kn) kn.onclick=()=>{ l.scrollBy({top:Math.round(l.clientHeight*0.8),behavior:"smooth"}); setTimeout(blattRollhilfe,320); };

function blattZurueck(){
  blattStack.pop();

  if(e.key!=="Tab"||!schirm.classList.contains("auf")) return;
  const f=Array.from(blatt.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')).filter(x=>x.offsetParent!==null);
  if(!f.length){ e.preventDefault(); blatt.focus(); return; }
  const erstes=f[0],letztes=f[f.length-1],aktiv=document.activeElement;
  if(e.shiftKey&&(aktiv===erstes||!blatt.contains(aktiv))){ e.preventDefault(); letztes.focus(); }

});

  const hh=String(Math.floor(minuten/60)).padStart(2,"0"), mm=String(minuten%60).padStart(2,"0");
  const emoji=frac<0.19?"🌅":frac<0.69?"☀️":frac<0.88?"🌆":"🌙";
  el.textContent=emoji+" "+hh+":"+mm;

      const arbeit=frac*14, rest=Math.max(0,14-arbeit), phase=(typeof hlStand==="function"&&hlStand().phase!=="tag")?hlStand().phase:null;
      r.textContent=phase==="planung"?"Nachtplanung offen":phase==="laeuft"?"Nacht läuft":(frac>=1?"Feierabend – Tag beenden":rest.toFixed(1).replace(".",",")+" h Arbeit vor dir"); } }catch(e){}
}
function uhrTick(){
  if(S&&hlStand().phase!=="tag"){_uhrLetzte=Date.now();return;}
  if(!S) return;
  const jetzt=Date.now();
  const dt=Math.min(2500,jetzt-_uhrLetzte); _uhrLetzte=jetzt;
  if(document.visibilityState==="hidden") return;
  if(!S.einfFertig){ uhrAnzeige(); return; }                 // während der Einführung steht die Hofuhr
  S.tagMs=(S.tagMs||0)+dt;
  if(Math.floor(S.tagMs/60000)!==Math.floor((S.tagMs-dt)/60000)&&S.tiere.some(p=>p.status==="job")){ if(typeof hlSofortAbnahme==="function"){ try{ if(hlSofortAbnahme()&&blattStack.length&&blattStack[blattStack.length-1].id==="jobs") zeigeJobs(); }catch(e){} } schilderNeu(); }   /* Ära 7.5: Rest-Stunden am Schild + Sofort-Abnahme jede Minute */
  /* Markt-Los & Pinnwand-Tropf alle 10 min Echtzeit (N4/N2) */
  if(jetzt-(S.marktStempel||0)>=ROT_MS){
    marktLosNeu();
    melde("🛒 Neues Marktlos eingetroffen – frische Angebote im Markt!");
    if(blattStack.length&&blattStack[blattStack.length-1].id==="markt") zeigeMarkt();
  }
  S.pinnStempel=S.pinnStempel||jetzt;
  if(jetzt-S.pinnStempel>=ROT_MS){
    S.pinnStempel=jetzt;
    const offen=S.jobs.filter(j=>!S.tiere.some(p=>p.job===j.id)).length;
    if(offen<6){
      S.jobs.push(jobNeu());
      melde("📌 Ein neuer Zettel hängt an der Pinnwand");
      if(blattStack.length&&blattStack[blattStack.length-1].id==="jobs") zeigeJobs();
    }
  }
  /* Tagesende: sofort, wenn kein Blatt offen ist – sonst kurze Gnadenfrist von 2 Minuten */
  if(S.tagMs>=TAG_MS){
    const blattOffen=schirm.classList.contains("auf");
    if(!blattOffen||S.tagMs>=TAG_MS+120000){
      melde("🌙 Der Hoftag ist um – Zeit für die Abendabrechnung!","gut");
      tagBeenden();
      return;
    }
    if(!S._tagFaellig){ S._tagFaellig=true; melde("🌙 Die Sonne geht unter – der Tag endet, sobald du das Blatt schließt (spätestens in 2 Minuten).","info"); }
  }
  uhrAnzeige();
}

/* Mehrfaches Streicheln (Maus, Stift oder Touch): drei echte Bewegungsabschnitte

const _streichelSpuren=new Map();
function tierStreicheln(p,e){
  if(!p||p.api||p.status!=="frei"||!p.el) return false;
  const jetzt=e&&Number.isFinite(e.timeStamp)?e.timeStamp:performance.now(), x=e&&Number.isFinite(e.clientX)?e.clientX:null;
  let s=_streichelSpuren.get(p.uid)||{n:0,x:null,t:0,bewegung:0};
  if(jetzt-s.t>2400) s={n:0,x:null,t:jetzt,bewegung:0};
  if(x!=null&&s.x!=null&&Math.abs(x-s.x)>=12&&jetzt-s.bewegung>=70){ s.n++; s.bewegung=jetzt; }
  s.x=x; s.t=jetzt; _streichelSpuren.set(p.uid,s);
  if(s.n<3||(p._kuschelBis||0)>Date.now()) return false;
  s.n=0;
  const wackler=2+Math.floor(Math.random()*3);
  p._kuschelBis=Date.now()+wackler*340+720;
  p._liegt=Math.max(p._liegt||0,180);
  p.el.style.setProperty("--kuschel-wackler",String(wackler));
  p.el.classList.add("kuschelt","liegt","ruht");
  figurPose(p);
  return true;
}

/* ── Tiere laufen nicht DURCH Objekte (User-Wunsch): das Rechenhaus bekommt eine Fuß-Ellipse
   als zweites Hindernis und nutzt dieselbe Segment-Kollision wie der Teich. ── */
let _hausBox=null,_hausKey="";
function hausHindernis(){
  const welt=document.getElementById("welt");
  const el=document.querySelector(".rhHaus>img");
  if(!welt||!el) return null;
  const key=(welt.clientWidth|0)+"x"+(welt.clientHeight|0)+":"+((S.rechenhaus||{}).stufe||0);
  if(_hausBox&&key===_hausKey) return _hausBox;
  const wr=welt.getBoundingClientRect(), er=el.getBoundingClientRect();
  if(er.width<8||wr.width<8) return null;
  _hausKey=key;
  _hausBox={x:((er.left+er.right)/2-wr.left)/wr.width*100,
            y:(er.bottom-wr.top)/wr.height*100-1.2,
            rx:(er.width/wr.width*100)*0.44,
            ry:Math.max(4,(er.height/wr.height*100)*0.28)};   /* Ära 8: größere Fußellipse – kein Hineinlaufen in die Hausfront */
  return _hausBox;
}
/* Alle festen Wiesen-Objekte als Hindernis-Ellipsen (Haus, Windrad-Mastfüße, Solarfelder) – 1×/s gecacht */
let _hindCache=null,_hindZeit=0;
/* Ära 8: feste Sperrzone des Energieparks (rechte Seite), zusätzlich zu den vermessenen Objekten */
const SPERRZONEN=[{id:"energiepark",x:87,y:88,rx:14,ry:7}];
function hindernisListe(){
  const jetzt=performance.now();
  if(_hindCache&&jetzt-_hindZeit<1000) return _hindCache;
  _hindZeit=jetzt;
  const L=[]; const gh=hausHindernis(); if(gh) L.push(gh);
  const welt=document.getElementById("welt");
  if(document.getElementById("rechenhausWelt")) SPERRZONEN.forEach(z=>L.push({...z}));
  if(welt){
    const wr=welt.getBoundingClientRect();
    if(wr.width>8) document.querySelectorAll("#rechenhausWelt .rhWind, #rechenhausWelt .rhFelder button, #rechenhausWelt .rhNeben button").forEach(el=>{
      const er=el.getBoundingClientRect(); if(er.width<6) return;
      const wind=el.classList.contains("rhWind");
      L.push({x:((er.left+er.right)/2-wr.left)/wr.width*100,
              y:(er.bottom-wr.top)/wr.height*100-0.8,
              rx:Math.max(0.8,(er.width/wr.width*100)*(wind?0.14:0.42)),
              ry:wind?2.0:2.8});
    });
  }
  return _hindCache=L;
}
function wieseSchritt(p,nx,ny,teichG){
  for(const gh of hindernisListe()){
    const q=rhKollisionsSchritt(p.x,p.y,nx,ny,gh);
    if(q.hit){
      /* Konsistent VOM Hindernis-Zentrum weglaufen statt Achsen-Flip: der Flip ließ Tiere
         zwischen zwei Hindernissen hin- und herzittern (wirkte wie Flackern) */
      const wx=q.x-gh.x, wy=(q.y-gh.y)*1.6, wl=Math.hypot(wx,wy)||1;
      const tempo=Math.max(.045,Math.hypot(p.vx,p.vy));
      p.vx=wx/wl*tempo; p.vy=wy/wl*tempo*0.55;
    }
    nx=q.x; ny=q.y;
  }
  rhWiesenSchritt(p,nx,ny,teichG);
}
function lauf(zeit=performance.now()){
  const dt=Math.min(.05,Math.max(0,(zeit-(rhFrameZeit||zeit))/1000));rhFrameZeit=zeit;const teichG=rhTeichBoxLesen();
  const offen=schirm.classList.contains("auf")||document.getElementById("rennschirm").classList.contains("auf");
  const qArt=posenVon(tierArt());
  const liegenOk=qArt?!!qArt.lieg:true;                          // Bild-Figur ohne Liegepose legt sich nie hin
  S.tiere.forEach(p=>{
    if(!p.el) return;
    const trinkAktiv=rhTrinkFrame(p,dt,offen,teichG);
    let kuschelt=(p._kuschelBis||0)>Date.now();
    if(!kuschelt&&p._kuschelBis){ delete p._kuschelBis; p._liegt=0; p._hops=34; p.el.classList.remove("kuschelt"); figurPose(p); }
    const ruht=p.status!=="frei"||offen||trinkAktiv||kuschelt;
    /* Ruhe-Zyklen: freie Tiere legen sich gelegentlich hin und stehen wieder auf.
       Kranke und schlappe Tiere rasten früher und länger – Pflegezustand wird sichtbar. */
    if(!p.api&&liegenOk){
      if(kuschelt){ /* Pose und Stillstand werden bis zum Ende der Kuschelreaktion gehalten. */ }
      else if(ruht){ if(p._liegt>0){ p._liegt=0; figurPose(p); } }
      else{
        if(p._lz==null) p._lz=Math.round(60*z(14,45));
        if(p._liegt>0){
          if(--p._liegt<=0){ p._hops=34; p._lz=Math.round(60*z(22,55)*(p.krank?0.4:p.zustand<45?0.6:1)); figurPose(p); }
        } else if(--p._lz<=0){
          p._liegt=Math.round(60*z(6,12)*(p.krank?1.9:p.zustand<45?1.4:1)); figurPose(p);
        }
      }
    }
    if(p._hops>0) p._hops--;
    const liegt=!p.api&&(p._liegt||0)>0;
    /* (Hindernis-Helfer stehen direkt unter lauf(); Tiere prallen an Haus UND Teich ab) */
    if(!ruht&&!p.api&&!liegt){
      const s=kl(tokps(p)/50,0.3,2)*(p.zustand/100+.3);
      wieseSchritt(p,p.x+p.vx*s*dt*60,p.y+p.vy*s*.4*dt*60,teichG);
      if(p.x<8){p.x=8;p.vx=Math.abs(p.vx)}
      const xMax=document.getElementById("rechenhausWelt")?70:92;   /* Ära 8: Energiepark rechts */
      if(p.x>xMax){p.x=xMax;p.vx=-Math.abs(p.vx)}
      if(p.y<54){p.y=54;p.vy=Math.abs(p.vy)}
      if(p.y>90){p.y=90;p.vy=-Math.abs(p.vy)}
      if(Math.random()<.003*dt*60){ p.vx=(Math.random()<.5?-1:1)*z(.03,.08); p.vy=z(-.02,.02); }
    }
    if(p.api){ p.y=kl(p.y,56,70); p.x=kl(p.x,8,66); }
    else if(rhImTeich(p.x,p.y,teichG)){const q=rhAussenPunkt(p.x,p.y,teichG);p.x=q.x;p.y=q.y;}
    const basis=p.api?0.78:kl(.5+Math.sqrt(Math.min(p.pT,900))/16,.48,1.5);
    const gr=basis*(.72+(p.y-54)/36*.5);
    p.el.style.left=p.x+"%";
    p.el.style.top=p.y+"%";
    p.el.style.transform="translate(-50%,-100%) scale("+gr.toFixed(3)+")";
    p.el.style.setProperty("--ns",kl(1/gr,0.85,1.9).toFixed(2));   // Namensschild bleibt lesbar, egal wie klein das Tier
    p.el.style.zIndex=Math.round(p.y*10);
    p.el.classList.toggle("gespiegelt",p.vx<0&&!p.api);
    p.el.classList.toggle("ruht",ruht);
    p.el.classList.toggle("liegt",liegt);
    p.el.classList.toggle("stehtauf",(p._hops||0)>0);
  });
  requestAnimationFrame(lauf);
}

  if(p.contaminated) chips.push('<span class="merk schlecht" title="Benchmark-Fragen im Training – Prüfungen zählen mit Sternchen">⚠️ kontaminiert</span>');
  if((p.synthGen||0)>=2) chips.push('<span class="merk schlecht" title="Mehrere Generationen synthetisches Futter – Kollapsgefahr!">🧬 Inzucht-Stufe '+p.synthGen+'</span>');
  if(p.api) chips.push('<span class="merk dunkel">☁️ Leihmodell · '+(p.lizenzTage??7)+' Tage</span>');

}

function berate(p){
  const tipps=[];
  const w=effW(p);
  if(p.krank&&KRANKHEITEN[p.krank]){ const k=KRANKHEITEN[p.krank]; tipps.push({z:"🤒",t:k.n+" behandeln!",txt:k.heilPassivTage?"Zwei Heilwege stehen oben in der roten Karte: "+k.heilPassivTage+" Ruhetage oder '"+k.heilAktiv.n+"'.":"Hier hilft Ruhe nicht. Der aktive Heilweg oben heißt '"+k.heilAktiv.n+"'.",ak:null}); }
  if(!p.api&&!p.bucht){
    const passende=S.buchten.filter(b=>!b.tier&&passtInBucht(p,b));
    if(passende.length) tipps.push({z:"🏠",t:"Ins Gehege einziehen",txt:p.name+" steht ohne GPU auf der Wiese und kann so weder arbeiten noch trainieren.",ak:"tierZuweisen('"+p.uid+"')"});
    else tipps.push({z:"🧊",t:"Diät oder größere GPU",txt:"Braucht "+vramPig(p)+" GB Grafikspeicher – keine freie Bucht reicht. Quantisieren (Werkstatt) oder im Markt eine größere GPU kaufen.",ak:"oeffne('werkstatt')"});
  }
  if(offloaded(p)){
    const q=quantVon(p.quant);
    const naechste=QUANTS[QUANTS.findIndex(x=>x.id===p.quant)+1];
    if(naechste) tipps.push({z:"🧊",t:"Schwein quillt über!",txt:"Passt nicht ganz in seine Bucht ("+vramPig(p)+" GB) und läuft dadurch extrem langsam (RAM-Auslagerung). Eine Stufe Diät ("+naechste.n+") würde helfen.",ak:"oeffne('werkstatt')"});
  }
  if(p.rz>0&&!p.denken) tipps.push({z:"💭",t:"Denkmodus einschalten?",txt:"Hybrid-Denker: Mit Denkmodus +8 Logik und +5 Code, aber weniger als halber Durchsatz. Gut für schwere Aufträge, schlecht für Massenware.",ak:"denkenUm('"+p.uid+"')"});
  if(!p.geschirr&&istFrei("gebGeschirr")){
    const beste=Object.keys(HARNESSE).filter(h=>hofLevel().i>=HARNESSE[h].lvl&&(HARNESSE[h].basis||forschungFrei("geschirr"))).sort((a,b)=>geschirrEignung(p,b)-geschirrEignung(p,a))[0];
    if(beste&&p.tc>=1) tipps.push({z:HARNESSE[beste].z,t:"Agenten-Tool zuweisen: "+HARNESSE[beste].n,txt:"Ohne Agenten-Tool sind keine Agenten-Aufträge möglich. "+HARNESSE[beste].n+" erreicht mit der "+((FAMILIEN[p.fam]||{}).n||p.fam)+"-Familie "+rd(geschirrEignung(p,beste))+" % Eignung.",ak:"oeffne('geschirr')"});
  }
  if(p.geschirr){
    const aktuell=geschirrEignung(p,p.geschirr);
    const besser=Object.keys(HARNESSE).filter(h=>hofLevel().i>=HARNESSE[h].lvl&&geschirrEignung(p,h)>aktuell+12)[0];
    if(besser) tipps.push({z:HARNESSE[besser].z,t:"Besseres Agenten-Tool verfügbar",txt:HARNESSE[besser].n+" würde "+rd(geschirrEignung(p,besser))+"% statt "+rd(aktuell)+"% Eignung bringen – "+HARNESSE[besser].lehre,ak:"oeffne('geschirr')"});
  }
  /* Schwächste jobrelevante Fähigkeit → Trainingsvorschlag */
  if(!p.api&&istFrei("gebTraining")&&p.status==="frei"){
    const offene=S.jobs.filter(j=>!S.tiere.some(t=>t.job===j.id));
    const beduerfnisse={};
    offene.forEach(j=>{ for(const k in j.anf){ if((w[k]||0)<j.anf[k]) beduerfnisse[k]=(beduerfnisse[k]||0)+j.anf[k]-(w[k]||0); } });
    const top=Object.entries(beduerfnisse).sort((a,b)=>b[1]-a[1])[0];
    if(top){
      const technik=forschungFrei("qlora")?"QLoRA":forschungFrei("lora")?"LoRA":forschungFrei("sft")?"SFT":null;
      if(technik) tipps.push({z:"🎓",t:WERTE[top[0]]+" trainieren ("+technik+")",txt:"Offene Aufträge scheitern an "+WERTE[top[0]]+". Ein gezieltes Training auf dem Trainingsplatz würde das dauerhaft verbessern.",ak:"oeffne('training','"+p.uid+"')"});
    }
  }
  if(p.zustand<60) tipps.push({z:"🩹",t:"Auffrischen nötig",txt:"Zustand "+rd(p.zustand)+"% – alle Fähigkeiten leiden bereits spürbar (Kontext-Drift, alte Indizes).",ak:"auffrischen('"+p.uid+"')"});
  if((p.synthGen||0)>=2) tipps.push({z:"🧬",t:"Synthetik-Inzucht stoppen",txt:"Schon "+p.synthGen+" Generationen synthetisches Futter. Laut Nature-Studie (2024) verschwinden zuerst seltene Fähigkeiten, dann kollabiert die Vielfalt. Wieder echtes Futter verwenden!",ak:"oeffne('futter')"});
  return tipps.slice(0,3);
}

  blattLive("🏠 Wer zieht ein? ("+GPUS[b.gpu].n+")",()=>'<div id="ada-buchtliste" class="werteliste">'+kandidaten.map(p=>{

    return '<button class="listenzeile'+(ramOk?"":" dim")+'" onclick="inBucht(\''+p.uid+'\',\''+bid+'\')"><span class="bild">'+pigSvgVon(p)+'</span>'+
      '<span class="txt"><b>'+esc(p.name)+'</b><span>braucht '+vramPig(p)+' von '+GPUS[b.gpu].vram+' GB <small>(Gewichte '+teile.gewichte+' + Kontext-Cache '+teile.cache+' + Reserve '+teile.reserve+')</small></span>'+

  }).join("")+'</div>',"buchtwahl");

function inBucht(uid,bid){ if(typeof hofZu==="function"&&hofZu("Umstallen")) return;   /* v9.8 (R2) */
  const p=S.tiere.find(t=>t.uid===uid), b=S.buchten.find(x=>x.id===bid);
  if(!p) return;
  if(!b){ melde("Bucht „"+bid+"“ gibt es nicht – vorhanden: "+S.buchten.map(x=>x.id).join(", "),"schlecht"); return; }
  if((GPUS[b.gpu]||{}).nurNadel&&!istNadel(p)){ melde("Dieses Gerät trägt nur die Nadelklasse (≤ 0,2 B): "+GPUS[b.gpu].n+" hat keine Grafikkarte.","schlecht"); return; }   /* Ära 9 */
  /* Ära 7.5 (Spieltest): kein stummer Abbruch mehr */
  if(b.tier){ const q=S.tiere.find(t=>t.uid===b.tier); melde("Die Bucht "+b.id+" ist schon belegt"+(q?" ("+q.name+")":"")+" – erst freimachen.","schlecht"); return; }
  if(p.status!=="frei"){ melde(p.name+" ist gerade beschäftigt ("+p.status+") – umsetzen geht nur frei.","schlecht"); return; }
  if(vramTeile(p).gewichte>(b.ssdTB||4)*1000){melde("Die Modelldatei passt nicht auf die NVMe dieses Rechners.","schlecht");return;}
  /* Inferenz-Laufzeitumgebung-Regeln (Ära 7): Server-Laufzeitumgebungen kennen kein RAM-Ausweichen und kein tiefes GGUF */
  const stk=stackVon(b);
  if(stk.server&&vramPig(p)>GPUS[b.gpu].vram){ melde(stk.n+" lädt nicht: Server-Laufzeitumgebungen brauchen das GANZE Modell im VRAM ("+vramPig(p)+" GB > "+GPUS[b.gpu].vram+" GB). Kleiner quantisieren geht hier nicht unter q8 – kleineres Modell oder lokale Laufzeitumgebung wählen.","schlecht"); return; }
  if(stk.server&&quantVon(p.quant).bpw<8){ melde(stk.n+" mag kein "+p.quant+": Server-Laufzeitumgebungen fahren mit bf16/q8 (GGUF-Tiefquantisierung ist dort Experimentalfall).","schlecht"); return; }
  if(stackId(b)==="llamacpp"&&b._wechselTag===S.tag){
    melde("Purer llama.cpp: nur EIN Tierwechsel je Bucht und Tag (Lade-/Rüstzeit). Ollama oder LM Studio machen das Umsetzen frei.","schlecht");
    /* Ära 7.2: nicht nur meckern – Ada erklärt es und umrandet den Knopf, der die Hürde auflöst */
    const komfortDa=(S.stacks||{}).ollama||(S.stacks||{}).lmstudio;
    adaZeig("#stackkn-"+b.id+"-"+(komfortDa?((S.stacks||{}).ollama?"ollama":"lmstudio"):"ollama"),"hilfe_stack",()=>zeigeStall());
    return; }
  if((b.stackBereit||0)>S.tag){ melde("Diese Bucht richtet gerade ihre neue Laufzeitumgebung ein – ab morgen wieder einsatzbereit.","schlecht"); return; }
  /* RAM-Auslagerung ist ENDLICH: der Überhang muss ins Rechner-RAM passen (MH-019, T21) */
  const ueber=passtInBucht(p,b)?0:vramPig(p)-GPUS[b.gpu].vram;   /* v9.8: die Nadel passt auf den Pi ohne VRAM-Rechnung */
  if(ueber>0&&ueber>ramFrei(p,b)){
    melde("Passt nicht: "+Math.round(ueber)+" GB Überhang, aber nur "+Math.round(ramFrei(p,b))+" GB Rechner-RAM frei. Kleinere Quantisierung wählen oder andere Bucht!","schlecht");
    adaZeig(forschungFrei("quant")?"werkstatt":"forschung","hilfe_vram",null);
    return; }
  if(p.bucht){ const alt=buchtVon(p); if(alt){ alt.tier=null; alt._wechselTag=S.tag; alt._hatteTier=true; } }
  b.tier=uid; p.bucht=bid; b._wechselTag=S.tag; b._hatteTier=true;
  melde(p.name+" zieht in die "+GPUS[b.gpu].n+"-Bucht"+(passtInBucht(p,b)?"":" – "+Math.round(ueber)+" GB liegen im RAM: gleiche Gewichte, gleiches Wissen, aber zäher Trab"),passtInBucht(p,b)?"gut":"schlecht");
  questHook("zuweisung",null);
  alles(); sichern(); zeigeStall();
  if(typeof startGuideBuchtFertig==="function")startGuideBuchtFertig();
}

function denkenUm(uid){
  const p=S.tiere.find(t=>t.uid===uid);
  if(!p||p.rz!==1) return;
  p.denken=!p.denken;
  S.denkmodusGenutzt=true; questHook("denkmodus",null);
  melde(p.denken?p.name+" grunzt jetzt nachdenklich (Denkmodus an)":p.name+" antwortet jetzt direkt (Denkmodus aus)");
  sichern(); zeigeTier(uid); wieseNeu();
}
function setupUm(uid,id){
  if(id==="rag"&&!hlRagBereit()){zeigeWissenswerkstatt();return;}
  const p=S.tiere.find(t=>t.uid===uid), s=SETUPS[id];
  if(!p||!s) return;
  if(p.status!=="frei"){ melde("Gerade beschäftigt","schlecht"); return; }
  if((p.setups||[]).includes(id)){ p.setups=p.setups.filter(x=>x!==id); melde(s.n+" abgelegt"); }
  else{
    if(s.forschung&&!forschungFrei(s.forschung)){ melde("Dafür fehlt Forschung: "+s.forschung,"schlecht"); return; }
    if(hofLevel().i<(s.lvl||1)){ melde("Ab Hofstufe "+s.lvl,"schlecht"); return; }
    if((p.setups||[]).length>=setupSlots(p)){ melde("Alle Plätze für Hilfsmittel belegt","schlecht"); return; }
    if(!S["setup_"+id]){
      if(S.kredit<s.preis||!kannZahlen(s.preis)){ melde(s.n+" kostet einmalig "+geld(s.preis),"schlecht"); return; }
      buche(-s.preis,"kauf","Hilfsmittel "+s.n); S["setup_"+id]=true;
      melde(s.n+" für den Hof gekauft ("+geld(s.preis)+") – ab jetzt für alle Tiere frei");
    }
    p.setups.push(id);
    melde(s.n+" aktiviert","gut");
  }
  sichern(); zeigeTier(uid); wieseNeu();
}
function adapterAb(uid,i){
  const p=S.tiere.find(t=>t.uid===uid);
  if(!p) return;
  const a=(p.adapters||[])[i];
  if(!a){ melde("Kein Adapter an Steckplatz "+(i+1)+" – "+p.name+" trägt "+((p.adapters||[]).length)+" Adapter.","schlecht"); return; }   /* Ära 8 */
  p.adapters.splice(i,1);
  S.adapterGewechselt=true; questHook("adapter_wechsel",null);
  melde("Adapter '"+a.n+"' abgenommen – liegt jetzt im Adapterschrank (Basis: "+(a.basisName||"?")+")");
  S.adapterSchrank=S.adapterSchrank||[]; S.adapterSchrank.push(a);
  sichern(); zeigeTier(uid); wieseNeu();
}
function adapterAn(uid,i){

  if((p.adapters||[]).length>=2){ melde("Beide Steckplätze belegt","schlecht"); return; }
  /* EXAKTE Basisbindung (MH-035, T37): gleiche Modell-ID bzw. gleiches Eigenzucht-Tier.
     Alt-Adapter ohne basisId: nur exakt gleiche Familie+Größe+Bauform (Migrationsregel). */
  const passt=a.basisId?(a.basisId===p.modell)
    :a.basisUid?(a.basisUid===p.uid)
    :(a.basisFam===p.fam&&Math.abs((p.pT||0)-(a.basisPT||0))<0.01&&(!a.basisArch||a.basisArch===archVon(p)));
  if(!passt){ melde("Der Adapter passt nur auf seine exakte Basis ("+(a.basisName||"?")+") – LoRA-Matrizen sind an Revision und Tensorformen gebunden, Familienähnlichkeit genügt nicht!","schlecht"); return; }
  S.adapterSchrank.splice(i,1);
  p.adapters=p.adapters||[]; p.adapters.push(a);

}
function tempSetzen(uid,t){

}
function auffrischPreis(p){ return Math.round((100-p.zustand)*1.2+10); }   // Sitzungspflege ist Routine, kein Luxus (Balance-Kur)
function auffrischen(uid){
  const p=S.tiere.find(t=>t.uid===uid);

  if(S.kredit<preis||!kannZahlen(preis)){ melde("Zu wenig Geld","schlecht"); return; }
  buche(-preis,"pflege","Sitzungspflege "+p.name);
  p.zustand=100;
  melde(p.name+" ist wieder frisch – Sitzungen bereinigt, Index neu aufgebaut, Cache geleert. (An den Gewichten ändert das nichts!)","gut");

function verkaufen(uid){ if(typeof hofZu==="function"&&hofZu("Verkaufen")) return;   /* v9.9 (R2) */
  const p=S.tiere.find(t=>t.uid===uid);
  if(!p||p.status!=="frei"){ melde("Gerade beschäftigt","schlecht"); return; }
  if((p.reifTag||0)>S.tag){ melde("Frisch gezüchtet – der Markt nimmt "+p.name+" erst ab Tag "+p.reifTag+" ab (erst evaluieren, dann verkaufen).","schlecht"); return; }
  const wert=tierWert(p);
  const m=p.modell?MODELLE[p.modell]:null;
  const verb=tierVerbesserung(p);
  if(!confirm(p.name+" zieht als Kundenprojekt weiter für "+geld(wert)+"?\n\nSo setzt sich der Preis zusammen:\n· Einrichtung & Übergabe: "+geld(Math.round((m?m.preis:300+p.pT*25)*0.55))+"\n· Nachgewiesene Trainingszuwächse ("+verb+" Punkte): "+geld(verb*4)+"\n· Adapter: "+geld((p.adapters||[]).length*60)+"\n\n(Offene Gewichte sind kopierbar – ein UNVERÄNDERTES Modell bringt nie den Katalogpreis zurück.)")) return;
  const b=buchtVon(p); if(b) b.tier=null;
  buche(wert,"anlagenverkauf","Weitergabe "+p.name+" (Kundenprojekt)");
  S.verkauft++;
  S.tiere=S.tiere.filter(t=>t.uid!==uid);
  melde(p.name+" zieht zu neuen Besitzern – "+geld(wert),"gut");
  questHook("verkauf_modell",null);
  alles(); sichern(); zeigeStall();
}
