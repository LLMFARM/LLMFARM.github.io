<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LLM FARM</title>
<meta name="description" content="Führe deinen eigenen KI-Hof: Züchte Modelle wie Schweine, trainiere sie mit echten Verfahren, statte sie mit passenden Agenten-Tools aus und bestehe im Markt – eine lehrreiche Wirtschaftssimulation auf Basis echter Zahlen.">
<meta name="theme-color" content="#4e9c3e">
<meta property="og:title" content="LLM FARM – die KI-Wirtschaftssimulation">
<meta property="og:description" content="KI-Modelle als Schweine großziehen, mit echten Trainingsverfahren verbessern und wirtschaftlich betreiben.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐷</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --gruen-1:#8ad467; --gruen-2:#6bbd4c; --gruen-3:#4e9c3e; --gruen-4:#2f6d3a;
  --holz-1:#e0a86c; --holz-2:#c98a52; --holz-3:#8f5a30; --holz-4:#4a2c15;
  --papier:#fff6e0; --papier-2:#f3e3bd; --papier-3:#e6d0a3;
  --tinte:#3d2412; --tinte-2:#6b5238;
  --gold:#f5c451; --gold-2:#e09a2c;
  --strom:#ffc93c; --daten:#4fc8e8; --kredit:#f0a63c; --oeko:#7bc86c; --rot:#e0563f;
  --blau:#4a90d9; --lila:#9b6dd6;
  --titel:'Baloo 2','Chalkboard SE','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
  --text:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
  --rand:3px solid var(--holz-4);
  --tief:0 5px 0 rgba(74,44,21,.9);
  --sicher-o:env(safe-area-inset-top,0px);
  --sicher-u:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:var(--text);color:var(--tinte);background:#2f6d3a;
  display:flex;flex-direction:column;overflow:hidden;
  font-size:15px;line-height:1.45;
}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
h1,h2,h3,h4,.titel{font-family:var(--titel);font-weight:800;letter-spacing:.01em;line-height:1.15}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--papier-3);border-radius:8px}
small{font-size:.82em}

.holz{
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 3px,rgba(0,0,0,.05) 3px 7px),
    linear-gradient(180deg,var(--holz-1),var(--holz-2) 45%,var(--holz-3));
}
.papier{
  background:
    radial-gradient(circle at 20% 10%,rgba(255,255,255,.6),transparent 60%),
    linear-gradient(160deg,var(--papier),var(--papier-2));
}

/* ============ Ladeschirm ============ */
#boot{position:fixed;inset:0;z-index:400;background:linear-gradient(#8fd7f7,#c4ecfb 55%,#6bbd4c);
  display:grid;place-content:center;justify-items:center;gap:14px;padding:24px;text-align:center;
  transition:opacity .55s ease,visibility .55s}
#boot.weg{opacity:0;visibility:hidden}
#boot .schild{width:min(86vw,440px);padding:20px 26px;border-radius:22px;border:5px solid var(--holz-4);
  box-shadow:0 10px 0 rgba(74,44,21,.75), 0 20px 40px rgba(0,0,0,.25)}
#boot h1{font-size:clamp(32px,9vw,54px);color:#fff8e6;text-shadow:0 4px 0 var(--holz-4),0 8px 14px rgba(0,0,0,.3)}
#boot p{color:#fff3d8;font-weight:700;text-shadow:0 2px 0 rgba(74,44,21,.6);font-size:13.5px;margin-top:6px}
#boot .titelbild{width:min(86vw,440px);border-radius:18px;border:4px solid var(--holz-4);box-shadow:0 8px 0 rgba(74,44,21,.6);display:block}
#ladebalken{width:min(70vw,300px);height:22px;border-radius:12px;border:4px solid var(--holz-4);
  background:#3a2313;overflow:hidden;box-shadow:var(--tief)}
/* Der Balken wird alle 60 ms selbst weitergerechnet – eine lange CSS-Überblendung
   käme nie hinterher und der Schirm verschwände bei halb gefülltem Balken. */
#ladebalken i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#8ad467);transition:width .09s linear}
#ladetext{font-size:13px;font-weight:800;color:#3d2412}
.bootpig{width:130px;animation:huepfen 1.1s infinite ease-in-out}
@keyframes huepfen{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-16px) rotate(2deg)}}

/* ============ Kopfleiste ============ */
#kopf{position:relative;z-index:30;padding:calc(5px + var(--sicher-o)) 8px 0;
  border-bottom:4px solid var(--holz-4);box-shadow:0 5px 14px rgba(0,0,0,.28)}
.kopfreihe{display:flex;align-items:center;gap:8px}
.hofplakette{display:flex;align-items:center;gap:8px;background:var(--papier);border:var(--rand);
  border-radius:12px;padding:3px 10px;box-shadow:0 3px 0 rgba(74,44,21,.75);flex:0 0 auto;cursor:pointer}
.hofplakette .tag{font-family:var(--titel);font-size:16px;line-height:1.05}
.hofplakette .rang{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:var(--tinte-2);overflow-wrap:anywhere}
.hofplakette .uhrzeit{font-size:10.5px;font-weight:800;color:var(--tinte-2);margin-top:1px;white-space:nowrap}
/* v9.9 (Nutzerwunsch): Tagesuhr im Kopf – Balken zeigt, wie viel vom Hoftag (06–22 Uhr) vergangen ist */
#tagesuhr{flex:0 0 auto;width:clamp(150px,18vw,230px);background:var(--papier);border:var(--rand);border-radius:13px;padding:5px 8px 4px;box-shadow:0 3px 0 var(--holz-4);font-size:10.5px;color:var(--tinte-2);line-height:1.15}
#tagesuhr .tuKopf{display:flex;justify-content:space-between;gap:6px;font-weight:900;color:var(--tinte)}
#tagesuhr .tuKopf #tuRest{font-weight:700;color:var(--tinte-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tagesuhr .tuBalken{position:relative;height:12px;margin:4px 0 2px;border-radius:7px;background:linear-gradient(90deg,#c9dff0 0%,#ffe9a8 22%,#fff1c4 60%,#f7c27a 88%,#7d6aa8 100%);border:2px solid var(--holz-4);overflow:visible}
#tagesuhr .tuBalken i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px 0 0 5px;background:linear-gradient(90deg,#ffd84d,#e8873c);opacity:.85;transition:width .8s linear}
#tagesuhr .tuBalken em{position:absolute;top:-1px;bottom:-1px;width:2px;background:rgba(74,44,21,.35)}
#tagesuhr .tuBalken em.abend{background:rgba(224,90,90,.7)}
#tagesuhr .tuBalken b{position:absolute;top:-9px;left:0;font-size:15px;line-height:1;transform:translateX(-50%);filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));transition:left .8s linear}
#tagesuhr .tuSkala{display:flex;justify-content:space-between;font-size:9px;font-weight:800;letter-spacing:.02em}
@media (max-width:640px){#tagesuhr{width:120px;padding:4px 6px 3px}#tagesuhr .tuKopf #tuRest{display:none}}
#tagbalken{height:4px;border-radius:3px;background:rgba(74,44,21,.18);margin-top:3px;overflow:hidden}
#tagbalken i{display:block;height:100%;width:0%;border-radius:3px;background:linear-gradient(90deg,#ffd84d,#e8873c);transition:width .8s linear}
/* Energie-Objekt-SVGs füllen ihre vorbereiteten Halterungen */
#rechenhausWelt i>svg,.rhMiniHof i>svg,.rhEnergieKarten i>svg,.rhAussen i>svg{width:100%;height:100%;display:block}
.rhObj{width:100%;height:100%}
.rhSchild{display:none}   /* Wiesen-Plakette „Rechenhaus/Stufe" ausgeblendet (User-Wunsch) – das Gebäude bleibt klickbar */
/* Forschungsbaum & Fertigkeitsbäume (Forschungshütte) */
.baumzeile{display:flex;flex-wrap:wrap;gap:8px}
.baumkarte{flex:1 1 230px;min-width:0;display:flex;flex-direction:column;gap:4px;padding:9px 11px;border:3px solid var(--holz-4);border-radius:13px;background:#fffdf5;font-size:12px}
.baumkarte.fertig{background:#eef7e4;border-color:#5aa348}
.baumkarte.dim{opacity:.55}
.baumpfad{font-size:10.5px;font-weight:800;color:var(--tinte-2)}
.skillwege{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:start}
@media(max-width:720px){.skillwege{grid-template-columns:1fr}}
.skillkarte{display:flex;flex-direction:column;gap:4px;padding:9px 11px;margin-top:8px;border:3px solid var(--holz-4);border-radius:13px;background:#fffdf5;font-size:12px}
.skillkarte.folge{margin-left:14px;position:relative}
.skillkarte.folge::before{content:"";position:absolute;left:-11px;top:-12px;bottom:55%;width:8px;border-left:3px solid var(--holz-4);border-bottom:3px solid var(--holz-4);border-radius:0 0 0 8px}
.skillkarte.fertig{background:#eef7e4;border-color:#5aa348}
.skillkarte.dim{opacity:.6}
.skilleff{font-weight:800}
.skilllehre{font-size:10.5px;color:var(--tinte-2)}
/* Meilenstein-Feier (Ära 7): kurzer Stempel, respektiert reduzierte Bewegung */
#feier{position:fixed;inset:0;z-index:900;pointer-events:none;display:grid;place-items:center;opacity:0}
#feier.an{opacity:1}
#feier .feierstempel{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 30px;
  background:var(--papier,#fffdf5);border:5px solid var(--holz-4,#4a2c15);border-radius:22px;
  box-shadow:0 10px 34px rgba(0,0,0,.35);transform:rotate(-4deg)}
#feier .feierstempel span{font-size:52px;line-height:1}
#feier .feierstempel b{font-size:16px}
#feier.an .feierstempel{animation:feierstempel 1.9s ease-out forwards}
@keyframes feierstempel{0%{transform:rotate(-4deg) scale(2.4);opacity:0}14%{transform:rotate(-4deg) scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}
/* Auswahlkacheln der Einführung: gezeichnetes Sinnbild + Klartext statt Emoji (Ära 7.2) */
.wahlkachel{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1 1 100px;min-width:92px;
  padding:9px 6px 7px;border:3px solid var(--holz-4);border-radius:14px;background:#fff7e0;cursor:pointer;font:inherit;
  box-shadow:0 3px 0 rgba(74,44,21,.35)}
.wahlkachel b{font-family:var(--titel);font-size:12px;text-align:center;line-height:1.15}
.wahlkachel:hover{background:#ffefc2}
.wahlkachel.an{background:#e6f2d6;box-shadow:inset 0 0 0 3px rgba(87,153,63,.55),0 3px 0 rgba(74,44,21,.35)}
/* Inferenz-Laufzeitumgebung einer Bucht: im Klartext statt als Rätsel (Ära 7.2) */
.stackzeile{margin-top:6px;padding:6px 8px;border:2.5px dashed var(--holz-3,#a8845f);border-radius:11px;background:rgba(255,247,224,.55)}
.stacktitel{font-size:11px;margin-bottom:4px;line-height:1.7}
.stackhinweis{font-size:10.5px;color:var(--tinte-2);margin-top:5px;line-height:1.4}
.merk.warnrot{background:#f6d6d1;border-color:#b5544a;color:#7d2a22}
/* ── Ada: Sprechblase oben links + animierte Figur (Ära 7.2) ── */
#adaBox{position:fixed;top:74px;left:10px;z-index:350;width:min(340px,calc(100vw - 20px));
  background:var(--papier,#fffdf5);border:4px solid var(--holz-4,#4a2c15);border-radius:16px 16px 16px 4px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);padding:10px 12px 12px;display:none;font-size:13px;line-height:1.45}
#adaBox.auf{display:block;animation:adaAuf .25s ease-out}
@keyframes adaAuf{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
#adaBox::before{content:"";position:absolute;top:-14px;left:24px;border:7px solid transparent;border-bottom-color:var(--holz-4,#4a2c15)}
/* eingeklappt: nur Ada, Titel und Bedienung – die Stimme läuft weiter */
#adaBox.zu{width:auto;max-width:calc(100vw - 20px)}
#adaBox.zu #adaText,#adaBox.zu #adaExtra,#adaBox.zu .adaFuss{display:none}
#adaBox.zu .adaKopf{margin-bottom:0}
.adaKlapp{position:absolute;left:12px;bottom:-15px;height:20px;padding:0 9px;border:3px solid var(--holz-4);
  border-top:none;border-radius:0 0 11px 11px;background:var(--papier,#fffdf5);cursor:pointer;
  font:inherit;font-size:9.5px;font-weight:800;color:var(--tinte-2);line-height:15px;white-space:nowrap}
.adaKlapp:hover{background:#ffefc2;color:var(--tinte)}
/* Ada als Karte im Einführungs-Dialog: begleitet, ohne die Knöpfe zu verdecken */
.adaKarte{background:linear-gradient(#fffdf3,#fff6e0);border:3px solid var(--holz-4);border-radius:15px;padding:10px 12px}
.adaKarte .adaRund{width:52px;height:52px}
.adaKtext{font-size:13px;line-height:1.5;white-space:pre-line}
.adaKarte .adaWer b{font-size:16px}
.adaKopf{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.adaKopf .adaWer{flex:1;min-width:0}
.adaKopf b{font-family:var(--titel);font-size:15px;display:block;line-height:1.1}
.adaKopf small{font-size:10.5px;color:var(--tinte-2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adaKn{flex:0 0 auto;width:29px;height:29px;border-radius:10px;border:2.5px solid var(--holz-4);background:#fff7e0;
  cursor:pointer;font-size:13px;line-height:1;display:grid;place-items:center;padding:0}
.adaKn:hover{background:#ffefc2}
.adaKn.an{background:#e8f4d9}
/* v9.9 (Nutzerwunsch): Ada-Box verschiebbar – am Kopf ziehen, Doppelklick setzt zurück */
.adaKopf{cursor:grab;touch-action:none;user-select:none}
.adaKopf:active{cursor:grabbing}
#adaBox.zieht{transition:none!important;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#adaBox.verschoben{transition:none}
#adaText{max-height:32vh;overflow-y:auto;white-space:pre-line}
#adaExtra{margin-top:7px;border-top:2px dashed var(--holz-3,#a8845f);padding-top:7px;display:none}
#adaExtra.auf{display:block}
#adaExtra .adaChips{display:flex;flex-wrap:wrap;gap:4px;max-height:118px;overflow-y:auto;margin-top:4px}
#adaExtra .adaChips button{font:inherit;font-size:10.5px;font-weight:800;border:2px solid var(--holz-4);border-radius:9px;
  background:#fff7e0;padding:2px 7px;cursor:pointer}
#adaExtra .adaChips button:hover{background:#ffefc2}
#adaExtra input,#adaExtra select{font:inherit;font-size:12px;border:2px solid var(--holz-4);border-radius:9px;padding:4px 7px;background:#fffdf5;width:100%;box-sizing:border-box;margin-top:4px}
.adaFuss{margin-top:7px;font-size:9.5px;color:var(--tinte-2);text-align:right}
/* Ada selbst: antippen hält die Stimme an, nochmal antippen spricht weiter */
.adaSelbst{flex:0 0 auto;padding:0;border:none;background:none;cursor:pointer;line-height:0;border-radius:50%;
  position:relative;-webkit-tap-highlight-color:transparent}
.adaRund{display:block;width:48px;height:48px;border-radius:50%;overflow:hidden;background:#dcefF8;
  border:3px solid var(--holz-4);box-shadow:0 2px 0 rgba(74,44,21,.5)}
.adaSelbst:hover .adaRund{box-shadow:0 0 0 3px rgba(233,168,78,.55),0 2px 0 rgba(74,44,21,.5)}
.adaSelbst:active .adaRund{transform:translateY(1px)}
.adaSelbst::after{content:"";position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;
  border:2.5px solid var(--papier,#fffdf5);background:#8bbf62;opacity:0;transition:opacity .2s}
.adaSelbst.spricht::after{opacity:1;animation:adaTon .9s ease-in-out infinite}
@keyframes adaTon{0%,100%{transform:scale(1)}50%{transform:scale(1.28)}}
.adaFigur{display:block;width:100%;height:100%}
/* Zwinkern, Atmen, Zopfschwung – kleine Lebenszeichen, auch wenn sie schweigt */
.adaLid{transform-box:fill-box;transform-origin:center top;transform:scaleY(.02);animation:adaBlink 5.7s infinite}
@keyframes adaBlink{0%,93.4%,100%{transform:scaleY(.02)}95.4%,96.6%{transform:scaleY(1)}}
.adaZopf{transform-box:fill-box;transform-origin:top center;animation:adaZopf 3.3s ease-in-out infinite}
@keyframes adaZopf{0%,100%{transform:rotate(-2.6deg)}50%{transform:rotate(2.8deg)}}
.adaKopfG{transform-box:fill-box;transform-origin:center bottom;animation:adaAtem 4s ease-in-out infinite}
@keyframes adaAtem{0%,100%{transform:translateY(0) rotate(-.45deg)}50%{transform:translateY(-1.2px) rotate(.55deg)}}
.adaFigur.spricht .adaKopfG{animation:adaNick 1.2s ease-in-out infinite}
@keyframes adaNick{0%,100%{transform:translateY(.2px) rotate(-1.2deg)}50%{transform:translateY(-1.7px) rotate(1.3deg)}}
.adaBraue{transform-box:fill-box}
.adaFigur.spricht .adaBraue{animation:adaBraue 2.1s ease-in-out infinite}
@keyframes adaBraue{0%,100%{transform:translateY(.3px)}50%{transform:translateY(-1.2px)}}
.adaZiel{animation:adaPuls 1s ease-in-out infinite;outline:3px solid #d43b2a !important;outline-offset:2px;border-radius:12px;position:relative;z-index:5}
@keyframes adaPuls{0%,100%{box-shadow:0 0 0 0 rgba(212,59,42,.8)}50%{box-shadow:0 0 0 13px rgba(212,59,42,0)}}
#adaKnopf{position:relative;padding:0;overflow:visible;background:none;border:none}
#adaKnopf .adaRund{width:34px;height:34px;border-width:2.5px}
#adaKnopf.spricht{animation:none}
#adaKnopf.spricht .adaRund{box-shadow:0 0 0 3px rgba(139,191,98,.7),0 2px 0 rgba(74,44,21,.5)}
@media (prefers-reduced-motion:reduce){
  .adaZiel{animation:none;box-shadow:0 0 0 5px rgba(212,59,42,.55)}
  #adaBox.auf,.adaKopfG,.adaZopf,.adaFigur.spricht .adaKopfG,.adaFigur.spricht .adaBraue,.adaSelbst.spricht::after{animation:none}
}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:5px;flex:0 0 auto;background:#2f1d0e;
  border:3px solid var(--holz-4);border-radius:11px;padding:3px 9px 3px 5px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 3px 0 rgba(74,44,21,.7);cursor:pointer}
.chip svg{width:19px;height:19px;flex:0 0 19px}
.chip b{font-family:var(--titel);font-size:14.5px;color:#ffefc9;line-height:1}
.chip small{font-size:9.5px;color:#c9b189;font-weight:800;letter-spacing:.03em;display:block}
.chip.warn{animation:pochen 1.1s infinite}
@keyframes pochen{50%{background:#6b2016}}
.knopfrund{width:38px;height:36px;flex:0 0 38px;border-radius:11px;background:var(--papier);
  border:var(--rand);box-shadow:0 3px 0 rgba(74,44,21,.75);display:grid;place-items:center;font-size:17px;font-weight:900}
.knopfrund:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(74,44,21,.75)}
#ticker{margin:5px -8px 0;padding:2px 8px;background:#2f1d0e;border-top:3px solid var(--holz-4);
  overflow:hidden;white-space:nowrap;position:relative;height:22px;cursor:pointer}
#ticker span{position:absolute;left:0;top:1px;font-size:11.5px;font-weight:800;color:#ffd97a;
  white-space:nowrap;will-change:transform;transition:opacity .4s}
#ticker span.still{opacity:.5;transform:none}
@keyframes tickern{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}

/* ============ Welt ============ */
#welt{position:relative;z-index:1;isolation:isolate;flex:1;overflow:hidden;background:#6bbd4c}
#szene{position:absolute;inset:0;width:100%;height:100%;transition:filter 1s}
#welt.abend #szene{filter:saturate(.9) hue-rotate(-8deg) brightness(.92)}
.gebpunkt{position:absolute;top:2px;right:2px;width:13px;height:13px;background:var(--rot);
  border:2.5px solid var(--holz-4);border-radius:50%;z-index:2}
.gebpunkt.gruen{background:#7bc86c}
#tiere{position:absolute;inset:0}   /* Ära 8: Tiere und Energiepark teilen eine Stapelebene – Tiefe nach Fußlinie */
.pig{position:absolute;width:150px;cursor:pointer;transform-origin:50% 100%;will-change:transform}
.pig .rumpf{animation:wippen var(--takt,.6s) infinite alternate ease-in-out}
.pig.gespiegelt .rumpf{transform:scaleX(-1)}
@keyframes wippen{from{transform:translateY(1px)}to{transform:translateY(-3px)}}
.pig.gespiegelt .rumpf{animation-name:wippenL}
@keyframes wippenL{from{transform:scaleX(-1) translateY(1px)}to{transform:scaleX(-1) translateY(-3px)}}
.bein{transform-box:fill-box;transform-origin:50% 6%}
.lid{transform-box:fill-box;transform-origin:50% 50%}
.schwanzringel{transform-box:fill-box;transform-origin:100% 100%}
.pig .bein{animation:schritt var(--takt,.6s) infinite alternate ease-in-out}
.pig .bein.b,.pig .bein.c{animation-direction:alternate-reverse}

.tbLandkarte{position:relative;margin-top:11px;padding:14px;border:2px solid #8a6746;border-radius:18px;background-color:#f6e7c8;background-position:center;background-size:cover;overflow:hidden}.tbVerbindungen{position:absolute;z-index:0;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);overflow:visible}.tbVerbindungen path{fill:none;stroke-width:3;vector-effect:non-scaling-stroke;stroke-linecap:round;opacity:.65}.tbVerbindungen .forschung{stroke:#3f8fc9}.tbVerbindungen .meister{stroke:#d49019}.tbVerbindungen .mcp{stroke:#56a45b}.tbVerbindungen .rechenhaus{stroke:#a86cbb}
.tbHauptaeste{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:72px 78px}.tbGesamtAst{--zweig:#5aa348;display:flex;min-width:0;min-height:140px;flex-direction:column;padding:11px 12px 10px;border:1.5px solid color-mix(in srgb,var(--zweig),#6f5943 38%);border-top:5px solid var(--zweig);border-radius:13px;background:rgba(255,251,242,.98);box-shadow:0 3px 0 rgba(74,44,21,.16);text-align:left;transition:transform .12s,box-shadow .12s}.tbGesamtAst:hover,.tbGesamtAst:focus-visible{transform:translateY(-2px);box-shadow:0 5px 0 color-mix(in srgb,var(--zweig),transparent 68%);outline:3px solid color-mix(in srgb,var(--zweig),transparent 70%)}
.tbGesamtAst.forschung{--zweig:#3f8fc9}.tbGesamtAst.meister{--zweig:#d49019}.tbGesamtAst.mcp{--zweig:#56a45b}.tbGesamtAst.rechenhaus{--zweig:#a86cbb}.tbAstKopf{display:flex;align-items:center;gap:9px}.tbAstIcon{display:grid;place-items:center;flex:0 0 38px;height:38px;border:2px solid var(--zweig);border-radius:10px;background:color-mix(in srgb,var(--zweig),#fff 84%);font-size:21px}.tbAstKopf b,.tbAstKopf small{display:block}.tbAstKopf b{font-family:var(--titel);font-size:17px;line-height:1.1}.tbAstKopf small{margin-top:2px;color:color-mix(in srgb,var(--zweig),#4a2c15 22%);font-size:10.5px;font-weight:900}.tbAstPfeil{display:grid;place-items:center;flex:0 0 28px;height:28px;margin-left:auto;border-radius:50%;background:color-mix(in srgb,var(--zweig),#fff 82%);color:color-mix(in srgb,var(--zweig),#4a2c15 12%);font-size:17px;font-weight:950}.tbAstThemen{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}.tbAstThemen>span{padding:2px 7px;border:1px solid color-mix(in srgb,var(--zweig),#806b54 38%);border-radius:999px;background:color-mix(in srgb,var(--zweig),#fff 91%);font-size:9.5px;font-weight:850}.tbAstFuss{display:flex;align-items:center;margin-top:auto;padding-top:7px;border-top:1px solid #e1d2bd;color:#65523f;font-size:10.5px;font-weight:900}.tbAstStand{display:flex;min-width:0;align-items:center;flex-wrap:wrap;gap:2px}
.tbGesamtBalken{display:inline-block;width:58px;height:7px;margin-left:4px;border:1px solid #806344;border-radius:8px;background:#e1d1b8;vertical-align:middle;overflow:hidden}.tbGesamtBalken i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#5aa348,#9ac557)}.tbGesamtWurzel{position:absolute;z-index:2;top:50%;left:50%;display:grid;grid-template-columns:34px 1fr;align-items:center;gap:7px;width:158px;padding:9px 11px;transform:translate(-50%,-50%);border:2px solid #4f7d3b;border-radius:15px;background:#f7fced;box-shadow:0 3px 0 rgba(39,107,61,.22);text-align:left}.tbWurzelIcon{display:grid;place-items:center;grid-row:1/3;width:32px;height:32px;border-radius:9px;background:#e4efd4;font-size:20px}.tbWurzelText b,.tbWurzelText small,.tbWurzelFortschritt small{display:block}.tbWurzelText b{font-family:var(--titel);font-size:13px;line-height:1.05}.tbWurzelText small{color:#60704f;font-size:9.5px;font-weight:850}.tbWurzelFortschritt{grid-column:1/3;display:flex;align-items:center;justify-content:center;gap:5px}.tbWurzelFortschritt small{color:#6b5a48;font-size:8.5px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}.tbWurzelFortschritt .tbGesamtBalken{width:64px;height:7px;margin:0}
.tbAdaHilfe,.rhAdaHilfe{display:flex;justify-content:flex-end;margin:7px 0 9px}
@media(max-width:720px){.tbKompass,.tbVerbindungen{display:none}.tbLandkarte{display:flex;flex-direction:column;padding:10px}.tbGesamtWurzel{position:static;order:-1;width:auto;margin-bottom:10px;transform:none;grid-template-columns:34px minmax(0,1fr) auto;text-align:left}.tbWurzelIcon{grid-row:auto}.tbWurzelFortschritt{grid-column:auto;display:block;text-align:right}.tbWurzelFortschritt small{margin-bottom:2px}.tbHauptaeste{grid-template-columns:1fr;gap:9px}.tbGesamtAst{min-height:0}}
@media(max-width:480px){.tbGesamtKopf{padding:12px}.tbGesamtKopf h2{font-size:20px}.tbGesamtWurzel{grid-template-columns:34px 1fr}.tbWurzelFortschritt{grid-column:2;text-align:left}.tbWurzelFortschritt .tbGesamtBalken{width:100%}}
/* ===== v9.8 (Nutzerwunsch): sichtbare Scrollbalken in allen Fenstern =====
   Vorher rollten mehrere Flächen zwar, zeigten das aber nicht an – auf Touchgeräten
   und schmalen Fenstern wirkte der Inhalt abgeschnitten. */
.blattleib,#adaText,#adaExtra .adaChips,#rennfuss,#hsPanel,.matrixwrap,.hbInhalt,.tabellenwrap{
  scrollbar-width:thin;scrollbar-color:var(--holz-3,#a8845f) rgba(0,0,0,.06)}
.blattleib::-webkit-scrollbar,#adaText::-webkit-scrollbar,#adaExtra .adaChips::-webkit-scrollbar,
#rennfuss::-webkit-scrollbar,#hsPanel::-webkit-scrollbar,.matrixwrap::-webkit-scrollbar,
.hbInhalt::-webkit-scrollbar,.tabellenwrap::-webkit-scrollbar{width:10px;height:10px}
.blattleib::-webkit-scrollbar-thumb,#adaText::-webkit-scrollbar-thumb,#adaExtra .adaChips::-webkit-scrollbar-thumb,
#rennfuss::-webkit-scrollbar-thumb,#hsPanel::-webkit-scrollbar-thumb,.matrixwrap::-webkit-scrollbar-thumb,
.hbInhalt::-webkit-scrollbar-thumb,.tabellenwrap::-webkit-scrollbar-thumb{
  background:var(--holz-3,#a8845f);border:2px solid var(--papier,#fff7e6);border-radius:8px}
.blattleib::-webkit-scrollbar-track,#adaText::-webkit-scrollbar-track,#rennfuss::-webkit-scrollbar-track,
#hsPanel::-webkit-scrollbar-track,.matrixwrap::-webkit-scrollbar-track,
.hbInhalt::-webkit-scrollbar-track,.tabellenwrap::-webkit-scrollbar-track{background:rgba(74,44,21,.07);border-radius:8px}
/* Breite Inhalte (Tabellen, Stammbaum, Forschungsbaum) rollen in ihrem eigenen Kasten statt die Seite zu sprengen */
.blattleib table{display:block;max-width:100%;overflow-x:auto}
#hsPanel{max-height:34vh;overflow-y:auto}
/* Die Sprechblase bleibt auf kleinen Geräten in der Höhe begrenzt und rollt innen */
#adaBox{max-height:min(62vh,62dvh);overflow-y:auto}
.blattleib{padding:13px;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:grid;gap:12px;align-content:start;
  grid-auto-rows:max-content}  /* WICHTIG: sonst kollabieren Scroll-Kinder (.reiter, .matrixwrap) in Chromium auf 0 Höhe */

/* ============ Bausteine ============ */
.karte{min-width:0;border-radius:16px;border:var(--rand);padding:12px;box-shadow:0 4px 0 rgba(74,44,21,.5);background:#fffdf5}
.karte.hell{background:linear-gradient(#fffdf5,#fdf2d8)}
.karte.warnrand{border-color:#a33}
.karte h3{font-size:15.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0;overflow-wrap:anywhere}
.karte p{font-size:13.5px;margin-top:5px;overflow-wrap:anywhere}
.gitter{display:grid;gap:12px;grid-auto-rows:max-content}
@media(min-width:640px){.gitter.zwei{grid-template-columns:1fr 1fr}}
.reihe{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.abstand{margin-top:9px}
.merk{display:inline-flex;align-items:center;gap:4px;min-width:0;max-width:100%;font-size:11px;font-weight:900;
  padding:2px 8px;border-radius:20px;border:2.5px solid var(--holz-4);background:var(--papier-2);white-space:normal;overflow-wrap:anywhere}
.merk.gut{background:#c7f0b3}.merk.schlecht{background:#ffcabf}.merk.info{background:#c8e9f7}
.merk.gold{background:#ffe3a3}.merk.dunkel{background:#3d2412;color:#ffefc9;border-color:#22150a}
.merk.lila{background:#e4d4f7}
.knopf{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:0;max-width:100%;text-align:center;white-space:normal;overflow-wrap:anywhere;
  border-radius:13px;border:var(--rand);padding:9px 15px;font-weight:900;font-size:14px;
  background:linear-gradient(#ffd97a,#eb9b2d);box-shadow:0 5px 0 var(--holz-4);transition:transform .07s,box-shadow .07s}
.knopf:active{transform:translateY(3px);box-shadow:0 2px 0 var(--holz-4)}
.knopf.s{padding:6px 11px;font-size:12.5px;border-width:2.5px;box-shadow:0 4px 0 var(--holz-4)}
.knopf.hell{background:linear-gradient(#fffaea,#ecdcb4)}
.knopf.gruen{background:linear-gradient(#b7ef98,#5fb44f)}
.knopf.rot{background:linear-gradient(#ffb3a2,#d8523c);color:#fff}
.knopf.blau{background:linear-gradient(#a8d4f7,#5b9bd5)}
.knopf.aus,.knopf[disabled]{opacity:.42;filter:grayscale(.7);pointer-events:none}
.knopf.gewaehlt{background:linear-gradient(#b7ef98,#5fb44f)}

.werteliste{display:grid;gap:5px;margin-top:9px}
.wertzeile{display:grid;grid-template-columns:76px minmax(0,1fr) 56px;align-items:center;gap:8px;font-size:11.5px;font-weight:900}
.wertzeile>span:first-child{min-width:0;line-height:1.12;overflow-wrap:anywhere}
.spur{position:relative;height:13px;border-radius:8px;border:2.5px solid var(--holz-4);
  background:#e8d9b4;overflow:hidden;box-shadow:inset 0 2px 3px rgba(74,44,21,.25)}
.spur i{display:block;height:100%;background:linear-gradient(90deg,#ffd24a,#6ec95c);transition:width .45s cubic-bezier(.3,1,.4,1)}
.spur i.minus{background:linear-gradient(90deg,#ffa07a,#e0563f)}
.spur i.blau{background:linear-gradient(90deg,#7fd4f0,#4a90d9)}
.spur u{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--holz-4);opacity:.7}
.wertzeile .zahl{text-align:right;font-family:var(--titel);font-size:14px}
.wertzeile .zahl s{text-decoration:none;font-size:10px;opacity:.7}

.listenzeile{display:flex;align-items:center;gap:10px;min-width:0;padding:9px;border-radius:14px;border:var(--rand);
  background:#fffdf5;box-shadow:0 4px 0 rgba(74,44,21,.4);width:100%;text-align:left;overflow-wrap:anywhere}
.listenzeile:disabled{opacity:.45}
.listenzeile .merk{flex:0 0 auto}
.listenzeile.an{background:#e8f9dc}
.listenzeile.dim{opacity:.55}
.listenzeile .bild{flex:0 0 62px;width:62px}
.listenzeile .txt{flex:1;min-width:0}
.listenzeile .txt b{display:block;min-width:0;font-size:14px;font-family:var(--titel);overflow-wrap:anywhere}
.listenzeile .txt span{min-width:0;font-size:11.5px;color:var(--tinte-2);font-weight:700;display:block;line-height:1.35;overflow-wrap:anywhere}
.listenzeile .txt span.merk,.listenzeile .txt span.ampel,.listenzeile .txt span.stackchip{display:inline-flex;width:auto;vertical-align:middle;margin:1px 2px 1px 0}
.listenzeile .txt span.ampel{display:inline-block}
.notiz{font-size:12px;font-weight:700;border-radius:12px;padding:9px 11px;
  background:var(--papier-2);border:2.5px dashed var(--holz-3);line-height:1.45;overflow-wrap:anywhere}
.leer{text-align:center;padding:26px 12px;font-weight:700;color:var(--tinte-2)}
.kacheln{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.kachel{min-width:0;border-radius:13px;border:2.5px solid var(--holz-4);background:#fffdf5;padding:8px;text-align:center;
  box-shadow:0 3px 0 rgba(74,44,21,.4)}
.kachel b{display:block;font-family:var(--titel);font-size:18px;overflow-wrap:anywhere}
.kachel span{font-size:10.5px;font-weight:800;color:var(--tinte-2)}
.delta{font-family:var(--titel);font-size:13px;color:var(--gruen-4)}
.delta.minus{color:#b13e2d}
.xprahmen{height:12px;border:2px solid var(--holz-4);border-radius:8px;background:#e8d9b4;overflow:hidden;margin-top:4px}
.xprahmen i{display:block;height:100%;background:linear-gradient(90deg,#6bbd4c,#f5c451);transition:width .4s}
.trenner{height:3px;background:repeating-linear-gradient(90deg,var(--holz-3) 0 9px,transparent 9px 17px);border-radius:3px;opacity:.5}
.vergleich{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0 5px;font-size:11px;margin-top:6px}
.vergleich th{text-align:left;color:var(--tinte-2);font-size:9.5px;text-transform:uppercase;letter-spacing:.04em}
.vergleich td{background:#fff8e6;padding:5px 6px;border-top:2px solid var(--holz-4);border-bottom:2px solid var(--holz-4);overflow-wrap:anywhere}
.vergleich td:first-child{border-left:2px solid var(--holz-4);border-radius:9px 0 0 9px;font-weight:900}
.vergleich td:last-child{border-right:2px solid var(--holz-4);border-radius:0 9px 9px 0}
.levelstern{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:50%;border:2.5px solid var(--holz-4);background:#f5c451;font-family:var(--titel);font-size:12px}

/* Reiter */
.reiter{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;
  min-height:44px;align-items:flex-start}   /* Scroll-Container im Grid kollabieren sonst auf 0 Inhaltshöhe */
.reiter::-webkit-scrollbar{display:none}
.reiter button{flex:0 0 auto;border-radius:11px;border:2.5px solid var(--holz-4);padding:6px 12px;
  font-weight:900;font-size:12.5px;background:var(--papier-2);box-shadow:0 3px 0 rgba(74,44,21,.5)}
.reiter button.an{background:linear-gradient(#ffd97a,#eb9b2d)}
.reiter button.punkt{position:relative}
.reiter button.punkt::after{content:'';position:absolute;top:-3px;right:-3px;width:10px;height:10px;background:var(--rot);border:2px solid var(--holz-4);border-radius:50%}

/* Ampel + Eignung */
.ampel{display:inline-block;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--holz-4);vertical-align:-2px;flex:0 0 13px}
.ampel.g{background:#6ec95c}.ampel.o{background:#f5c451}.ampel.r{background:#e0563f}.ampel.x{background:#b9b2a5}
.eignung{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:900}

/* Radar */
.radarbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.radarbox svg{flex:0 0 auto}
.radarlegende{display:grid;gap:3px;font-size:11px;font-weight:800;min-width:0}
.radarlegende .rl{display:flex;align-items:center;gap:6px}
.radarlegende .rl i{width:12px;height:12px;border-radius:4px;border:2px solid var(--holz-4);flex:0 0 12px}

/* Agenten-Tool-Matrix */
.matrixwrap{overflow-x:auto;border:2.5px solid var(--holz-4);border-radius:12px;background:#fff8e6}
.matrix{border-collapse:collapse;font-size:11px;min-width:100%}
.matrix th,.matrix td{padding:5px 7px;border-bottom:2px dashed var(--papier-3);text-align:center;white-space:nowrap}
.matrix th{background:var(--papier-2);font-size:10px;position:sticky;top:0}
.matrix td:first-child,.matrix th:first-child{text-align:left;position:sticky;left:0;background:#fff8e6;font-weight:900;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.matrix .mz{display:inline-grid;place-items:center;min-width:34px;padding:2px 5px;border-radius:8px;border:2px solid var(--holz-4);font-weight:900;font-family:var(--titel);font-size:12px;cursor:pointer}
.mz.s5{background:#7ee06a}.mz.s4{background:#b7ef98}.mz.s3{background:#ffe3a3}.mz.s2{background:#ffc9a3}.mz.s1{background:#ffb3a2}.mz.s0{background:#e8e0d0;color:#9a8c72}

/* Wizard */
.wizschritte{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.wizschritt{position:relative;min-width:0;border:2.5px solid var(--holz-4);border-radius:11px;background:#ead9b4;padding:5px 4px;text-align:center;font-size:9.5px;font-weight:900;opacity:.55;overflow-wrap:anywhere}
.wizschritt.an{opacity:1;background:#ffe19a;box-shadow:0 3px 0 rgba(74,44,21,.45)}
.wizschritt.fertig{opacity:1;background:#c7f0b3}
.wizschritt b{display:block;font-family:var(--titel);font-size:13px}
.vorschau{border:2.5px solid var(--holz-4);border-radius:13px;background:#eef7ff;padding:9px 11px}
.vorschau .vzeile{display:grid;grid-template-columns:minmax(70px,auto) 1fr auto;gap:8px;align-items:center;font-size:11.5px;font-weight:900;padding:2px 0}

/* GPU-Buchten */
.buchten{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
.bucht{position:relative;border:3px solid var(--holz-4);border-radius:14px;background:linear-gradient(#f7ecd2,#eeddb4);
  padding:8px;min-height:104px;display:grid;gap:4px;align-content:start;box-shadow:0 4px 0 rgba(74,44,21,.4)}
.bucht.leer{background:repeating-linear-gradient(45deg,#f3e8cd 0 10px,#ecdfc0 10px 20px)}
.bucht h5{font-family:var(--titel);font-size:12px;display:flex;gap:5px;align-items:center;justify-content:space-between}
.bucht .vrambalken{height:10px;border:2px solid var(--holz-4);border-radius:6px;background:#e0d0a8;overflow:hidden}
.bucht .vrambalken i{display:block;height:100%;background:linear-gradient(90deg,#b6a4f0,#6f5ed0)}
.bucht .vrambalken i.voll{background:linear-gradient(90deg,#ffa07a,#e0563f)}
.bucht .insasse{display:flex;gap:6px;align-items:center;font-size:10.5px;font-weight:900;min-width:0}
.bucht .insasse .mini{width:34px;flex:0 0 34px}
.bucht .bstat{font-size:9.5px;color:var(--tinte-2);font-weight:800}

/* Empfehlungen */
.empfehlung{display:flex;gap:9px;align-items:flex-start;border:2.5px solid var(--holz-4);border-radius:13px;
  background:linear-gradient(#fffbe8,#fdf0cd);padding:9px;box-shadow:0 3px 0 rgba(74,44,21,.35)}
.empfehlung .esym{flex:0 0 34px;width:34px;height:34px;border-radius:10px;border:2.5px solid var(--holz-4);
  display:grid;place-items:center;font-size:18px;background:#fff}
.empfehlung .etxt{flex:1;min-width:0;font-size:12px;font-weight:700}
.empfehlung .etxt b{font-family:var(--titel);display:block;font-size:12.5px}

/* Tierwahl & Eigenkreatur */
.tierwahl{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.twk{position:relative;border:3px solid var(--holz-4);border-radius:14px;background:#fffdf5;padding:6px 6px 5px;
  display:grid;justify-items:center;gap:4px;cursor:pointer;box-shadow:0 3px 0 rgba(74,44,21,.4);text-align:center}
.twk img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:2px solid var(--holz-4);display:block}
.twk .twleer{width:100%;aspect-ratio:1;border-radius:10px;border:2px dashed var(--holz-3);display:grid;place-items:center;font-size:30px;background:var(--papier-2)}
.twk.an{outline:3.5px solid #4e9c3e;background:#e8f9dc}
.twk b{font-size:11.5px;line-height:1.1}
.eigenwrap{position:relative;width:86%;margin:0 auto}
.eigenwrap .ebfr{display:block;position:relative}
.eigenwrap .ebild{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:16%;border:4px solid #3d2412;background:#fff;box-shadow:0 4px 0 rgba(61,36,18,.4)}
.eigenwrap.frei .ebild{aspect-ratio:auto;object-fit:contain;border:none;background:transparent;border-radius:0;box-shadow:none}
.eigenwrap .symb{position:absolute;inset:0;background-repeat:repeat;pointer-events:none}
/* Accessoires der Bild-Figuren: sitzen AM Tier statt als Abzeichen daneben */
.eigenwrap .gemblem{position:absolute;width:15%;aspect-ratio:1;border-radius:50%;background:#fff6e0;
  border:2px solid #3d2412;display:grid;place-items:center;line-height:1;z-index:3;
  box-shadow:0 2px 0 rgba(61,36,18,.4);font-style:normal;font-weight:900}
.eigenwrap .kro{position:absolute;width:17%;z-index:4;filter:drop-shadow(0 2px 0 rgba(61,36,18,.3));overflow:visible}
.eigenwrap .sattelbild{position:absolute;z-index:3;transform-origin:50% 50%}   /* Drehpunkt = Mitte, wie im Kalibrator */
.eigenwrap .apin{position:absolute;width:6.5%;aspect-ratio:.74;border-radius:24%;border:2px solid #3d2412;
  z-index:3;transform:rotate(-13deg);box-shadow:0 2px 0 rgba(61,36,18,.35)}
.eigenwrap .apin::after{content:'';position:absolute;left:50%;top:26%;width:32%;aspect-ratio:1;
  transform:translateX(-50%);background:#fff;border-radius:50%}
.eigenwrap .dbl{position:absolute;padding:3% 4.5%;background:#fff;border:2px solid #3d2412;border-radius:999px;
  z-index:4;font-weight:900;line-height:1;letter-spacing:.06em;opacity:.85;animation:denkpuls 2.2s infinite}
.eigenwrap .dbl.gross{opacity:1}
.eigenwrap .dbl::after{content:'';position:absolute;left:12%;bottom:-30%;width:16%;aspect-ratio:1;
  background:#fff;border:2px solid #3d2412;border-radius:50%}
/* Wiesen-Ambiente (Denkblase, Adapter-Pins, Emblem-Buchstabe, API-Wolke) NUR auf der Wiese:
   in Fenstern und Mini-Icons kollabieren ihre Mindestgrößen (7-px-Schrift, 2-px-Rand)
   zu weißen Klötzen, die die Figur verdecken */
#blattleib .dbl,#bahnen .dbl,.bild .dbl,.bild .apin,.bild .gemblem,.bild .ewolke{display:none}
.eigenwrap.eflip .ebfr{transform:scaleX(-1)}
/* Posen-Frames: Stehen traegt die Hoehe, Laufen/Liegen liegen fussbuendig darueber */
/* KEINE opacity-Transition zwischen Posen-Frames: seit dem gemessenen Größenausgleich (sk)
   sind die Frames unterschiedlich groß – eine Überblendung zeigt 0,3 s lang BEIDE Posen
   übereinander (Geisterbild, Fellmuster ragen über die Silhouette). Harter Schnitt wie beim
   steps(1)-Laufzyklus. */
.eigenwrap .ebfr.lauf,.eigenwrap .ebfr.lieg{position:absolute;left:0;bottom:0;width:100%;opacity:0}
.eigenwrap .ebfr.steh{}
/* 2-Frame-Laufzyklus im Beintakt (nur auf der Wiese aktiv) */
.pig .eigenwrap.hatlauf .ebfr.steh{animation:eStand var(--takt,.6s) steps(1) infinite}
.pig .eigenwrap.hatlauf .ebfr.lauf{animation:eSchritt var(--takt,.6s) steps(1) infinite}
@keyframes eStand{0%,100%{opacity:1}50%{opacity:0}}
@keyframes eSchritt{0%,100%{opacity:0}50%{opacity:1}}
/* Stillstand (Job/Training/Blatt offen) und Wolkentiere: Standbild */
.pig.ruht .eigenwrap .ebfr.steh,.pig.wolkig .eigenwrap .ebfr.steh{animation:none;opacity:1}
.pig.ruht .eigenwrap .ebfr.lauf,.pig.wolkig .eigenwrap .ebfr.lauf{animation:none;opacity:0}
/* Hinlegen: Augen zu (Lid wie beim Blinzeln voll ausgefahren), Wippen aus,
   Schwanz wedelt gemuetlich langsam weiter – gilt fuer ALLE Arten */
.pig.liegt .lid{animation:none;transform:scaleY(1)}
.pig.liegt .schwanzringel{animation-duration:3.2s}
.pig.liegt .eigenwrap .ebfr.steh,.pig.liegt .eigenwrap .ebfr.lauf{animation:none;opacity:0}
.pig.liegt .eigenwrap .ebfr.lieg{opacity:1}
.pig.liegt .rumpf{animation:none}
.pig.liegt .eigenwrap .eschatten{left:2%;right:2%;height:7%}
/* Aufstehen: kleiner Hops, einmalig */
.pig.stehtauf .rumpf{animation:aufsteh .55s ease-out}
.pig.stehtauf.gespiegelt .rumpf{animation-name:aufstehL}
@keyframes aufsteh{0%{transform:translateY(5px) scale(1,.92)}55%{transform:translateY(-7px)}100%{transform:translateY(0)}}
@keyframes aufstehL{0%{transform:scaleX(-1) translateY(5px) scale(1,.92)}55%{transform:scaleX(-1) translateY(-7px)}100%{transform:scaleX(-1) translateY(0)}}
/* Werkstatt-Vorschau: laeuft auf der Stelle */
.egvorschau{position:relative;width:110px;flex:0 0 auto}

.egvorschau.egwalk .ebild.lauf{animation:eSchritt .52s steps(1) infinite}
.egvorschau.eflip .ebild{transform:scaleX(-1)}

/* Wissens-Karten */
.wissen{border-left:6px solid var(--daten);background:#f0f9ff;border-radius:0 12px 12px 0;

/* ── Farbsystem: EIN Ton je Tier, alles Weitere leitet sich daraus ab ──
   Grundton = Familienfarbe, je Tier deterministisch leicht variiert (Saat = uid).
   Die Zucht mischt die ECHTEN Elterntöne (mischFarbe) – Abstammung bleibt sichtbar,
   ohne dass je Variante neue Grafiken oder KI-Bilder erzeugt werden müssen:
   prozedurale Tiere füllen direkt mit p.farbe, die Eigenkreatur dreht ihr EINES
   Posen-Set stetig über denselben Ton (farbFilter). */
function hslVon(hex){
  const r=parseInt(hex.substr(1,2),16)/255,g=parseInt(hex.substr(3,2),16)/255,b=parseInt(hex.substr(5,2),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
  if(mx!==mn){const d2=mx-mn;s=l>0.5?d2/(2-mx-mn):d2/(mx+mn);
    h=(mx===r?((g-b)/d2+(g<b?6:0)):mx===g?((b-r)/d2+2):((r-g)/d2+4))*60;}
  return {h,s,l};
}
function hexHsl(h,s,l){
  h=((h%360)+360)%360;s=kl(s,0,1);l=kl(l,0,1);
  const f=n=>{const k=(n+h/30)%12,a=s*Math.min(l,1-l);
    return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))));};
  const t=n=>n.toString(16).padStart(2,"0");
  return "#"+t(f(0))+t(f(8))+t(f(4));
}
function tonVariante(hex,saat){
  let s=7; String(saat).split("").forEach(ch=>{s=(s*131+ch.charCodeAt(0))>>>0;});
  /* Avalanche-Mischung: auch benachbarte Saaten (t2/t3) streuen voll */
  s=Math.imul(s^(s>>>15),2654435761)>>>0; s=(s^(s>>>13))>>>0;
  const r1=(s%997)/997, r2=((s>>>8)%991)/991, r3=((s>>>16)%983)/983;
  const t=hslVon(hex||"#f0a878");
  return hexHsl(t.h+(r1*26-13), t.s*(0.88+r2*0.24), kl(t.l+(r3*0.12-0.06),0.3,0.82));
}
/* Start-Optik beim Einzug: meist das klassische Familienzeichen, aber gut ein Drittel
   bringt ein eigenes BUNTES Symbol-Gen mit (Kreise/Quadrate/Dreiecke in Akzentfarbe) –
   so tragen Eltern von Anfang an verschiedene Gene, deren Mischung man bei der Zucht
   wirklich SIEHT. Hexagone gibt es NUR als seltene Zucht-Mutation. Deterministisch je uid. */
function optikStart(fam,uid){
  let s=7; String(uid).split("").forEach(ch=>{s=(s*131+ch.charCodeAt(0))>>>0;});
  s=Math.imul(s^(s>>>15),2654435761)>>>0; s=(s^(s>>>13))>>>0;
  const w=(s%1000)/1000;
  if(w<0.55) return {muster:fam.muster||null,musterFarbe:null};
  if(w<0.85){
    const form=["punkte","quadrate","dreiecke"][(s>>>4)%3];
    const q=hslVon(fam.farbe||"#f0a878");
    return {muster:form,musterFarbe:hexHsl(q.h+140+((s>>>8)%80),kl(q.s+0.3,0.5,0.9),kl(q.l,0.45,0.66))};
  }
  return {muster:null,musterFarbe:null};
}
/* Stetige Ton-Abbildung für Bild-Figuren: gemischte Elterntöne ergeben gemischte
   Filter. ref = Eigen-Farbton des Bildes (gemessen), Standard 24° (#f0a878). */
function farbFilter(farbe,quant,o={}){
  const q=quant||0, ref=o.ref!=null?o.ref:24;
  let kette="";
  if(farbe){
    const t=hslVon(farbe);
    let d=((t.h-ref)%360+360)%360; if(d>180)d-=360;          // kürzester Winkel
    const blass=(o.satt!=null&&o.satt<0.16);                 // fast farbloses Bild (weißes Lama …)
    if(blass) kette+="sepia(.38) saturate(2.1) ";            // erst pastellig einfärbbar machen
    kette+="hue-rotate("+Math.round(d)+"deg) ";              // VOLLER Familienton bei allen Arten (wie beim Lama); die dunkle Umrahmung bleibt dunkel
    kette+="brightness("+(1+kl((t.l-0.6)*0.4,-0.09,0.09)).toFixed(3)+") ";
    if(!blass) kette+="saturate("+(0.9+kl(t.s-0.5,-0.25,0.35)*0.5).toFixed(2)+") ";
  }
  if(q>0) kette+="saturate("+(1-q*0.07).toFixed(2)+") brightness("+(1+q*0.015).toFixed(2)+")";
  return kette?("filter:"+kette.trim()+";"):"";
}

/* Masken-Klassen einmalig erzeugen: Symbol-Overlays werden mit der Posen-Silhouette
   maskiert, damit Kreise/Quadrate/Dreiecke wirklich AUF dem Fell sitzen. */
function maskenCss(){
  let css="";
  /* Maske = Silhouette ∩ Verlauf: die Zeichen bleiben auf dem Rumpf und laufen
     NIE über Gesicht/Augen (Kopf liegt in Blickrichtung rechts) */
  const grad="linear-gradient(90deg,#000 52%,rgba(0,0,0,.35) 66%,transparent 78%)";
  const mk=(name,url)=>css+='.symb-'+name+'{-webkit-mask-image:url("'+url+'"),'+grad+';-webkit-mask-size:100% 100%,100% 100%;-webkit-mask-composite:source-in;'+
    'mask-image:url("'+url+'"),'+grad+';mask-size:100% 100%,100% 100%;mask-composite:intersect}';
  Object.entries(TIER_POSEN).forEach(([art,m])=>["steh","lauf","lieg","trink"].forEach(p=>{
    if(typeof ASSETS!=="undefined"&&ASSETS[m[p]]) mk(art+"-"+p,ASSETS[m[p]]);
  }));
  const e=posenVon("eigen");
  if(e){ mk("eigen-steh",e.steh); if(e.lauf)mk("eigen-lauf",e.lauf); if(e.lieg)mk("eigen-lieg",e.lieg); }
  let tag=document.getElementById("maskenstil");
  if(!tag){ tag=document.createElement("style"); tag.id="maskenstil"; document.head.appendChild(tag); }
  tag.textContent=css;
}

/* Aquarell-Sattel: eingebettetes Sticker-Bild (Basisleder Hue ≈ 22°), per hue-rotate in

   Sattelblatt. Form je Agenten-Tool: klassik (Westernsattel mit Steigbügel) · decke
   (gewebte Satteldecke) · renn (flaches Sportblatt). */
/* asp = Bildhöhe/Bildbreite des Sticker · auflage = wo im Sattelbild die Rückenlinie
   liegt (Anteil der Höhe): Sitz DRÜBER, Blatt/Steigbügel hängen seitlich am Körper */
const SATTEL_MASSE={klassik:{w:27,asp:1.14,auflage:.31,ey:.52},decke:{w:33,asp:0.70,auflage:.24,ey:.46},renn:{w:24,asp:1.11,auflage:.28,ey:.48}};
/* r = Bildbreite/Bildhöhe der Pose: rechnet die Sattelhöhe (Breiten-%) exakt in
   top-Versätze (Höhen-%) um – ohne das driftet die Auflage je nach Bildformat. */
function sattelBild(stil,cx,sy,rot,z,fs,wOverride,r){
  const key="sattel_"+(stil.form||"klassik");
  if(typeof ASSETS==="undefined"||!ASSETS[key]) return "";
  const t=hslVon(stil.f);
  let d=((t.h-22)%360+360)%360; if(d>180)d-=360;
  const filt="hue-rotate("+Math.round(d)+"deg) saturate("+(0.85+kl(t.s-0.45,-0.2,0.4)*0.7).toFixed(2)+") brightness("+(1+kl((t.l-0.5)*0.5,-0.12,0.16)).toFixed(3)+")";
  const m=SATTEL_MASSE[stil.form]||SATTEL_MASSE.klassik;
  const w=wOverride||m.w, hH=w*m.asp*(r||1), top=sy-hH*m.auflage;
  return '<img class="sattelbild" src="'+ASSETS[key]+'" alt="" draggable="false" style="left:'+(cx-w/2).toFixed(1)+'%;top:'+top.toFixed(1)+'%;width:'+w+'%;transform:rotate('+rot+'deg) scaleX(-1);filter:'+filt+' drop-shadow(0 3px 2px rgba(61,36,18,.3))">'+
    '<b class="gemblem" style="left:'+(cx-5.5).toFixed(1)+'%;top:'+(top+hH*m.ey).toFixed(1)+'%;font-size:'+fs+'px;transform:rotate('+rot+'deg)">'+z+'</b>';

function krankRisiken(p){
  if(p.api||archVon(p)==="hrm"||p.krank||S.tag<3) return [];   /* Ära 7.5: die ersten zwei Hoftage bleiben gesund – Ursachen brauchen Zeit */
  const r=krankRisikenRoh(p);
  if(typeof merkmalHat==="function"&&merkmalHat(p,"robust")) r.forEach(x=>{ x.p=Math.round(x.p*0.7*1000)/1000; x.warum=(x.warum||[]).concat(["🛡️ Robust: Risiko −30 %"]); });   /* Ära 8 */
  return r;
}
function krankRisikenRoh(p){
  const r=[];
  const j=p.status==="job"?S.jobs.find(x=>x.id===p.job):null;
  /* Kontextrot: Langkontext-Dauerbetrieb ohne Gedächtnispflege (Ära 7.5 T-10: 5 % je Tag statt 12 %) */
  if((p.ctxLastTage||0)>=2&&!p.setups.includes("memory")&&!forschungFrei("secondbrain"))
    r.push({id:"kontextrot",p:0.05*Math.min(3,p.ctxLastTage)*(p.zustand<60?1.5:1),warum:"Langkontext-Dauerbetrieb ("+p.ctxLastTage+" Tage) ohne Memory-Baustein"});
  /* Halluzinose */
  let h=0; const hw=[];
  const samplerFrei=S.mini&&S.mini.samplerFreiTag===S.tag;   /* Ära 7.5: Sampler-Duell gewonnen → heute ohne Temperatur-Risiko */
  if((p.schlechtFutterTage||0)>0){ h+=0.14; hw.push("dreckiges Futter im letzten Training"); }
  if(p.temp==="kreativ"&&!samplerFrei){ h+=quirkHat(p,"hitzeempfindlich")?0.10:0.04; hw.push("heiße Sampler-Einstellung"+(quirkHat(p,"hitzeempfindlich")?" (dokumentiert empfindliche Familie)":"")); }   /* T-17 */
  if(quirkHat(p,"wissensluecke")&&p.status==="job"){ h+=0.02; hw.push("dokumentierte Faktenschwäche der Familie"); }   /* T-16, Ära 7.5: nur im Einsatz, mild */
  if(j&&j.team&&(hlTeamCheck(j,j.team.wahl).roh||1)<0.6){ h+=0.08; hw.push("chronische Überlastung im Auftrag"); }   // Überlastung: Team schafft < 60 % des Tagessolls
  if(p.setups.includes("rag")||p.setups.includes("verifier")) h*=0.5;
  if(h>0) r.push({id:"halluzinose",p:h,warum:hw.join(", ")});
  /* Übertraining – nur ECHTE Läufe zählen (Ära 7.5 T-02), Rate skaliert mit der Dichte (T-11) */
  const LAUF=x=>x.delta&&(Object.keys(x.delta).length||/Adapter erzeugt/.test(x.detail||""))&&x.n!=="Checkpoint-Rollback"&&!x.kur;
  const letzte3=(p.historie||[]).filter(x=>LAUF(x)&&S.tag-x.tag<=3).length;
  let u=0;
  if((p.uebertrainKarenz||0)<=S.tag){
    if(letzte3>=2) u+=0.10*(letzte3-1);
    if((p.historie||[]).some(x=>LAUF(x)&&x.tag===S.tag-1)&&p.zustand<55) u+=0.2;
  }
  if(skillAktiv("fruehstopp")) u*=0.5;                  /* Skill: Early Stopping auf dem Validierungsverlust */
  if(u>0) r.push({id:"uebertrainiert",p:u,warum:letzte3+" Trainingsläufe in 3 Tagen"+(p.zustand<55?", schlechter Zustand":"")});
  /* Schleifenfieber */
  let s=0;
  if(p.temp==="praezise"&&!samplerFrei&&quirkHat(p,"repetitionsrisiko")&&(p.kaltTage||0)>=2) s+=0.25;
  if((p.synthGen||0)>=3) s+=0.15;
  if(s>0) r.push({id:"schleifenfieber",p:s,warum:(p.temp==="praezise"?"zu kalte Einstellung bei empfindlicher Familie":"")+((p.synthGen||0)>=3?" Synthetik-Inzucht":"")});
  return r;
}
function krankAusbruch(p,id,bericht){
  p.krank=id; p.krankSeit=S.tag; p.ruheTage=0;
  const k=KRANKHEITEN[id];
  bericht.zeilen.push({t:"🤒 "+p.name+" hat "+k.n+"! Ursache: "+k.ursache+". (Schweinekarte zeigt die Heilwege)",art:"schlecht"});
  melde("🤒 "+p.name+" ist krank: "+k.n,"schlecht");
}
function kurieren(uid){
  const p=S.tiere.find(t=>t.uid===uid);
  if(!p||!p.krank) return;
  const k=KRANKHEITEN[p.krank], h=k.heilAktiv;
  const rollbackLauf=h.rollback?[...(p.historie||[])].reverse().find(x=>
    ((x.delta&&Object.keys(x.delta).length)||(x.detail&&x.detail.startsWith("Adapter erzeugt")))
    &&x.n!=="Checkpoint-Rollback"&&!x._zurueckgerollt):null;
  if(h.rollback&&!rollbackLauf){ melde("Kein nutzbarer Trainings-Checkpoint vorhanden – der Schaden lässt sich nicht nur gegen Geld wegklicken. Erst einen gesicherten Lauf wiederherstellen oder einen älteren Spielstand laden.","schlecht"); return; }
  if(S.kredit<h.kosten||!kannZahlen(h.kosten)){ melde("Dafür fehlen "+geld(h.kosten),"schlecht"); return; }
  if(h.futter){ for(const f in h.futter){ if((S.daten[f]||0)<h.futter[f]){ melde("Dafür fehlen "+h.futter[f]+" GB "+(FUTTER[f]||{}).n,"schlecht"); return; } } }
  buche(-h.kosten,"pflege",h.n+" ("+p.name+")");
  if(h.futter) for(const f in h.futter) S.daten[f]-=h.futter[f];
  if(h.tempReset) p.temp="werk";
  if(h.rollback){
    /* Echter Rollback = Zustand VOR dem JÜNGSTEN Lauf (MH-040): war das ein Adapter-Training,
       verschwindet der Adapter; sonst werden die Stat-Deltas zurückgenommen. Jeder Lauf nur einmal, nie der Rollback selbst. */
    const letzter=rollbackLauf;
    if(letzter){
      if(letzter.detail&&letzter.detail.startsWith("Adapter erzeugt")){
        const i=(p.adapters||[]).length-1;
        if(i>=0) p.adapters.splice(i,1);            // der Lauf hat nie stattgefunden – der Adapter mit ihm
      }
      if(letzter.delta) for(const kk in letzter.delta) p.w[kk]=kl(p.w[kk]-letzter.delta[kk],2,99);
      letzter._zurueckgerollt=true;
      p.historie.push({tag:S.tag,n:"Checkpoint-Rollback",ausgang:"Lauf '"+letzter.n+"' zurückgenommen",delta:{},kur:true});
      p.uebertrainKarenz=S.tag+2;   /* Ära 7.5 (T-11): nach dem Rollback zwei Tage Karenz */
    }
  }
  const alt=p.krank;
  p.krank=null; p.krankSeit=null;
  if(alt==="kontextrot") p.ctxLastTage=0;
  else if(alt==="halluzinose") p.schlechtFutterTage=0;
  else if(alt==="schleifenfieber") p.kaltTage=0;
  p.historie.push({tag:S.tag,n:h.n,ausgang:KRANKHEITEN[alt].n+" geheilt",delta:{},kur:true});
  melde("💚 "+p.name+" ist wieder gesund ("+h.n+")","gut");
  if(alt==="schleifenfieber"&&(p.synthGen||0)>=3) melde("🧬 Die Synthetik-Inzucht bleibt als Rückfallrisiko sichtbar – künftig echtes, vielfältiges Futter einsetzen.","info");
  xpDazu(15);
  alles(); sichern(); zeigeTier(uid);
}

  let p=0.48*hlStromFaktor(); // Spieltarif, kein realer Stromvertrag
  aktiveEffekte("strompreis").forEach(e=>p*=Math.max(0.1,1+e.wert));   // effekt.wert ist relativ: +0.5 → ×1.5

/* ── Buchungsjournal: JEDE Geldbewegung läuft hier durch (MH-009) ──

        foerderung|strafe|zins|pflege|zucht|arena|agentenwelt|sonst */
function buche(betrag,kat,text){
  betrag=Math.round(endlich(betrag,0)*100)/100;
  if(betrag===0) return 0;
  S.kredit=Math.round((endlich(S.kredit,0)+betrag)*100)/100;
  S.journal=S.journal||[];
  S.journal.push({tag:S.tag,b:betrag,kat,t:text||kat});
  if(S.journal.length>500) S.journal=S.journal.slice(-400);
  if(betrag>0) S.statistik.einnahmen+=betrag; else S.statistik.ausgaben+=-betrag;
  return betrag;
}

  for(const k in f) if(k!=="rechenhaus"&&k!=="hofloop"&&o[k]===undefined) o[k]=f[k];
  o.kredit=endlich(o.kredit,0); o.xp=endlich(o.xp,0); o.ruf=endlich(o.ruf,0); o.co2=endlich(o.co2,0);

/* VRAM-Bedarf in GB: Gewichte + Kontext-Cache + Laufzeit-Reserve (MH-018).
   Cache-Näherung ist eine gekennzeichnete SPIELANNAHME: volle/GQA-Attention wächst mit dem
   reservierten Arbeitsfenster, lineare/SSM-Hybride halten nur einen kleinen Zustands-Anteil. */
function ctxCacheGB(p){
  if(p.api||archVon(p)==="hrm") return 0;
  const arbeitsCtx=Math.min(p.ctx||8,32);               // reserviert wird ein 32k-Arbeitsfenster (übliches Serving-Fenster), nicht das Kontextmaximum
  const proK=0.049*Math.pow(Math.max(0.5,p.pT),0.45);   // GB je 1k Token (GQA-Näherung, Spielannahme)
  const anteil=(archVon(p)==="ssmh"||archVon(p)==="linh")?0.15:1;
  return Math.round(arbeitsCtx*proK*anteil*10)/10;
}
function vramPig(p){
  if(p.api) return 0;
  if(archVon(p)==="hrm") return 0.5;                    // Winzlinge: passt überall
  if(typeof merkmalHat==="function"&&merkmalHat(p,"kompakt")) return Math.round(vramPigRoh(p)*0.95*100)/100;   /* Ära 8: Merkmal Kompakt */
  return vramPigRoh(p);
}
function vramPigRoh(p){
  const bpw=quantVon(p.quant).bpw;
  const gewichte=p.pT*bpw/8;
  const reserve=(typeof skillAktiv==="function"&&skillAktiv("speicherpfleger"))?1.0:1.5;   /* Skill: Paged-KV-Cache senkt den Overhead */
  return Math.round((gewichte+ctxCacheGB(p)+reserve)*10)/10;
}
function vramTeile(p){ const bpw=quantVon(p.quant).bpw;
  return {gewichte:Math.round(p.pT*bpw/8*10)/10, cache:ctxCacheGB(p), reserve:(typeof skillAktiv==="function"&&skillAktiv("speicherpfleger"))?1.0:1.5}; }
